xam point is telling virus from worm by how they spread. Common mistake: writing only that they are all malicious programs without the difference."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/物理网络威胁与零日漏洞 zero day vulnerabilities": {"name": "Physical network threats and zero day vulnerabilities", "note": "Physical threats are direct harm to hardware and the environment: devices stolen or lost, storage media carried away, cables and ports open to anyone, server rooms broken into. A zero-day vulnerability is a flaw the vendor has not yet found or patched, exploited by attackers before a fix exists, so the harm is great and defence is hard. Countermeasures include door access control and surveillance, encrypted storage, least privilege, prompt patching, layered defences and intrusion detection. Common mistake: assuming that installing antivirus software means you are safe."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/内部威胁：设备丢失被盗、凭证泄露、员工滥用": {"name": "Internal threats: lost and stolen devices, credential leaks, employee misuse", "note": "The threat comes from people inside the organisation or from internal credentials: laptops and mobile devices lost or stolen leak data; passwords phished, weak or shared cause credential leakage; employees use their access to go beyond their authority, send data out or install unauthorised software. Defence rests on least privilege, multi-factor authentication, activity logs and auditing, offboarding and device return procedures, and regular training. Common mistakes are focusing only on external attacks, or equating every insider threat with a malicious employee."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/安全解决方案：日志分析、反恶意软件、防火墙过滤、访问控制列表 ACL": {"name": "Security solutions: log analysis, anti-malware, firewall filtering, access control lists ACL", "note": "Log analysis regularly reviews system and network logs to spot intrusion from unusual patterns such as masses of failed logins; anti-malware uses signature databases to detect and remove known viruses and ransomware; a firewall monitors and filters incoming and outgoing traffic by rules; ACLs use rules based on IP address, protocol or port to decide whether to allow or deny. An answer must match each measure to the threat. Common mistakes are thinking anti-malware is enough, or not knowing how ACLs and firewalls divide the work."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/安全解决方案：入侵防御系统 IPS、虚拟专用网 VPN、用户培训、ICT 行为准则、物理安全": {"name": "Security solutions: intrusion prevention systems IPS, virtual private networks VPN, user training, ICT codes of conduct, physical security", "note": "An IPS monitors traffic in real time and actively blocks suspicious behaviour (an IDS only alerts and does not block); a VPN builds an encrypted tunnel over an untrusted network to protect remote traffic; user training uses courses and simulated phishing to sharpen recognition of phishing, weak passwords and careless link clicking; an ICT code of conduct sets out acceptable use of IT resources, user responsibilities and the consequences of breaches; physical security protects equipment with access control, surveillance and locked racks. Common mistakes are confusing IDS with IPS, or listing measures without explaining the principle."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/安全框架 CIA 三元组：机密性 confidentiality、完整性 integrity、可用性 availability": {"name": "Security framework CIA triad: confidentiality, integrity, availability", "note": "The standard framework for analysing a security incident: confidentiality means data is accessed only by authorised parties (disclosure breaks it); integrity means data is accurate and unaltered (modification breaks it); availability means authorised users can use the system when they need it (downtime from a DDoS breaks it). The method is to take an incident, first judge which one or more of the three it breaks, then give targeted protection. Common mistakes are conflating confidentiality with integrity, or answering only one of them and stopping there."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/安全框架 AAA：认证 authentication、授权 authorisation、计费/审计 accounting": {"name": "Security framework AAA: authentication, authorisation, accounting", "note": "Three stages in controlling network access: authentication confirms who the user is (passwords, biometrics, multi-factor authentication); authorisation decides what that identity may do (permissions assigned by role, least privilege); and accounting records and traces their behaviour (logs, usage statistics), for later accountability and for finding anomalies. An answer should follow the chain of identity, permissions and activity record. Common mistakes are swapping authentication and authorisation, or omitting accounting altogether."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/密码学：对称加密 vs 非对称加密（公钥/私钥）；证书 certificate 的用途": {"name": "Cryptography: symmetric vs asymmetric encryption (public key/private key); uses of certificates", "note": "Symmetric encryption uses the same key to encrypt and decrypt: it is fast and suits bulk data, but delivering the key safely to the other party is the hard problem; asymmetric encryption uses a key pair, with the public key openly shareable and used to encrypt or verify, and the private key kept by its owner and used to decrypt or sign, which solves distribution but is slow. A digital certificate is issued by a trusted certificate authority and binds a public key to the holder's identity, which is how a browser verifies that a website is genuine. Common mistake: reversing the uses of the public and private keys."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/加密方法演变：替换密码、维吉尼亚密码、Enigma、DES（56 位密钥）": {"name": "Evolution of encryption methods: substitution ciphers, Vigenère cipher, Enigma, DES (56-bit key)", "note": "The early methods each had a fatal weakness: a substitution cipher replaces characters by a fixed rule and falls to letter frequency analysis; the Vigenere cipher combines plaintext and ciphertext using a repeating key, and once the key length is guessed frequency analysis still breaks it; mechanical encryption such as Enigma never encrypted a letter as itself; DES was the first digital encryption standard, but its 56-bit key is too short and falls to brute force on modern computing power. Common mistake: saying only that it is insecure without naming the weakness."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/现代最佳实践：AES（128/192/256 位）、RSA（2048–4096 位）、ECC、密钥管理与 NIST 指南": {"name": "Modern best practices: AES (128/192/256-bit), RSA (2048–4096-bit), ECC, key management and NIST guidelines", "note": "AES is the symmetric standard that replaced DES, with key lengths of 128, 192 or 256 bits, and it has not been broken; RSA is an asymmetric algorithm with 2048-4096 bit keys based on the product of large primes, secure but slow; ECC is a less resource-hungry asymmetric alternative with shorter keys and faster operations. Key management requires keeping private keys secret, backing them up off site, using keys long enough to resist brute force, and monitoring access with audit logs, following NIST guidance. Common mistake: mixing up the key lengths of AES and RSA."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/互联网安全通信：用非对称加密建立连接 + 用对称加密交换数据": {"name": "Secure internet communication: establishing a connection with asymmetric encryption + exchanging data with symmetric encryption", "note": "Secure communication uses a hybrid scheme: first obtain the public key from the server's certificate and use asymmetric encryption to verify identity and safely agree a session key, then switch to symmetric encryption for the data itself. This is because asymmetric encryption is secure but slow, so it is used only to establish the connection, while symmetric encryption is fast and suited to carrying large amounts of data. In HTTPS the browser and server work exactly this way. Common mistakes are thinking the whole session is asymmetric, or not being able to say why two kinds are needed."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 3 · 网络安全 Cyber security/道德黑客与渗透测试：蓝队 blue team vs 红队 red team；法律与伦理责任": {"name": "Ethical hacking and penetration testing: blue team vs red team; legal and ethical responsibilities", "note": "An ethical hacker simulates attacks under authorisation to find and fix vulnerabilities before a real attacker does, and the scope of testing can cover networks, applications, devices and even people (social engineering). The red team plays the attacker trying to break in, while the blue team is the internal defence, monitoring, detecting and responding to incidents and hardening the defences. All testing needs written authorisation and a defined scope, and any vulnerability found may only be used for fixing it. Common mistakes are reversing the red and blue roles, or ignoring authorisation and legal boundaries."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management": {"name": "Topic 4 · Data Management", "note": "Unit 4, Part 2; the core is relational database design and SQL"}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/关系数据库组织：实体 entities、属性 attributes、关系（1:1 / 1:M / M:N）": {"name": "Relational database organisation: entities, attributes, relationships (1:1 / 1:M / M:N)", "note": "An entity is a real-world object to be recorded in the database (a student, a course), attributes are the characteristics describing an entity (student ID, name), and relationships describe the business links between entities, divided into one-to-one, one-to-many and many-to-many. For one-to-many, put a foreign key in the many table pointing at the primary key of the one side; many-to-many must introduce a linking entity and split into two one-to-many relationships; one-to-one can often be merged into a single table. Common mistakes are drawing a many-to-many as two tables joined directly, or putting the foreign key in the wrong table."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/表作为实体的实现：字段 fields 与记录 records": {"name": "Tables as the implementation of entities: fields and records", "note": "A table is how an entity is realised in the database. Fields (columns) define a kind of data and its type, records (rows) are individual instances, and the primary key uniquely identifies each row. In an answer, list the field names and data types first, then the constraints, and finally represent records in words or sample data. Common mistakes are swapping field and record, or forgetting the primary key so records cannot be uniquely identified and duplicates appear."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据类型：integer / float / Boolean / text / date": {"name": "Data types: integer / float / Boolean / text / date", "note": "Five types you must know: integer stores whole numbers for numbering and counting; float stores decimals for measurement and averages; Boolean holds only true and false for states and flags; text stores strings for names, addresses and similar; date stores dates for birthdays and enrolment dates. The choice affects storage efficiency and which operations are possible. Common mistakes are storing postcodes or phone numbers as integers and losing leading zeros, or using float for money and getting precision errors."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/主键 primary key、外键 foreign key、复合键 composite key": {"name": "Primary key, foreign key, composite key", "note": "A primary key uniquely identifies each record in a table, and its values must be neither duplicated nor null; a foreign key is a field that references another table's primary key, used to create links between tables and enforce referential integrity; a composite key is a primary key made up of two or more fields together, unique only as a combination, and is common in linking tables that resolve many-to-many relationships. Common mistakes are treating a foreign key as necessarily unique (it may repeat), or setting a primary key on a field that can be null."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据异常 data anomalies：插入、更新、删除异常": {"name": "Data anomalies: insertion, update and deletion anomalies", "note": "A non-normalised table produces three kinds of problem when data is added, changed or removed. Update anomaly: the same data is stored repeatedly across records, and changing only some of them makes it inconsistent. Delete anomaly: deleting one record also throws away other information that appeared only there. Insert anomaly: a record cannot be added because the data is incomplete. All three come from redundancy and poor dependencies, and the cure is normalisation. Common mistake: reciting the names without being able to give a concrete triggering scenario."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据库与其他系统交互：ODBC；事务 ACID（原子性/一致性/隔离性/持久性）": {"name": "Database interaction with other systems: ODBC; ACID transactions (atomicity/consistency/isolation/durability)", "note": "ODBC (Open Database Connectivity) is a standard interface that lets programs such as Python connect to a database and run SQL without rewriting code for each product, which is how a database interacts with other systems. A transaction is a group of operations that either all take effect or all roll back, and ACID means atomicity, consistency, isolation and durability, guaranteeing reliable data under concurrency and failure. A transfer is the classic example: the debit and the credit must belong to one transaction. Common mistake: attributing the four properties to the wrong terms."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据字典 data dictionary：元素名、数据类型、长度、描述、约束": {"name": "Data dictionary: element name, data type, length, description, constraints", "note": "A document recording the metadata of every element in the table structure, with five required columns: element name, data type, length or size, a brief description (what it stores, its format and default value) and constraints (unique or not, nullable or not, primary or foreign key). It is the basis for communication between developers and for later maintenance, so it must be written precisely rather than vaguely. Common mistakes are listing field names without constraints or descriptions, or setting the length too small for the real data that comes later."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/ER 图（鸦爪记法 crow's foot）：分析 3–10 张表的 ER 图、创建 3–8 张表": {"name": "ER diagrams (crow's foot notation): analysing ER diagrams of 3–10 tables, creating 3–8 tables", "note": "Crow's foot notation shows entities and their relationships: entities as boxes with attributes listed inside, relationships as connecting lines, the crow's foot symbol on the many end, a small circle for optional participation and a bar for mandatory participation. The skill required is to read an ER diagram of up to 10 tables and to draw your own design of 3 to 8 tables. Common mistakes are putting a foreign key in the wrong table, missing the linking entity for a many-to-many relationship, and pointing the crow's foot and bar the wrong way."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/关系记法 relational notation；解析 M:N 关系（引入连接实体）": {"name": "Relational notation; resolving M:N relationships (introducing a linking entity)", "note": "Write the design as relation name(attribute1, attribute2, ...), with the primary key underlined and foreign keys marked FK. A many-to-many relationship must be split into three tables: one for each original entity plus a linking entity table whose primary key is a composite of the two primary keys, so that the same combination is never recorded twice. Common mistakes are writing only two tables yet claiming the many-to-many is resolved, or leaving one of the two foreign keys out of the linking table."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据完整性：参照完整性、域完整性、实体完整性": {"name": "Data integrity: referential integrity, domain integrity, entity integrity", "note": "Three kinds of integrity keep data trustworthy. Referential integrity: a foreign key value must exist in the referenced table's primary key, otherwise orphan records appear. Domain integrity: a field's value must fall within the permitted type, range or format, enforced by data types, CHECK and NOT NULL. Entity integrity: the primary key is unique and not null, so every record can be uniquely identified. Common mistakes are swapping referential and entity integrity, or thinking a foreign key can point at any field."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/数据质量因素：时效性 currency、真实性 authenticity、相关性 relevance、准确性 accuracy、离群值剔除": {"name": "Data quality factors: currency, authenticity, relevance, accuracy, removal of outliers", "note": "Five angles for judging whether data is usable: currency, whether it is updated in time and still within its valid period; authenticity, whether the source is reliable and the data unaltered; relevance, whether it relates to the purpose of this analysis; accuracy, whether the values and formats are correct; and outlier removal, identifying and dealing with values that clearly deviate. An answer should judge each one and give a reason. Common mistake: deleting every outlier outright without first judging whether it is a data entry error or a genuine extreme case."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/规范化 Normalisation：1NF 原子值且无重复属性": {"name": "Normalisation: 1NF with atomic values and no repeating attributes", "note": "The first step of normalisation. 1NF requires every field to be an atomic value, with one item in a cell (not MATH1001, COMP1001), no repeating attribute groups (no columns such as Course1, Course2, Course3) and every record uniquely identified by the primary key. The method is to split the repeating attributes into a new table and add a foreign key in the original table pointing to it. Common mistake: splitting the comma-separated values but keeping the repeating columns."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/2NF 无部分依赖 partial dependency；3NF 无传递依赖 transitive dependency": {"name": "2NF with no partial dependency; 3NF with no transitive dependency", "note": "The decisions turn on dependencies. 2NF: satisfy 1NF and have no partial dependency, meaning a non-key attribute must not depend on only part of a composite key (for example CourseName determined by Course alone); a relation whose primary key is a single field satisfies 2NF automatically. 3NF: satisfy 2NF and have no transitive dependency, meaning a non-key attribute must not depend on the primary key indirectly through another non-key attribute (for example ResultDescription determined by Result)."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 建表与修改：CREATE / MODIFY / DROP，用约束保证数据有效性": {"name": "SQL table creation and modification: CREATE / MODIFY / DROP, using constraints to ensure data validity", "note": "CREATE TABLE name(field type constraint, ...) creates a table, with PRIMARY KEY for the primary key, NOT NULL for required fields and UNIQUE for unique ones; MODIFY (ALTER TABLE in MySQL) changes a field's type or adds and removes constraints; DROP TABLE IF EXISTS removes a table. Constraints are the first line of defence for data validity. Common mistakes are dropping and recreating a table to change its structure, losing the data, or letting a foreign key's type drift out of line with the primary key it references."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 数据操作：SELECT / INSERT / UPDATE / DELETE（含级联删除 cascading deletes）": {"name": "SQL data manipulation: SELECT / INSERT / UPDATE / DELETE (including cascading deletes)", "note": "Four basic statements: SELECT fields FROM table WHERE condition to query; INSERT INTO table(fields) VALUES(values) to insert; UPDATE table SET field=value WHERE condition to modify; DELETE FROM table WHERE condition to delete. Cascading deletes means that deleting a record in the parent table automatically deletes the records in the child table that refer to it, which maintains referential integrity. Common mistake: leaving out WHERE and changing or wiping the entire table in one go."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 聚合：COUNT / SUM / AVG / MAX / MIN": {"name": "SQL aggregates: COUNT / SUM / AVG / MAX / MIN", "note": "Five aggregate functions reduce many rows to a single value: COUNT counts rows, SUM totals them, AVG averages, MAX takes the largest and MIN the smallest. They are written as SELECT AVG(field) FROM table WHERE condition, usually with GROUP BY for per-group figures; combined with a calculated field they need an alias using AS, as in SELECT AVG(Grade) AS AverageGrade. Common mistakes are putting an aggregate function straight into WHERE, or taking SUM of a text field."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 分组与排序：ORDER BY、GROUP BY、HAVING、DISTINCT": {"name": "SQL grouping and sorting: ORDER BY, GROUP BY, HAVING, DISTINCT", "note": "GROUP BY groups rows by a field before aggregate functions summarise each group; HAVING filters groups after grouping, whereas WHERE filters rows before grouping, which is the key distinction; ORDER BY sorts, ascending by default and descending with DESC; DISTINCT removes duplicate rows from the result. Common mistakes are putting an aggregate condition in WHERE, or omitting GROUP BY while summarising non-aggregated fields."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 多表内连接 inner join（最多 4 张表）、计算字段、拼接字段、别名 aliases": {"name": "SQL multi-table inner joins (up to 4 tables), calculated fields, concatenated fields, aliases", "note": "An inner join keeps only the rows where the join condition matches in both tables, written SELECT ... FROM table1 INNER JOIN table2 ON table1.foreign_key = table2.primary_key, and up to 4 tables can be joined; a calculated field derives a new value from an expression (such as unit price * quantity) and a concatenated field combines several text fields into one, both needing an alias with AS. Common mistakes are leaving out the ON condition, which produces a Cartesian product, or omitting aliases so field names are ambiguous."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/SQL 运算符：AND、OR、NOT、ANY、BETWEEN、EXISTS、IN、LIKE（通配符 % 与 _）": {"name": "SQL operators: AND, OR, NOT, ANY, BETWEEN, EXISTS, IN, LIKE (wildcards % and _)", "note": "AND requires both sides to be true, OR needs only one side true, NOT negates; BETWEEN tests whether a value falls within a range; IN tests whether a value belongs to a list; EXISTS tests whether a subquery returns rows; ANY is true when any one comparison holds; LIKE does pattern matching, where % stands for any number of characters and _ for a single character. Common mistakes are swapping what % and _ do, or writing the bounds of BETWEEN the wrong way round."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/开发中的伦理问题：个人数据收集、隐私顾虑、数据来源可靠性、来源标注、数据挖掘": {"name": "Ethical issues in development: collection of personal data, privacy concerns, reliability of data sources, source attribution, data mining", "note": "Ethical points to weigh when handling data: collecting personal information requires informed consent and only the necessary scope; respect individuals' control over their own data and anonymise where needed; verify that sources are reliable and accurate; credit the source when using other people's data; and make data mining transparent, avoiding algorithmic discrimination and the inference of sensitive information. An answer should use a case to show who is affected and what harm may follow. Common mistake: repeating that privacy must be protected without applying it to a situation."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/Topic 4 · 数据管理 Data Management/开发中的安全与法律问题：数据保密与备份、访问限制、数据所有权、澳大利亚隐私原则 APP 5/8/10/11/12": {"name": "Security and legal issues in development: data confidentiality and backup, access restrictions, data ownership, Australian Privacy Principles APP 5/8/10/11/12", "note": "Security and legal issues to handle when developing a database: store sensitive data encrypted; back up on a 3-2-1 strategy (3 copies, 2 on different local devices, 1 off site) and rehearse recovery regularly; restrict access on least privilege; and make data ownership and control explicit in contracts. Legally this corresponds to the Australian Privacy Principles: APP 5 notification of collection, APP 8 cross-border disclosure, APP 10 data quality, APP 11 security and APP 12 access rights."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源": {"name": "Languages, Tools and Assessment Resources", "note": ""}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/编程语言 Python（课程指定，ATAR 考试用）；算法用 SCSA 规范伪代码表达": {"name": "Programming language Python (specified by the course, used in the ATAR exam); algorithms expressed in SCSA standard pseudocode", "note": "Python is the programming language specified for the course and used in the ATAR exam, and in the real exam you must be able to write a working program directly; algorithm questions may be answered in SCSA standard pseudocode, whose conventions are given in the Additional Syllabus Support Booklet: keywords in capitals, structures explicitly closed, a single equals for assignment and a double equals for comparison. Revision focuses on being able to write and debug: control structures, functions and parameter passing, arrays and dictionaries, and the searching and sorting algorithms, all implemented independently."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/数据库：推荐 SQLite，另附 MySQL with VSCode 指南；建模用鸦爪 ER 记法与关系记法": {"name": "Databases: SQLite recommended, plus a MySQL with VSCode guide; modelling uses crow's foot ER notation and relational notation", "note": "The course uses SQLite for hands-on database work, since it needs no server and its syntax matches the syllabus; a guide to installing and using MySQL with VSCode is also available as an option; in design you draw ER diagrams in crow's foot notation and then write the design as relation name(attributes...) in relational notation. Common mistakes are skipping modelling and creating tables directly, which causes repeated rework, or not knowing the syntax well enough to write cross-table queries and grouped summaries."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/网络制图用 CISCO 拓扑图标规范；排障工具 ping、traceroute": {"name": "Network diagrams use CISCO topology icon conventions; troubleshooting tools ping, traceroute", "note": "For the networking part you must draw topology diagrams to the Cisco icon convention, using different icons for routers, switches, wireless access points and firewalls, and lines for links and subnets; the troubleshooting tools are ping, which checks whether a target is reachable and gives the round-trip time and packet loss, and traceroute, which shows the path hop by hop with the time for each. Common mistakes are mixing icons or leaving out end devices, or not knowing the troubleshooting order of pinging the gateway before running traceroute."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/明确不要求开发图形用户界面 GUI（程序与数据库均不要求）": {"name": "Development of a graphical user interface GUI is explicitly not required (required for neither programs nor databases)", "note": "Neither the course nor the exam requires a graphical user interface: programs can use command-line input and output, and for databases you only need to run SQL at the command line or in a tool, so all your time should go into control structures, data structures, algorithms and table design. Knowing this stops you wasting effort on GUI libraries. Common mistake: spending a great deal of project time on an interface and squeezing out functionality and testing."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/校本考核四类：Project 项目、Theory test 理论测试、Practical test 实操测试、Examination 考试": {"name": "Four types of school-based assessment: Project, Theory test, Practical test, Examination", "note": "School-based assessment has four task types: the project examines the full technology process and its documentation, theory tests examine concepts and scenario analysis, practical tests require working code or SQL written within a time limit, and the examination covers everything. Prepare separately for each format: concepts by restating and explaining, practical work by writing code by hand repeatedly, and the project by keeping good design and test records as you go."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/WACE 外部考试：3 小时 + 10 分钟阅读；Section 1 简答 40% + Section 2 扩展回答 60%，考场提供 Source Booklet 刺激材料册": {"name": "WACE external exam: 3 hours + 10 minutes reading time; Section 1 short answer 40% + Section 2 extended response 60%, a Source Booklet of stimulus material is provided in the exam room", "note": "The external exam runs 3 hours with an extra 10 minutes of reading time; Section 1 is short answer and counts for 40%, Section 2 is extended response and counts for 60%. A Source Booklet of stimulus material is provided, and questions may ask you to analyse it; the material can include ER diagrams, network diagrams, data dictionaries, desk checking tables and pseudocode extracts. Manage your time, develop extended answers from the material, and avoid the common mistakes of ignoring the reading time and missing conditions in the material."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Topic 讲义 PPT：编程 235 页、网络通信 55 页、网络安全 72 页、数据管理 163 页": {"name": "Topic lecture PPTs: Programming 235 pages, Network Communication 55 pages, Cyber Security 72 pages, Data Management 163 pages", "note": "The lecture slides for the four topics, with the page counts directly reflecting how much each topic weighs: programming is heaviest (235 pages), data management next (163 pages), cyber security 72 pages and network communication 55 pages. Use this to allocate revision time; the slides explain every syllabus point with worked examples, so they suit consolidating along the main line after reading the textbook, checked against each topic's homework and past papers."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Past ATAR Course Exam（452 页）：2016–2025 全套 WACE 试卷 + Source Booklet": {"name": "Past ATAR Course Exam (452 pages): complete set of 2016–2025 WACE papers + Source Booklets", "note": "A collection of past WACE papers from 2016 to 2025 with each year's Source Booklet, the practice material closest to the real exam. Use it by sitting whole papers under time, then correcting every question against the marking approach afterwards, and summarising the question types that keep recurring, such as subnetting, normalisation to 3NF, multi-table SQL queries, Big O comparisons and error-type classification. Common mistake: reading the answers without writing, so in the exam you cannot produce the full working."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Reading Materials（159 页）：Introduction to Scientific Programming with Python 及网络安全专题阅读": {"name": "Reading Materials (159 pages): Introduction to Scientific Programming with Python and cyber security topic readings", "note": "Reading material supplied with the course. The main part is Introduction to Scientific Programming with Python, which supplements Python syntax and programming approach; there is also cyber security reading covering attack types and technical detail. It suits going deeper than the slides, for example understanding how exception handling is written, common dictionary and list operations, and the technical mechanisms of attacks such as DoS and MITM."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Mentor Worksheet 9 份（W1–W9）：从算术运算、循环、伪代码追踪表，到网络、数据库规范化、网络安全": {"name": "9 Mentor Worksheets (W1–W9): from arithmetic operations, loops and pseudocode trace tables, to networks, database normalisation and cyber security", "note": "Nine mentor worksheets arranged in increasing difficulty: the early ones practise arithmetic operations, selection and loops, pseudocode and desk checking tables; the middle ones move into network components and subnetting; the later ones cover database modelling, normalisation and cyber security. They suit immediate checking after each chapter, and questions you get wrong should send you back to the matching slides. Common mistake: doing only the questions you can already answer and skipping hands-on line-by-line exercises such as desk checks."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Lab Practice（50 页）与 Homework：良好编程实践汇报、网络组件信息图、WACE 真题练习": {"name": "Lab Practice (50 pages) and Homework: presentation on good programming practice, network components infographic, WACE past-paper practice", "note": "A collection of practical exercises and homework in varied formats: good programming practices presented as a group talk (explaining the practice, why it matters and comparing good and bad code), an infographic on network components, plus pseudocode rewriting, splitting functions and WACE past-paper practice. Answers to these tasks are in the Handouts in your personal section, so they can be used for self-testing. Common mistake: submitting without doing the work and missing the chance to code and draw by hand."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Course Introduction（100 页）：SCSA syllabus 全文、Additional Syllabus Support Booklet（伪代码/算法/协议表/CISCO 图例/ER 图/SQL 速查）": {"name": "Course Introduction (100 pages): full SCSA syllabus, Additional Syllabus Support Booklet (pseudocode/algorithms/protocol tables/CISCO legends/ER diagrams/SQL quick reference)", "note": "Course introduction material containing the full SCSA syllabus and the Additional Syllabus Support Booklet. The latter is the most practical quick-reference: pseudocode conventions and command tables, control structure examples, search and sort algorithm code, DoS and encryption methods, the protocol table for each layer, Cisco network icons, ER diagram and data dictionary examples, a full 1NF to 3NF derivation, and a table of common SQL syntax."}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/个人栏目：Class Notes、Handouts（含全部作业答案）、Homework、Quizzes": {"name": "Personal section: Class Notes, Handouts (including all assignment answers), Homework, Quizzes", "note": "Four sections in OneNote that belong to you: Class Notes for key points from class, Handouts with the slides and the answers to all the homework, Homework holding each set of homework, and Quizzes with the tests so far. The most valuable for revision are the quizzes and the homework answers, which pinpoint the topics you keep getting wrong. Common mistake: only reading notes instead of redoing wrong questions, so the same errors come back in the exam."}, "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/指数函数求导：e 的引入 lim(h→0)(aʰ−1)/h、d/dx(eˣ)=eˣ、A·e^(kx) 建模": {"name": "Differentiating exponential functions: introducing e via lim(h→0)(aʰ−1)/h, d/dx(eˣ)=eˣ, modelling with A·e^(kx)", "note": "e is the only base for which lim(h→0)(aʰ−1)/h equals 1, hence d/dx(eˣ)=eˣ; by the chain rule d/dx(e^(kx))=k·e^(kx), and in the model A·e^(kt) a positive k gives growth while a negative k gives decay. Common error: assuming d/dx(aˣ)=aˣ for any base (it should be aˣ·ln a)."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/常数：G = 6.67×10⁻¹¹、M_E = 5.97×10²⁴ kg、R_E = 6.37×10⁶ m、地月距离 3.84×10⁸ m": {"name": "Constants: G = 6.67×10⁻¹¹, M_E = 5.97×10²⁴ kg, R_E = 6.37×10⁶ m, Earth–Moon distance 3.84×10⁸ m", "note": "These constants must be taken from the formula and data sheet before calculating: gravitational constant G=6.67×10⁻¹¹ N·m²·kg⁻², mass of the Earth 5.97×10²⁴ kg, radius of the Earth 6.37×10⁶ m, and mean Earth–Moon distance 3.84×10⁸ m. When using R_E note that the data sheet gives 6.37×10⁶ m."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/平均电动势 ε_avg = 4BANf；用右手定则与楞次定律判断正负端": {"name": "Average emf ε_avg = 4BANf; using the right-hand rule and Lenz's law to determine the positive and negative terminals", "note": "Over one complete period the average of a sinusoidal emf is zero, so “average emf” normally means the average over a quarter or a half period, for which ε_avg=4BANf can be used. To decide which output terminal is positive, first use Lenz’s law to find the direction of the induced magnetic field and then the right-hand grip rule to find the current direction; the end the current leaves is the positive terminal."}};

// 记住当前语言
let LANG = "zh";
try { const s = localStorage.getItem("mm-lang"); if (s) LANG = s; } catch(e) {}

// 只重算文字与尺寸，不动 _open（normalize 会把展开状态重置成 d<2，不能用）
function refreshDims(n, d, color){
  n._depth = d;
  if (n.color) n._color = n.color;
  n._lines = wrapText(n.name, d, MAX_W);
  n._w = Math.max(46, Math.max.apply(null, n._lines.map(l => textW(l, d))) + PAD_X*2 + (n.children && n.children.length ? 16 : 0));
  n._h = n._lines.length > 1 ? NODE_H + (n._lines.length-1)*15 : NODE_H;
  if (n.children) n.children.forEach(c => refreshDims(c, d+1, n._color));
}

// 按路径把 name/note 换成目标语言；源语言存在 _zh 里，便于来回切
function swapLang(n, lang, path, zhData){
  const p = path ? path + "/" + (n._zh ? n._zh.name : n.name) : (n._zh ? n._zh.name : n.name);
  if (!n._zh){ n._zh = { name: n.name, note: n.note || "" }; }
  const tr = I18N[p] || I18N[path];
  if (lang === "en" && tr && tr.name){
    n.name = tr.name;
    if (tr.note) n.note = tr.note;
  } else {
    n.name = n._zh.name;
    n.note = n._zh.note;
  }
  if (n.children) n.children.forEach(c => swapLang(c, lang, p, zhData));
}

function applyLang(lang, rerender){
  LANG = lang;
  try { localStorage.setItem("mm-lang", lang); } catch(e) {}
  swapLang(DATA, lang, "", null);
  refreshDims(DATA, 0, "#2f6fed");
  DATA._open = true;

  if (rerender){
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      const k = el.getAttribute("data-i18n");
      if (lang === "en" && UI_EN[k]) el.textContent = UI_EN[k];
      else el.textContent = k;
    });
    // 站内导航与返回链接的目标也要跟着语言换。
    // 导图只有一份文件（不像其他页中英各一份），但站点是两棵目录树，
    // 所以每个链接同时带 href（中文目标）与 data-href-en（英文目标），
    // 这里按当前语言选用，并把中文目标缓存在 data-href-zh 里以便切回。
    // 时间线按钮有两种状态文案，上面那个 data-i18n 循环只会写回基础文案，
    // 会把「已打开」的标签覆盖掉。按当前状态重新同步。
    (function(){
      const b = document.getElementById("btnTimeline");
      const box = document.getElementById("timeline");
      if (b && box) b.textContent = box.classList.contains("show")
        ? (lang === "en" ? "Back to map" : "返回导图")
        : (lang === "en" ? "Exam timeline" : "考试时间线");
    })();
    document.querySelectorAll("[data-href-en]").forEach(function(a){
      if (!a.getAttribute("data-href-zh")) a.setAttribute("data-href-zh", a.getAttribute("href"));
      a.setAttribute("href", lang === "en" ? a.getAttribute("data-href-en")
                                           : a.getAttribute("data-href-zh"));
    });
    const si = document.getElementById("search");
    if (si) si.placeholder = lang === "en" ? UI_EN["搜索知识点…"] : "搜索知识点…";
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    // 顶栏标题结构是 <h1 id="mmTitle">文字<small id="stat">计数</small></h1>。
    // 之前逐节点删除文本节点的写法把 <small> 也弄丢了（stat 变 null，render 报错），
    // 改为整体重建 h1，并把 small 一起重建，最稳。
    //
    // 选择器从 "header h1" 改成 "#mmTitle"：2026-10 导图套上站点外壳后，
    // 页面的第一个 <header> 变成了站点导航条，里面没有 h1，旧选择器会取到 null，
    // 标题与计数就不再跟着语言切换。
    const h1 = document.getElementById("mmTitle");
    if (h1) {
      const old = document.getElementById("stat");
      const cnt = old ? old.textContent : "";
      h1.textContent = lang === "en" ? "AUSMAT Study Notes — Mind Map" : "AUSMAT 学习资料思维导图";
      const sm = document.createElement("small");
      sm.id = "stat";
      sm.textContent = cnt;
      h1.appendChild(sm);
    }
    const btn = document.getElementById("btnLang");
    if (btn) btn.textContent = lang === "en" ? "中文" : "EN";
    const st = document.getElementById("sideTitle");
    const sb = document.getElementById("sideBody");
    if (st) st.textContent = lang === "en" ? "Click a node to see its details" : "点击导图中的节点查看说明";
    if (LAST_DETAIL) showDetail(LAST_DETAIL);
    else if (sb) sb.textContent = lang === "en" ? "Details of the selected topic appear here." : "这里会显示该知识点的具体内容。";
    // 图例标题是 buildLegend() 在 JS 字符串里拼的，不能用 data-i18n 注，
    // 只能在这里跟着语言重写。
    const lh = document.querySelector("#legend h2");
    if (lh) lh.textContent = lang === "en" ? UI_EN["科目（点击展开整科）"] : "科目（点击展开整科）";
    buildLegend();
    const lh2 = document.querySelector("#legend h2");
    if (lh2) lh2.textContent = lang === "en" ? UI_EN["科目（点击展开整科）"] : "科目（点击展开整科）";
  }
  render();
  if (rerender) fit(0.5);
}

(function init(){
  normalize(DATA, 0, "#2f6fed");
  // 默认开到第 2 层（科目 → 单元）。原来只开根节点，一进来只看到 6 个节点，
  // 要连着点 5 次才见到单元，低分学生走查说「不知道从哪看起」。
  (function openTo(n, d){
    n._open = d < 2;
    if (n.children) n.children.forEach(function(c){ openTo(c, d + 1); });
  })(DATA, 0);
  buildLegend(); buildTimeline(); render();
  // 可读比例，从根节点往下看；拖动查看其余。
  initialView();
  // 画布尺寸随窗口变化，重新适配一次（原来没有这个监听）
  let _rzT = null;
  // 打印前把当前展开的树导成缩进大纲 —— SVG 缩放打印不可读（见构建脚本注释）
  function buildPrintOutline(){
    const box = document.getElementById("printOutline");
    if (!box) return;
    const out = [];
    (function walk(n, d){
      if (!n._visible) return;
      const pad = "  ".repeat(d);
      const bullet = (n.children && n.children.length) ? "" : "· ";
      out.push("<div class=\"po-l po-d" + Math.min(d, 4) + "\">" + pad
        + bullet + esc(n.name) + "</div>");
      if (n.note) out.push("<div class=\"po-n po-d" + Math.min(d, 4) + "\">"
        + pad + esc(n.note) + "</div>");
      if (n._open && n.children) n.children.forEach(function(c){ walk(c, d + 1); });
    })(DATA, 0);
    box.innerHTML = "<h1>" + esc(DATA.name) + "</h1>"
      + "<p class=\"po-meta\">" + (LANG === "en" ? "Expanded topics only."
        : "只含当前展开的部分。") + "</p>" + out.join("");
  }
  window.addEventListener("beforeprint", buildPrintOutline);
  if (window.matchMedia) {
    try { window.matchMedia("print").addEventListener("change", function(e){
      if (e.matches) buildPrintOutline(); }); } catch (err) {}
  }

  window.addEventListener("resize", function(){ clearTimeout(_rzT); _rzT = setTimeout(function(){ applyTransform(); }, 150); });
})();

// 系统主题变化时重绘：节点底色读的是 CSS 变量，不会自动跟着变。
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))
    (function(){ render(); });
} catch(e) {}

// 启动完成后按记忆的语言再应用一次。
// 不能放进上面的 IIFE：那时 var UI_EN / var I18N 还未赋值。
if (LANG === 'en') applyLang('en', true);
</script>
</body>
