he centre of the sphere, so for a satellite in low orbit r is the Earth’s radius and not the altitude; forgetting to add the radius is a common error."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/重力场 g-field 与场线：指向质心、密度表示强度、永不相交": {"name": "Gravitational field (g-field) and field lines: directed towards the centre of mass, density indicates strength, never intersect", "note": "The gravitational field is described by field lines: they always point from infinity towards the centre of mass (into the body), the field is stronger where the lines are closer together, and no two field lines can cross, because then the field direction at that point would not be unique. Outside a uniform spherical shell the field is the same as that of a point mass with all the mass at the centre, a common result to be quoted."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/重力场强度 g = F/m = GM/r²（N/kg）；赤道与两极差异、海拔影响": {"name": "Gravitational field strength g = F/m = GM/r² (N/kg); difference between the equator and the poles, effect of altitude", "note": "Gravitational field strength is defined as the force per unit mass, g=F/m=GM/r², with the unit N/kg equivalent to m·s⁻². The value of g at the surface varies slightly with latitude: it is smallest at the equator because the radius is larger and part of the gravitational pull provides the rotation, and it decreases with altitude or down a mine shaft."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/轨道运动：引力提供向心力；v = √(GM/r)，与卫星质量无关": {"name": "Orbital motion: gravity provides the centripetal force; v = √(GM/r), independent of the satellite's mass", "note": "In a circular orbit gravity supplies exactly the centripetal force: GmM/r²=mv²/r, which gives v=√(GM/r). The orbital speed depends only on the mass of the central body and the orbital radius, not on the mass of the satellite. Here r must be measured from the centre of the Earth, that is Earth’s radius plus orbital altitude, and forgetting to add the radius is the most common reason for lost marks."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/轨道周期与开普勒第三定律 T²/r³ = 4π²/GM": {"name": "Orbital period and Kepler's third law T²/r³ = 4π²/GM", "note": "Using gravity as the centripetal force to find the period gives Kepler’s third law, T²/r³=4π²/GM, in which the ratio is fixed by the mass of the central body alone. The larger the orbital radius, the longer the period and the smaller the speed. It can be used to compare different central bodies or satellites, for example to deduce the mass of the Earth from the Moon’s period."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/开普勒第一定律（椭圆轨道）与第二定律（面积定律）": {"name": "Kepler's first law (elliptical orbits) and second law (law of areas)", "note": "The first law says that a planet moves in an elliptical orbit with the central body at one focus, so the planet–Sun distance varies periodically. The second law says that the line joining a planet to the Sun sweeps out equal areas in equal times, which is equivalent to the planet moving fastest at perihelion and slowest at aphelion and is fundamentally conservation of angular momentum."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/地球同步卫星（T = 24 h）；通信与电视广播应用": {"name": "Geostationary satellites (T = 24 h); applications in communications and television broadcasting", "note": "The period must equal the Earth’s rotation period, and T²=4π²r³/GM gives an orbital radius of about 4.2×10⁷ m, that is about 3.6×10⁷ m above the equator. It must stay directly above the equator, otherwise it would drift relative to the ground, and for this reason it cannot cover the polar regions."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/质心 barycentre（地月系统，力矩法）；LEO/MEO/GEO 与极轨/太阳同步轨道": {"name": "Barycentre (Earth–Moon system, torque method); LEO/MEO/GEO and polar/sun-synchronous orbits", "note": "For a binary system the barycentre satisfies m₁r₁=m₂r₂; the Earth–Moon barycentre lies about 1700 km below the Earth’s surface and both bodies actually orbit that point. Orbits are classified by altitude as low Earth orbit (LEO), medium Earth orbit (MEO) and geostationary orbit (GEO); a polar orbit gives global coverage and is used for remote sensing and weather observation."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡": {"name": "U3 · Torque and Equilibrium", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/力矩 τ = rF sinθ（单位 N·m）；力臂、支点、力的作用线": {"name": "Torque τ = rF sinθ (unit N·m); lever arm, pivot, line of action of the force", "note": "Torque τ=rF sinθ measures the turning effect of a force about an axis, and its unit N·m is a derived unit that must not be written as J. The angle θ is between the force and the lever arm, the perpendicular distance from the axis to the line of action of the force. When the line of action passes through the axis the lever arm is zero and the force produces no torque."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/符号约定：逆时针为正、顺时针为负": {"name": "Sign convention: anticlockwise positive, clockwise negative", "note": "Before writing the rotational equilibrium equation you must choose a positive direction of rotation, usually anticlockwise positive and clockwise negative, and keep it consistent throughout the question. A negative calculated torque only means the rotation is opposite to the convention; it does not mean the magnitude of the torque is negative. Changing the sign convention part-way through is a common way to lose marks."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/非垂直力的分解；净力矩": {"name": "Resolving non-perpendicular forces; net torque", "note": "When a force is not perpendicular to the rod there are two equivalent approaches: resolve the force into components along and perpendicular to the rod, of which only the perpendicular component produces torque, or find the lever arm of the whole force and multiply by it. The two methods must give the same answer and can be used to check each other. The net torque is the algebraic sum of all the torques, and its being zero is the condition for rotational equilibrium."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/平衡条件：ΣF = 0（平动平衡）+ Στ = 0（转动平衡）": {"name": "Conditions for equilibrium: ΣF = 0 (translational equilibrium) + Στ = 0 (rotational equilibrium)", "note": "A rigid body is in equilibrium only when both conditions hold: the net force is zero so it does not translate, and the net torque is zero so it does not rotate. The pivot may be chosen freely, and a clever choice makes the lever arm of an unknown force zero and so simplifies the equation. A single equation is usually not enough to solve for two unknowns."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/经典题型：跷跷板、梯子靠墙、跳水板、木板与绳索、悬臂梁": {"name": "Classic question types: seesaw, ladder against a wall, diving board, plank with a rope, cantilever", "note": "The standard approach for seesaws, ladders against a wall, diving boards, planks with ropes and cantilever beams is to draw a free body diagram, choose as pivot a point through which several unknown forces act, write Στ=0, and add ΣF=0 as needed. In a ladder problem note that the wall exerts only a normal force while the ground exerts both a normal force and friction, and a seesaw problem often requires the position of the centre of mass. Weight acts at the centre of gravity."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/撑杆与拉索 struts and ties": {"name": "Struts and ties", "note": "A strut is in compression and a tie is in tension; to decide which, isolate the member and see whether the forces at its two ends push it or pull it. In a truss-like structure, applying ΣF=0 at each joint in turn determines the internal force in every member, and a negative result means the actual force is opposite to the assumed direction."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/静平衡与质心；稳定性 stability": {"name": "Static equilibrium and centre of mass; stability", "note": "An object will not topple as long as its line of action of weight falls inside its base of support, which is when a restoring torque is available. Stability improves with a wider base and a lower centre of mass. To find the centre of mass of a composite body, weight each part by its mass rather than taking the geometric midpoint, and treat a hollow section as negative mass."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场": {"name": "U3 · Electrostatic Forces and Electric Fields", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电荷与电场；电场线（+向外/−向内、密度=强度、不可交叉）": {"name": "Charge and electric fields; electric field lines (+ outward / − inward, density = strength, must not cross)", "note": "An electric field surrounds every charge, and field lines run from positive charge to negative charge (or to infinity); the spacing of the lines shows the field strength, and no two field lines can cross. Field lines are a descriptive tool rather than real lines, and they are always perpendicular to the equipotential surfaces."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/库仑定律 F = kq₁q₂/r²；k = 9.00×10⁹ N·m²/C²、ε₀ = 8.85×10⁻¹²": {"name": "Coulomb's law F = kq₁q₂/r²; k = 9.00×10⁹ N·m²/C², ε₀ = 8.85×10⁻¹²", "note": "The force between two point charges is F=kq₁q₂/r², where k=1/(4πε₀)=9.00×10⁹ N·m²·C⁻². Substitute the charges with their signs so that attraction and repulsion can be distinguished, and the force acts along the line joining them. Coulomb’s law has the same form as Newton’s law of universal gravitation: both are inverse-square laws."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/三电荷以上：叠加原理（矢量和）": {"name": "Three or more charges: principle of superposition (vector sum)", "note": "The force exerted on a charge by several other charges is the vector sum of the individual forces, so find each magnitude and direction first and then add components; magnitudes must not simply be added or subtracted. For two equal like charges the net field strength at the midpoint is zero, whereas for two equal opposite charges it is a maximum there, a commonly examined symmetric case."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电场强度 E = F/q = kQ/r²（N/C 或 V/m）；试探电荷 test charge": {"name": "Electric field strength E = F/q = kQ/r² (N/C or V/m); test charge", "note": "Electric field strength is the electric force per unit positive charge, E=F/q=kQ/r², and its direction is the direction of the force on a positive charge; the unit N/C is equivalent to V/m. E is a property of the field and does not depend on whether a test charge is placed there, and the test charge must be small enough not to disturb the original field."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电场中的功与能：W = Eqd = qΔV；W = ΔE_k": {"name": "Work and energy in an electric field: W = Eqd = qΔV; W = ΔE_k", "note": "The work done by an electric field is W=qEd=qΔV, determined only by the potential difference between the start and end points and not by the path, so the electrostatic force is conservative. Combined with the work–energy theorem W=ΔE_k it gives the speed of a particle directly from the accelerating voltage, for example v=√(2qV/m), with no need to consider how the field is distributed in between."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电势差 ΔV 与重力势能的类比": {"name": "Potential difference ΔV and the analogy with gravitational potential energy", "note": "Potential difference is the change in potential energy per unit charge between two points, ΔV=ΔE_p/q=W/q, measured in volts, and it can be compared with a height difference in a gravitational field. When a positive charge moves along the field lines the potential and the potential energy both decrease; for a negative charge the opposite happens, which is the most common judgement error."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/平行板间匀强电场 E = V/d": {"name": "Uniform electric field between parallel plates E = V/d", "note": "Between parallel plates the electric field is approximately uniform with magnitude E=V/d and direction from the positive plate to the negative plate. Note that d is the plate separation and not the plate length, and V is the voltage between the plates. A charged particle between the plates usually requires both the electric force in the vertical direction and the uniform motion in the horizontal direction."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/带电粒子在电场中的偏转（类平抛运动）": {"name": "Deflection of charged particles in an electric field (projectile-like motion)", "note": "A particle entering the region between parallel plates perpendicular to the field undergoes projectile-like motion: uniform velocity along the plates and uniform acceleration perpendicular to them with a=qE/m=qV/(md). The deflection is y=½at² with t=L/v, and the exit speed is found by combining components with Pythagoras, exactly as for projectile motion."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电子伏特 1 eV = 1.60×10⁻¹⁹ J": {"name": "Electronvolt 1 eV = 1.60×10⁻¹⁹ J", "note": "The electron volt is a unit of energy, not of voltage, equal to the energy gained by one electron crossing a potential difference of 1 V, 1 eV=1.60×10⁻¹⁹ J. It is convenient in atomic and nuclear physics, for example the ionisation energy of hydrogen is 13.6 eV or 2.18×10⁻¹⁸ J; when converting, the charge must not be left out."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism": {"name": "U3 · Magnetism", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/磁通密度 B（特斯拉 T）与磁场线图": {"name": "Magnetic flux density B (tesla, T) and magnetic field line diagrams", "note": "The quantity describing the strength of a magnetic field is written B, measured in tesla (T), and is often simply called the magnetic field strength. Outside a magnet the field lines run from the N pole to the S pole and inside from S to N; they always form closed loops and never cross, and B is larger where the lines are closer together."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/长直导线磁场 B = μ₀I/2πr；右手螺旋定则；螺线管与电磁铁": {"name": "Magnetic field of a long straight conductor B = μ₀I/2πr; right-hand grip rule; solenoids and electromagnets", "note": "The magnetic field around a long straight current-carrying wire consists of concentric circles with magnitude B=μ₀I/2πr, proportional to the current and inversely proportional to the distance, where μ₀=4π×10⁻⁷ N·A⁻². The direction is found with the right-hand grip rule: the thumb points along the current and the curled fingers give the field direction. Inside a solenoid the field is approximately uniform."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/载流导体受力（电动机效应）：F = BIl sinθ": {"name": "Force on a current-carrying conductor (motor effect): F = BIl sinθ", "note": "The force exerted by a magnetic field on a current-carrying conductor is F=BIl sinθ, where θ is the angle between the current and the magnetic field; the force is zero when the conductor is parallel to the field (a common error is to omit sinθ). The direction is found with Fleming’s left-hand rule, and this is the microscopic mechanism by which a motor converts electrical energy into mechanical energy."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/左手定则 Fleming's Left Hand Rule（力/磁场/电流方向）": {"name": "Fleming's Left Hand Rule (directions of force / magnetic field / current)", "note": "Fleming’s left-hand rule gives the direction of the force exerted by a magnetic field on a current: the index finger points along the field, the middle finger along the current, and the thumb gives the force, the three being mutually perpendicular. Note that the middle finger follows the flow of positive charge (conventional current), so for negative charges such as electrons the direction must be reversed before applying the rule."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/载流线圈力矩 τ = nBIA；力矩最大的位置": {"name": "Torque on a current-carrying coil τ = nBIA; position of maximum torque", "note": "A current-carrying coil in a magnetic field experiences zero net force but a non-zero net torque, τ=nBIA, where n is the number of turns and A the area of the coil. The torque is greatest when the plane of the coil is parallel to the field and zero when the plane is perpendicular to the field, which is precisely the position at which a commutator must reverse the current."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/直流电动机结构与原理：电枢线圈、换向器、碳刷、磁场线圈；每 180° 反向电流": {"name": "Structure and principle of a DC motor: armature coil, commutator, carbon brushes, field coils; current reversed every 180°", "note": "A DC motor turns continuously because of the torque exerted by the magnetic field on the current-carrying coil, and the commutator reverses the current in the coil every 180° so that the direction of the torque stays the same. The carbon brushes feed current from the external circuit into the rotating commutator. Without a commutator the coil would swing back and forth about the equilibrium position instead of rotating continuously."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/反电动势 back emf 与楞次定律导致恒定转速": {"name": "Back emf and Lenz's law producing a constant rotation speed", "note": "As the coil of a motor rotates it cuts magnetic field lines and generates an induced emf opposing the supply voltage (the back emf), which reduces the net current and the torque automatically. When the load increases the motor slows down, the back emf falls and the current rises, so the output torque increases; this is why a motor is self-regulating."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/运动电荷受力 F = qvB sinθ；圆周运动半径 r = mv/qB": {"name": "Force on a moving charge F = qvB sinθ; radius of circular motion r = mv/qB", "note": "A moving charge in a magnetic field experiences the force F=qvB sinθ, which is perpendicular to both the velocity and the field, so it does no work and only changes direction. When v is perpendicular to B the particle moves in a circle, and qvB=mv²/r gives the radius r=mv/qB; the period is independent of speed, which is the basis of the cyclotron."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/应用：粒子加速器（直线/回旋/同步加速器）、质谱仪、速度选择器、磁悬浮、MRI": {"name": "Applications: particle accelerators (linear / cyclotron / synchrotron), mass spectrometer, velocity selector, maglev, MRI", "note": "A magnetic field cannot change the speed of a particle, only its direction, so acceleration must come from an electric field while the magnetic field confines the path. A cyclotron exploits the speed-independent period to accelerate a particle repeatedly, but is limited by relativistic effects; a velocity selector balances E against B to select particles of a particular speed."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用": {"name": "U3 · Applications of Electric and Magnetic Fields", "note": "Content listed in the outline (refer to the syllabus and EA REVISION)"}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/速度选择器 velocity selector（电场力与磁场力平衡）": {"name": "Velocity selector (electric force balanced by magnetic force)", "note": "In a velocity selector the electric and magnetic forces on a charged particle are opposite, and when they balance, qE=qvB, so only particles with speed v=E/B travel in a straight line through the device, regardless of charge or mass. Particles that are too fast are deflected by the magnetic force and those that are too slow by the electric force, which is how it selects speeds."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/霍尔效应 Hall Effect：霍尔电压 V_H、漂移速度 drift velocity、F_B = F_E 平衡": {"name": "Hall Effect: Hall voltage V_H, drift velocity, F_B = F_E equilibrium", "note": "When a current passes through a thin conductor in a magnetic field the charge carriers are deflected and accumulate on the two sides, producing a transverse voltage called the Hall voltage. At equilibrium qv_D B=qV_H/w, which gives V_H=BI/(nte), where n is the charge-carrier density and t the thickness of the slice. It is commonly used to measure magnetic fields or to deduce the carrier density."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/质谱仪 mass spectrometer 的分离原理": {"name": "Separation principle of the mass spectrometer", "note": "The sample is first ionised and accelerated by an electric field, gaining kinetic energy qV=½mv², and then enters a magnetic field perpendicular to its motion to move in a circle; from r=mv/qB, r=√(2mV/qB²), so the radius increases with mass. Ions of different mass therefore land at different positions and are separated, which allows isotope abundances and unknown elements to be determined."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/粒子加速器如何控制带电粒子的运动": {"name": "How particle accelerators control the motion of charged particles", "note": "Acceleration is provided by an electric field doing work to increase kinetic energy, and confinement by an orthogonal magnetic field supplying the centripetal force; these are the two basic tools of an accelerator. In a cyclotron the period of the alternating voltage must be synchronised with the particle’s orbital period; a linear accelerator uses a series of alternating electric fields to accelerate step by step, and a synchrotron must also increase the magnetic field in step to hold the orbital radius constant."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应": {"name": "U3 · Electromagnetic Induction", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/磁通量 Φ = BA cosθ（韦伯 Wb）；θ 为 B 与面积法线的夹角": {"name": "Magnetic flux Φ = BA cosθ (weber, Wb); θ is the angle between B and the normal to the area", "note": "Magnetic flux Φ=BA cosθ is the total amount of magnetic field lines passing through a surface, measured in webers (Wb). Here θ is the angle between the magnetic field and the normal to the area, so Φ=0 when the plane of the coil is parallel to the field and Φ=BA is a maximum when it is perpendicular. Taking θ as the angle to the plane of the coil is the most common error."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/产生电磁感应的条件：相对运动、B 大小变化、线圈面积变化、B 方向变化": {"name": "Conditions for electromagnetic induction: relative motion, change in magnitude of B, change in coil area, change in direction of B", "note": "An induced emf is produced if and only if the magnetic flux through the circuit changes, which can come from a change in the strength of the field, relative motion between coil and field, a change in the area of the circuit, or a change in the direction of the field. If Φ is constant there is no induced current even when it is very large, often misread as “a magnetic field means induction”."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/法拉第定律 ε = −N ΔΦ/Δt（感应电动势）": {"name": "Faraday's law ε = −N ΔΦ/Δt (induced emf)", "note": "The induced emf is proportional to the rate of change of magnetic flux: ε=−NΔΦ/Δt, where N is the number of turns and the negative sign expresses the direction given by Lenz’s law. You must use ΔΦ/Δt and not Φ itself, and the average emf uses the change in flux over the whole time interval; omitting N is a frequent cause of lost marks."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/楞次定律：感应电流的方向总是阻碍磁通量的变化（能量守恒的体现）": {"name": "Lenz's law: the direction of the induced current always opposes the change in magnetic flux (a manifestation of conservation of energy)", "note": "Lenz’s law states that the effect of the induced current always opposes the change in flux that produced it: when the flux increases the field of the induced current is opposite to the original field, and when it decreases the two are in the same direction. It is fundamentally a statement of conservation of energy, because an induced current that assisted the change would create energy from nothing."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/右手定则判断感应电流方向；涡电流 eddy current": {"name": "Right-hand rule for determining the direction of induced current; eddy currents", "note": "When a conductor moves in a magnetic field the direction of the induced current is found with the right-hand rule: the thumb points along the direction of motion, the index finger along the field, and the middle finger gives the current. A bulk metal in a changing magnetic field develops circulating eddy currents inside it; these cause energy losses in transformers (reduced by using a laminated core) and are also used for induction heating and induction cooktops."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/磁铁进出线圈时的受力与做功分析": {"name": "Analysis of forces and work done as a magnet enters and leaves a coil", "note": "When a magnet is pushed into a coil the flux through the coil increases and, by Lenz’s law, the face of the coil nearer the magnet becomes a like pole and repels the magnet; when the magnet is withdrawn the coil attracts it, so entry and withdrawal are both opposed. An external force must do work against this opposition, and that work becomes electrical energy, the energy source of generators and regenerative braking."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/应用：直流/交流发电机、变压器、再生制动、电磁炉、电动车、磁悬浮": {"name": "Applications: DC/AC generators, transformers, regenerative braking, induction cooktops, electric vehicles, maglev", "note": "Applications of electromagnetic induction fall into two classes: generating electricity from relative motion between a magnetic field and a conductor (generators, regenerative braking), or using an alternating field to drive eddy currents in a conductor (induction cooktops, inductive charging). A transformer transfers energy by mutual induction but works only with alternating current, because direct current produces a flux that does not change."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器": {"name": "U3 · AC Generators and Transformers", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/发电机：机械能→电能（电动机的逆过程）；能量来源（水力、煤炭、核、风、地热）": {"name": "Generators: mechanical energy → electrical energy (the reverse of a motor); energy sources (hydro, coal, nuclear, wind, geothermal)", "note": "A generator converts mechanical energy into electrical energy and is the reverse of a motor. The various methods of generation differ only in what drives the turbine: hydro, wind and geothermal supply mechanical energy directly, while coal and nuclear first raise steam to drive the turbine. Whatever the source, the intermediate step is a rotating coil cutting magnetic field lines."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/滑环 slip rings 输出交流 vs 换向器输出直流": {"name": "Slip rings output AC vs commutator outputs DC", "note": "Slip rings stay connected to the same ends of the coil, so the current reverses every half turn and the output is alternating. A commutator instead swaps the contacts with the external circuit every half turn, so the output current always flows the same way and is a pulsating direct current. The type of output can be identified simply from whether the machine uses slip rings or a commutator."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/部件与功能：外磁铁、电枢线圈、滑环/换向器、碳刷": {"name": "Components and functions: external magnets, armature coil, slip rings/commutator, carbon brushes", "note": "The four main parts of a generator each have a role: the external magnet (or electromagnet) provides the magnetic field, the armature coil is rotated by mechanical energy, the slip rings or commutator maintain sliding contact with the external circuit and determine whether the output is AC or DC, and the carbon brushes carry the current out. When asked for the function of a part, state whether it deals with the field, the rotation or the output of current."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/线圈旋转各角度（0°/90°/180°/270°/360°）的磁通与电动势变化": {"name": "Variation of flux and emf at each angle of coil rotation (0°/90°/180°/270°/360°)", "note": "When the plane of the coil is perpendicular to the field the flux is a maximum but the emf is zero, because the rate of change of flux is zero at that instant; after rotating 90° to lie parallel to the field the flux is zero while the emf is at its peak. Flux and emf are therefore always a quarter of a period out of step, and wherever the flux is at an extreme the emf must be zero, and vice versa."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/关系式：Φ = NBA cos ωt；emf = NBAω sin ωt；ε_max = NBAω = 2πfNBA": {"name": "Relations: Φ = NBA cos ωt; emf = NBAω sin ωt; ε_max = NBAω = 2πfNBA", "note": "When the coil rotates at a constant rate the flux varies as Φ=NBA cos ωt, and differentiating by Faraday’s law gives emf=NBAω sin ωt with peak value ε_max=NBAω=2πfNBA. Note that the peak increases linearly with the rate of rotation and the field; if an rms value is given, it must be multiplied by √2 before being put into the peak formula."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/变压器：两线圈 + 叠片硅钢芯；互感 mutual induction": {"name": "Transformer: two coils + laminated silicon steel core; mutual induction", "note": "A transformer consists of primary and secondary coils wound on the same iron core and works by mutual induction: the changing current in the primary coil produces a changing magnetic flux in the core, which induces an emf in the secondary coil. A laminated silicon steel core both improves the flux linkage and reduces eddy current losses. A transformer cannot work on steady direct current."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/匝数比 Vs/Vp = Ns/Np；升压与降压；理想变压器功率守恒": {"name": "Turns ratio Vs/Vp = Ns/Np; step-up and step-down; power conservation in an ideal transformer", "note": "For an ideal transformer the voltage ratio equals the turns ratio, Vs/Vp=Ns/Np, and power is conserved, VpIp=VsIs, so the current ratio is the inverse of the turns ratio. If Ns>Np it is a step-up transformer and if Ns<Np a step-down transformer. A common error is to think that stepping up the voltage also increases the power, which would violate conservation of energy."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/电力输送：为何要升压、为何铁芯要叠片": {"name": "Power transmission: why step up the voltage, why transformer cores are laminated", "note": "The power lost in a transmission line is P_loss=I²R, so for a fixed transmitted power, stepping up the voltage reduces the current proportionally and therefore cuts the loss dramatically; this is why power is stepped up for long-distance transmission and stepped down again before it reaches homes. The core is laminated in order to break up the paths of eddy currents and reduce the heating losses they cause."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/欧姆定律 V = IR；电阻串并联（实验）": {"name": "Ohm's law V = IR; resistors in series and parallel (experiment)", "note": "The relationship between voltage, current and resistance is V=IR, but it applies only to ohmic devices, for which R is constant. In series the total resistance is the sum of the individual resistances and the current is the same everywhere, while in parallel the reciprocal of the total resistance is the sum of the reciprocals and the voltage is the same across every branch. In experiments remember that an ammeter is connected in series and a voltmeter in parallel."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论": {"name": "U4 · Special Relativity", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/参考系与惯性参考系（恒定速度）": {"name": "Frames of reference and inertial frames of reference (constant velocity)", "note": "A frame of reference is the coordinate framework in which an observer describes motion, and an inertial frame is one in which Newton’s laws hold, that is a frame at rest or moving with constant velocity. Any frame with acceleration is non-inertial and requires fictitious forces before Newton’s laws can be used. Special relativity deals only with relationships between inertial frames."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/光速不变 c = 3.00×10⁸ m/s；爱因斯坦两条基本假设": {"name": "Constancy of the speed of light c = 3.00×10⁸ m/s; Einstein's two postulates", "note": "Special relativity rests on two postulates: the laws of physics have the same form in all inertial frames (the principle of relativity), and the speed of light in a vacuum, c=3.00×10⁸ m·s⁻¹, is the same for all observers in all inertial frames. The second postulate conflicts directly with classical velocity addition and leads to time dilation and length contraction."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/同时性的相对性（火车思想实验）": {"name": "Relativity of simultaneity (train thought experiment)", "note": "Whether two events are simultaneous depends on the frame of reference chosen: on a moving train with a lamp at the centre of a carriage, the light reaches both ends at once for a passenger, but an observer on the ground sees it reach the rear end first. There is therefore no absolute “now”, and simultaneity is meaningful only relative to a particular frame."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/时间膨胀 t = t₀/√(1−v²/c²)；固有时间 t₀ 与洛伦兹因子 γ；双生子佯谬": {"name": "Time dilation t = t₀/√(1−v²/c²); proper time t₀ and the Lorentz factor γ; twin paradox", "note": "A moving clock runs slow: t=γt₀, where t₀ is the proper time measured in the frame in which the two events occur at the same place, and γ=1/√(1−v²/c²) is always greater than or equal to 1. To decide which time is t₀, simply ask which observer is at rest relative to both events. In the twin paradox the travelling twin changes inertial frame when turning round, so the experiences of the two are not symmetric."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/长度收缩 L = L₀√(1−v²/c²)；固有长度；梯子-车库佯谬": {"name": "Length contraction L = L₀√(1−v²/c²); proper length; ladder-and-garage paradox", "note": "A length measured along the direction of motion is contracted: L=L₀/γ, where L₀ is the proper length measured when the object is at rest. Contraction occurs only along the direction of motion, and dimensions perpendicular to it are unchanged. The resolution of the ladder–garage paradox is that whether the two ends are inside at the same time is judged differently in the two frames, that is the relativity of simultaneity."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/相对论速度叠加 u = (u′ + v)/(1 + u′v/c²)": {"name": "Relativistic velocity addition u = (u′ + v)/(1 + u′v/c²)", "note": "Relativistic velocity addition is u=(u′+v)/(1+u′v/c²); at low speeds the correction term in the denominator is negligible and the classical formula is recovered. Its great significance is that as long as neither u′ nor v exceeds c, the combined speed can never exceed c either, which is precisely what the constancy of the speed of light demands."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/相对论动量 p = mv/√(1−v²/c²)（高速下增大，阻止达到光速）": {"name": "Relativistic momentum p = mv/√(1−v²/c²) (increases at high speed, preventing reaching the speed of light)", "note": "Relativistic momentum is written p=γmv and grows sharply as the speed approaches the speed of light, so the force needed to accelerate a particle further also grows sharply; this is why a particle with non-zero rest mass can never reach the speed of light. When v is much less than c, γ is approximately 1, so p=mv can be used as a check that an answer is reasonable."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/质能等价 E = mc²；静止质量能量": {"name": "Mass–energy equivalence E = mc²; rest mass energy", "note": "Mass is itself a form of energy, with the conversion factor being the square of the speed of light, E=mc², so even a stationary object contains the energy E_rest=mc². In nuclear reactions a very small mass defect releases an enormous energy ΔE=Δmc², which is the energy source of the Sun and of nuclear power stations; do not leave out the c² in calculations."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/总能量与能量-动量关系 E² = p²c² + m²c⁴；光子 E = pc": {"name": "Total energy and the energy–momentum relation E² = p²c² + m²c⁴; photon E = pc", "note": "The total relativistic energy satisfies E²=p²c²+m²c⁴, and kinetic energy is the total energy minus the rest energy, E_k=(γ−1)mc². For a photon, whose rest mass is zero, m=0 so E=pc and hence the momentum is p=E/c=h/λ, which is why a photon can have momentum while having no rest mass."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/实验证据：Rossi–Hall 实验（μ 子）、μ 子寿命与长度收缩、GPS 修正、粒子加速器": {"name": "Experimental evidence: Rossi–Hall experiment (muons), muon lifetime and length contraction, GPS corrections, particle accelerators", "note": "A muon should decay before reaching the ground, but the Rossi–Hall experiment detected large numbers of muons both at high altitude and at sea level, showing that their lifetime is lengthened by their high speed (or that the thickness of the atmosphere is contracted in their frame). GPS satellites also require relativistic corrections, and the energies and momenta of particles in accelerators agree with the relativistic formulas, all of which is strong evidence."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论": {"name": "U4 · General Relativity", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/牛顿的引力观 vs 爱因斯坦：引力不是力，而是时空弯曲的效应": {"name": "Newton's view of gravity vs Einstein's: gravity is not a force but an effect of curved spacetime", "note": "Newton regarded gravity as a force transmitted instantaneously between bodies against a background of flat, absolute space and time; Einstein instead held that gravity is not a force at all but the manifestation of space and time being curved by mass–energy, with bodies simply following the most natural paths through curved spacetime. Newton’s picture fails in strong fields and at high speeds."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/时空弯曲（质量-能量弯曲时空；时空 = x, y, z + t）": {"name": "Curved spacetime (mass–energy curves spacetime; spacetime = x, y, z + t)", "note": "General relativity unifies three dimensions of space with one of time into four-dimensional spacetime, which is curved by mass and energy, the curvature being related to the energy–momentum tensor by the Einstein field equations. This curvature shows itself as what we call gravity. Note that it is spacetime itself that is curved, not that bodies are pulled through a pre-existing space."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/测地线 geodesics 与自由落体；失重": {"name": "Geodesics and free fall; weightlessness", "note": "A geodesic is the shortest (or longest) path between two points in curved spacetime, that is a “straight line” in four dimensions. A freely falling object is moving along a geodesic and therefore experiences no force at all, which is the essence of weightlessness: the astronaut and the spacecraft fall along the same geodesic and there is no relative acceleration between them."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/光沿时空测地线传播；引力透镜 gravitational lensing": {"name": "Light travels along spacetime geodesics; gravitational lensing", "note": "Although a photon has no rest mass it travels along a spacetime geodesic, so its path bends when it passes near a massive body. The observable consequences are that background galaxies appear displaced, stretched into arcs, or appear as multiple images in the same direction; this effect is called gravitational lensing, and the 1919 eclipse observations gave the first confirmation of the bending of light."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/引力时间膨胀（引力势越低，时间越慢）": {"name": "Gravitational time dilation (the lower the gravitational potential, the slower time passes)", "note": "Time runs more slowly where the gravitational potential is lower, that is nearer a massive body. A clock on the ground therefore runs slower than one on a mountain, and a difference exists between different floors of the same building, which is why GPS satellites require a gravitational correction. This is opposite in sense to the time dilation of special relativity."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/应用：GPS 需同时考虑狭义与广义相对论（每天约 10 km 位置误差）": {"name": "Application: GPS must account for both special and general relativity (about 10 km position error per day)", "note": "The satellite clocks of GPS run slow by about 7 μs per day because of their high speed (special relativity) and fast by about 45 μs per day because they are in a weaker gravitational field (general relativity), a net gain of about 38 μs per day. Without this correction the positions would accumulate an error of about 10 km per day, and the example is a classic question combining both effects."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/黑洞：极端曲率、事件视界 event horizon、奇点、吸积盘": {"name": "Black holes: extreme curvature, event horizon, singularity, accretion disc", "note": "A black hole is an object whose spacetime curvature is so extreme that not even light can escape; its boundary is called the event horizon, inside which the escape speed exceeds the speed of light. Classical theory puts a singularity of infinite density inside the horizon. Matter spiralling in rotates at high speed, heats by friction and glows, forming an accretion disc, which is often the visible signature of a black hole in astronomical observations."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/证据：飞机上的原子钟、GPS、引力波、引力透镜": {"name": "Evidence: atomic clocks on aircraft, GPS, gravitational waves, gravitational lensing", "note": "The main evidence for general relativity falls into four groups: atomic clocks carried on aircraft in round-the-world flights confirmed the effects of motion and gravity on time, the routine corrections applied to GPS prove that gravitational time dilation is real, gravitational lensing confirms that light is bent, and the first direct detection of gravitational waves by LIGO in 2015 confirmed that curvature of spacetime can propagate as a wave."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性": {"name": "U4 · The Wave Nature of Light", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波 = 振荡的电场与磁场；麦克斯韦方程组；加速电荷产生电磁波": {"name": "Electromagnetic waves = oscillating electric and magnetic fields; Maxwell's equations; accelerating charges produce electromagnetic waves", "note": "An electromagnetic wave is a propagating oscillation of electric and magnetic fields that are perpendicular to each other and in phase. Maxwell’s equations unified electricity and magnetism and predicted their existence, and Hertz’s experiments confirmed it. The necessary condition for producing electromagnetic waves is that a charge accelerates (oscillates); a charge moving at constant velocity does not radiate, which is how an antenna works."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波谱：无线电→微波→红外→可见光→紫外→X 射线→γ 射线": {"name": "The electromagnetic spectrum: radio → microwave → infrared → visible light → ultraviolet → X-rays → gamma rays", "note": "Ordered by increasing frequency (decreasing wavelength) the spectrum is radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays. Visible light occupies only a very narrow band. All electromagnetic waves travel at c in a vacuum, so frequency and wavelength are inversely proportional, and neighbouring bands overlap rather than having sharp boundaries."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波性质：横波、E ⊥ B 且同相、c = 3.0×10⁸ m/s、无需介质": {"name": "Properties of electromagnetic waves: transverse, E ⊥ B and in phase, c = 3.0×10⁸ m/s, no medium required", "note": "Electromagnetic waves are transverse, with E perpendicular to B and reaching their maxima together, the direction of propagation being given by E×B. They need no medium and travel through a vacuum at c=3.00×10⁸ m·s⁻¹. Polarisation is direct evidence that they are transverse; longitudinal waves such as sound cannot be polarised."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/波方程 c = fλ；周期；频率与波长成反比": {"name": "Wave equation c = fλ; period; frequency is inversely proportional to wavelength", "note": "The speed of a wave equals the product of frequency and wavelength, c=fλ, and the period is the reciprocal of the frequency, T=1/f. When light enters another medium the frequency stays the same but the wavelength changes, so the speed changes, and this is the cause of refraction. Always check first which quantity remains constant across the boundary in this kind of question."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/反射、折射（斯涅尔定律）、衍射、干涉、偏振": {"name": "Reflection, refraction (Snell's law), diffraction, interference, polarisation", "note": "Light is reflected at an interface (angle of incidence equals angle of reflection) and refracted according to Snell’s law, n₁sinθ₁=n₂sinθ₂, diffracts around obstacles or through slits, interferes when two beams meet, and shows polarisation through a polarising filter. All five are wave behaviours, and the refractive index n=c/v is always greater than 1."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/衍射：波长 ≥ 孔径时显著；波长不变": {"name": "Diffraction: significant when wavelength ≥ aperture size; wavelength unchanged", "note": "Diffraction is the spreading of a wave around an obstacle or beyond a slit, and it is significant only when the aperture is comparable to or smaller than the wavelength, which is why sound diffracts noticeably while light does not. The key point is that diffraction changes neither the wavelength nor the frequency, only the direction of propagation and the intensity distribution, so diffracted light keeps its colour."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/干涉：相长与相消、光程差 path difference、相位": {"name": "Interference: constructive and destructive, path difference, phase", "note": "When two coherent beams meet they superpose according to their path difference: a path difference of a whole number of wavelengths gives constructive interference (bright), while an odd number of half wavelengths gives destructive interference (dark). Interference is the strongest evidence for wave behaviour. To observe a stable pattern the two sources must be coherent (same frequency, constant phase difference), which an ordinary light bulb cannot provide."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/杨氏双缝实验：明暗条纹；粒子说预言与实际不符，成为光的波动性的证据": {"name": "Young's double-slit experiment: bright and dark fringes; the particle model's prediction disagrees with observation, providing evidence for the wave nature of light", "note": "When light passes through two narrow, closely spaced slits the screen shows evenly spaced bright and dark fringes with spacing Δy=λL/d. If light were only a particle, two slits should give just two bright spots, so this result is decisive evidence for wave behaviour. The spacing is proportional to the wavelength and the screen distance and inversely proportional to the slit separation."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/应用：光的折射性质实验、用衍射理论测激光波长": {"name": "Applications: experiments on the refractive properties of light, measuring laser wavelength using diffraction theory", "note": "Using the diffraction grating equation nλ=d sinθ, measuring the angle of each order of bright fringe and the grating spacing allows the wavelength of a laser to be calculated, which is the standard laboratory method for measuring wavelength; in the same way a refraction experiment can determine the refractive index of a medium. Such experiments require measuring several orders and averaging in order to reduce the random error in reading the angle."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性": {"name": "U4 · The Particle Nature of Light", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/牛顿微粒说 vs 惠更斯波动说的历史争论": {"name": "The historical debate between Newton's particle theory and Huygens' wave theory", "note": "Newton held that light is a stream of particles, which naturally explains straight-line propagation and reflection; Huygens held that light is a wave, which explains diffraction and interference. The argument lasted more than a hundred years until Young’s double slit and the Poisson spot supported the wave theory. In the end the photoelectric effect showed that neither is complete and that light has a wave–particle duality, which gave the dispute a unified explanation."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光电效应实验装置（阴极/阳极、石英窗、光电子、电流计、真空管）": {"name": "Photoelectric effect apparatus (cathode/anode, quartz window, photoelectrons, galvanometer, vacuum tube)", "note": "The apparatus is a glass tube evacuated to a vacuum, containing a cathode and an anode; light enters through a quartz window (which transmits ultraviolet) and falls on the cathode, ejecting photoelectrons that are collected by the anode to form a photocurrent measured by a galvanometer. The vacuum prevents the photoelectrons from losing energy in collisions with air molecules, and a reverse voltage can be applied to measure the stopping potential."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/波动模型的三大预言与实际结果的矛盾：亮度↑只增电子数不增能量、存在截止频率、发射是瞬时的": {"name": "Three contradictions between the wave model's predictions and the actual results: increasing brightness only increases the number of electrons, not their energy; a threshold frequency exists; emission is instantaneous", "note": "Classical wave theory predicted that greater intensity should give photoelectrons more kinetic energy, that any frequency should eject electrons if the light shines long enough, and that weak light should give a delay. Experiment instead shows that increasing the intensity only increases the number of photoelectrons without changing their energy, that below the threshold frequency no emission occurs however intense the light, and that emission is almost instantaneous. These three points directly refute a purely wave model."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光子：E = hf = hc/λ；h = 6.63×10⁻³⁴ Js；一个光子对应一个电子、完全吸收": {"name": "Photons: E = hf = hc/λ; h = 6.63×10⁻³⁴ Js; one photon corresponds to one electron, complete absorption", "note": "Light consists of photons of energy E=hf=hc/λ, where Planck’s constant h=6.63×10⁻³⁴ J·s. The photoelectric effect is essentially a one-to-one process: one photon is completely absorbed by one electron, so the intensity determines the number of photons (and hence of photoelectrons), while the energy of a single photon depends only on the frequency and not on the intensity."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/逸出功 W = hf₀ 与截止频率；不同金属的逸出功数值": {"name": "Work function W = hf₀ and threshold frequency; work function values for different metals", "note": "The work function φ is the minimum energy needed to remove an electron from the metal surface, and it corresponds to a threshold frequency f₀=φ/h; below it no photoelectric effect occurs however intense the light. Different metals have different work functions: alkali metals such as caesium have small values and so respond to visible light, while metals such as platinum need ultraviolet, which is the basis of questions on choosing a material."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光电方程 KE_max = hf − W；遏止电压 stopping potential": {"name": "Photoelectric equation KE_max = hf − W; stopping potential", "note": "Conservation of energy in the photoelectric effect is expressed as KE_max=hf−φ: part of the photon energy is used to escape the metal and the remainder becomes the maximum kinetic energy of the photoelectron. The reverse voltage that just reduces the photocurrent to zero is the stopping potential, and eV_s=KE_max, so a graph of V_s against f gives h/e and φ/e."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/波粒二象性 wave–particle duality": {"name": "Wave–particle duality", "note": "Light shows wave behaviour while propagating (interference, diffraction, polarisation) and particle behaviour when interacting with matter (the photoelectric effect, Compton scattering), and the two aspects cannot appear in the same experiment at the same time. De Broglie went further and showed that matter particles such as electrons also have wave properties, so wave–particle duality is a property common to all microscopic objects."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱": {"name": "U4 · Blackbody Radiation and Spectra", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/黑体辐射：光谱形状及其随温度的依赖；经典波动模型无法解释": {"name": "Blackbody radiation: the shape of the spectrum and its dependence on temperature; the classical wave model cannot explain it", "note": "A black body is an ideal object that absorbs and re-emits all incident electromagnetic radiation, and its spectrum depends only on temperature: as the temperature rises the total radiated intensity increases and the peak wavelength shifts towards shorter wavelengths according to Wien’s displacement law. Classical wave theory predicted that the intensity should tend to infinity at short wavelengths (the ultraviolet catastrophe), which disagrees with the observed curve, and this conflict led Planck to propose energy quantisation."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/德布罗意物质波 λ = h/p = h/mv": {"name": "de Broglie matter waves λ = h/p = h/mv", "note": "De Broglie proposed that a matter particle also has an associated matter wave of wavelength λ=h/p=h/mv, so the greater the momentum the shorter the wavelength. It began as a theoretical conjecture and was later confirmed by electron diffraction experiments. For a macroscopic object the wavelength is extremely small (of order 10⁻³⁴ m) and completely unobservable, which is why matter waves are not seen in everyday life."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/宏观物体/人/电子三案例对比：宏观波长过小不可观测，电子可检测": {"name": "Comparison of three cases — macroscopic object / person / electron: macroscopic wavelengths are too small to observe, electron wavelengths are detectable", "note": "Comparing the three with λ=h/mv shows the difference: a person (about 70 kg at 1 m·s⁻¹) has a wavelength of about 10⁻³⁵ m, far smaller than an atomic nucleus, while an electron at 10⁶ m·s⁻¹ has a wavelength of about 10⁻⁹ m, comparable with atomic spacing, so it can produce observable diffraction from a crystal. The criterion is simply a comparison of orders of magnitude between the wavelength and the size of the obstacle."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/戴维孙-革末实验：电子衍射证实物质波": {"name": "Davisson–Germer experiment: electron diffraction confirms matter waves", "note": "Davisson and Germer fired a beam of low-energy electrons at a nickel crystal and measured a distribution of scattered intensity with clear maxima whose pattern was exactly like that of X-ray diffraction, and the wavelength deduced from it agreed with λ=h/p. This was the first direct experimental evidence for the matter-wave hypothesis and showed that electrons can be diffracted by a crystal grating just like waves."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/双缝实验重做：电子逐个通过也会累积出干涉图样": {"name": "Repeating the double-slit experiment: electrons passing through one at a time still build up an interference pattern", "note": "When the double-slit experiment is performed with electrons, even if they are emitted one at a time the screen first shows only scattered bright dots, but after a long accumulation interference fringes still emerge. This shows that a single electron also passes through both slits as a wave and interferes with itself, while the landing point of each individual electron is random, its probability being determined by the intensity of the wave."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/应用：电子显微镜（TEM/SEM/STEM，分辨率约 10⁻¹⁰ m）、中子衍射、X 射线衍射": {"name": "Applications: electron microscopes (TEM/SEM/STEM, resolution about 10⁻¹⁰ m), neutron diffraction, X-ray diffraction", "note": "Because the wavelength of electrons can be far shorter than that of visible light, an electron microscope forms its image with an electron beam and can reach atomic resolution (about 10⁻¹⁰ m); TEM shows transmitted internal structure and SEM shows surface morphology. Similarly, neutron diffraction is well suited to locating hydrogen atoms and magnetic structure, while X-ray diffraction is used to determine crystal structures."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/四类光谱：线状发射光谱、带状光谱、连续光谱、吸收光谱": {"name": "Four types of spectra: line emission spectra, band spectra, continuous spectra, absorption spectra", "note": "A continuous spectrum is emitted by a hot solid or liquid and contains all wavelengths; a line emission spectrum is emitted by a low-pressure excited gas and contains only a few bright lines; an absorption spectrum consists of dark lines appearing when continuous light passes through a cool gas; and a band spectrum is produced by molecules. The lines of a line spectrum and of an absorption spectrum coincide exactly, which is the key to identifying elements."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/光谱分析：元素的特征谱线": {"name": "Spectral analysis: characteristic spectral lines of the elements", "note": "Every element has a unique set of characteristic spectral lines that acts like a fingerprint for identification. Comparing the spectrum of an unknown sample with standard spectra determines its composition, a principle used both for elemental analysis in the laboratory and for deducing the composition of distant stars from their absorption spectra, and it requires no contact between the sample and the instrument."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型": {"name": "U4 · The Bohr Model of the Atom", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/玻尔假设：电子只能在特定轨道上具有固定能量；基态与激发态": {"name": "Bohr's postulates: electrons can only have fixed energies in specific orbits; ground state and excited states", "note": "Bohr assumed that an electron can occupy only certain discrete allowed orbits with quantised energy, so it does not radiate energy continuously as it moves around the nucleus; the lowest level is the ground state and a higher level reached after absorbing energy is an excited state. This assumption overrides the classical electromagnetic conclusion that an accelerating charge must radiate."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/氢原子能级图（−13.60、−3.40、−1.51、−0.85、−0.54 eV，电离为 0.00）": {"name": "Hydrogen atom energy level diagram (−13.60, −3.40, −1.51, −0.85, −0.54 eV, ionisation at 0.00)", "note": "The hydrogen energy levels are −13.60, −3.40, −1.51, −0.85, −0.54 eV and so on, becoming closer together at higher levels, with the zero taken as the electron completely removed from the atom. Negative levels mean the electron is bound, and the magnitude is the energy needed to move it to infinity. When drawing transition arrows, remember that upward arrows are absorption and downward arrows emission."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/跃迁规则：吸收或释放的能量必须恰好等于两能级之差": {"name": "Transition rule: the energy absorbed or released must equal exactly the difference between the two energy levels", "note": "An electron can only make a transition between levels if the energy absorbed or released is exactly equal to the difference between the two levels, ΔE=E₂−E₁, so only photons of matching energy can be absorbed. This is why an absorption spectrum consists of discrete dark lines: a photon whose energy does not match cannot be absorbed and so leaves no mark on the spectrum."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/激发态寿命约 10⁻⁸ s；退激可一步或多步，每次跃迁释放一个光子": {"name": "Excited state lifetime about 10⁻⁸ s; de-excitation may occur in one or several steps, each transition releasing one photon", "note": "An excited state is very short-lived, and after about 10⁻⁸ s the electron returns spontaneously to a lower level. De-excitation may happen in one step back to the ground state, emitting a high-energy photon, or in several steps through intermediate levels, each step emitting one photon of a particular energy; an element can therefore produce many spectral lines, with several possible transition paths."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/电离 Ionisation：电离能；超过阈值的多余能量成为电子的动能": {"name": "Ionisation: ionisation energy; excess energy above the threshold becomes the kinetic energy of the electron", "note": "Ionisation is the complete removal of an electron from its level so that it becomes a free electron, and the minimum energy required is the ionisation energy (13.6 eV for hydrogen in the ground state). If more energy than the ionisation energy is supplied, the excess all becomes kinetic energy of the free electron, and the absorption spectrum then changes from discrete lines to a continuum."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/用 ΔE = hf = hc/λ 解释发射光谱与吸收光谱": {"name": "Using ΔE = hf = hc/λ to explain emission and absorption spectra", "note": "Photon energy is related to the level difference by ΔE=hf=hc/λ. In absorption an electron rises and takes a photon whose energy exactly matches, giving a dark line; in emission an electron falls and releases a photon of the corresponding wavelength, giving a bright line. The emission and absorption lines of the same element therefore coincide exactly in position, being complementary in brightness and darkness."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/氢光谱系列：Lyman（紫外）、Balmer（可见光）、Paschen（红外）": {"name": "Hydrogen spectral series: Lyman (ultraviolet), Balmer (visible light), Paschen (infrared)", "note": "The spectral lines of hydrogen are grouped into series according to the final level of the transition: the Lyman series ends at n=1 and lies in the ultraviolet; the Balmer series ends at n=2 and lies mainly in the visible; the Paschen series ends at n=3 and lies in the infrared. To decide which series a line belongs to, simply see which level it terminates on."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/能级计算 E = −13.6 Z²/n²": {"name": "Energy level calculation E = −13.6 Z²/n²", "note": "The energy levels of a hydrogen-like ion are E=−13.6 Z²/n² (eV), proportional to the square of the nuclear charge number and inversely proportional to the square of the principal quantum number, with the negative sign showing that the electron is bound. To find the wavelength of a transition photon, first calculate the difference between the two levels and then use λ=hc/ΔE. Z applies only to single-electron ions and cannot be used directly for many-electron atoms."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/应用：荧光与磷光、X 射线产生、激光、光伏电池、LED、荧光标记": {"name": "Applications: fluorescence and phosphorescence, X-ray production, lasers, photovoltaic cells, LEDs, fluorescent markers", "note": "These applications all rest on level transitions: fluorescence and phosphorescence differ in how long the afterglow of de-excitation lasts, lasers produce coherent monochromatic light by stimulated emission, X-rays are produced when fast electrons strike a metal target or by inner-shell transitions, and LEDs and photovoltaic cells convert between electrical and light energy. In an explanation, state which two levels are involved."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学": {"name": "U4 · Cosmology", "note": "Cosmology — the Big Bang theory and evidence"}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/天文距离单位：AU（1.50×10¹¹ m）、光年、秒差距 parsec（3.1×10¹⁶ m）、Mpc": {"name": "Astronomical distance units: AU (1.50×10¹¹ m), light-year, parsec (3.1×10¹⁶ m), Mpc", "note": "Astronomical distances use special units: 1 AU is the mean Earth–Sun distance, 1.50×10¹¹ m; 1 light-year is the distance light travels in a vacuum in a year, about 9.46×10¹² km; and 1 parsec is about 3.26 light-years, that is 3.09×10¹⁶ m. Intergalactic distances are usually given in Mpc, and the conversion factors should be taken from the data sheet."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/稳恒态理论 Steady State（各向同性 + 均匀 + 静态）及其被否定": {"name": "Steady State theory (isotropic + homogeneous + static) and its rejection", "note": "The Steady State theory holds that although the universe is expanding it remains isotropic and homogeneous on the largest scales and does not change with time, with the density maintained by the continuous creation of matter, so that it has no beginning. Its key difference from the Big Bang is precisely whether the universe has a starting point, and it was refuted by the discovery of the cosmic microwave background radiation."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/多普勒效应；红移与蓝移（波长变长/变短）": {"name": "Doppler effect; redshift and blueshift (wavelength increases/decreases)", "note": "The Doppler effect is the change in observed frequency when there is relative motion between a wave source and an observer. When a source moves away the wavelength is stretched, which is a redshift, and when it approaches the wavelength is shortened, which is a blueshift. Note that “red” and “blue” here mean only that the wavelength has lengthened or shortened; they are not restricted to the visible band and apply to any electromagnetic wave."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/红移参数 z = (λ_观测 − λ_静止)/λ_静止 ≈ v/c": {"name": "Redshift parameter z = (λ_observed − λ_rest)/λ_rest ≈ v/c", "note": "The redshift parameter is defined as z=(λ_observed−λ_rest)/λ_rest, and when z is much less than 1 the recession speed can be found from z≈v/c. Here λ_rest is the wavelength of the same spectral line measured in the laboratory, and it can only be identified by matching characteristic lines. A negative z means a blueshift, so that object is approaching us."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/哈勃定律 v = H₀d；H₀ = 70.0 km·s⁻¹·Mpc⁻¹；图像斜率即哈勃常数": {"name": "Hubble's law v = H₀d; H₀ = 70.0 km·s⁻¹·Mpc⁻¹; the gradient of the graph is the Hubble constant", "note": "Hubble’s law states that the recession speed of a galaxy is proportional to its distance, v=H₀d, with H₀≈70.0 km·s⁻¹·Mpc⁻¹. Plotting d on the horizontal axis and v on the vertical axis gives the Hubble constant as the gradient, and its unit must be converted to s⁻¹. Note that d must be in Mpc to match the unit of H₀; substituting metres directly is out by several orders of magnitude."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/距离测量：亮度与光度；造父变星 Cepheid 作为标准烛光": {"name": "Distance measurement: brightness and luminosity; Cepheid variables as standard candles", "note": "From the observed brightness b and a known luminosity L the distance can be deduced: b=L/(4πd²). The pulsation period of a Cepheid variable has a definite relationship with its luminosity, so measuring the period gives the luminosity, which is why Cepheids are called standard candles. They are a key link in the cosmic distance ladder and were the basis of Hubble’s original measurements of galaxy distances."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙膨胀的含义：空间本身在膨胀（星系与地球内部由引力/电磁力维系）": {"name": "What cosmic expansion means: space itself is expanding (galaxies and the Earth are held together by gravitational/electromagnetic forces)", "note": "Expansion means that space itself is stretching, not that galaxies are flying outwards through a pre-existing space, so there is no centre of expansion and observers in any galaxy would see the same recession pattern. The interiors of galaxies, the solar system and atoms are held together by gravitational or electromagnetic forces, so the space inside them does not expand with the universe."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙年龄估算 t = 1/H₀ ≈ 137 亿年": {"name": "Estimating the age of the universe t = 1/H₀ ≈ 13.7 billion years", "note": "If the rate of expansion is assumed constant, the time needed to run the galaxies back to a single point is the reciprocal of the Hubble constant, t=1/H₀, and with H₀=70.0 km·s⁻¹·Mpc⁻¹ this gives about 1.4×10¹⁰ years, that is about 14 billion years. This estimate ignores changes in the rate of expansion, so it is only a lower-limit result correct in order of magnitude."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/大爆炸时间线：暴胀→夸克汤→冷却形成质子中子→核合成（H、He、Li，约 3 分钟）": {"name": "Big Bang timeline: inflation → quark soup → cooling to form protons and neutrons → nucleosynthesis (H, He, Li, about 3 minutes)", "note": "A very short time after the Big Bang came inflation, followed by a hot quark–gluon plasma; as the temperature fell the quarks combined into protons and neutrons, and within roughly the first few minutes light-element nucleosynthesis produced hydrogen, helium and a little lithium, after which nuclear reactions stopped abruptly. The abundances of the light elements in the universe are therefore a fossil record of primordial nucleosynthesis."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/四大证据：哈勃定律、宇宙微波背景辐射 CMBR（2.7 K）、轻元素丰度、星系光谱红移": {"name": "Four main pieces of evidence: Hubble's law, cosmic microwave background radiation (CMBR, 2.7 K), light element abundances, redshift of galaxy spectra", "note": "The four main pieces of evidence for the Big Bang are: Hubble’s law, which shows that the universe is expanding; the cosmic microwave background radiation, the redshifted afterglow of the original hot radiation (about 2.7 K, with peak wavelength about 1.06 mm); light-element abundances that agree with theoretical predictions; and the widespread redshift of galaxy spectra. Hubble’s law and galactic redshift are essentially two aspects of the same piece of evidence."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙的未来：闭合、平坦、开放三种模型；临界密度约 9×10⁻²⁷ kg·m⁻³": {"name": "The future of the universe: closed, flat and open models; critical density about 9×10⁻²⁷ kg·m⁻³", "note": "The future of the universe depends on how the actual mean density compares with the critical density: above the critical density the universe is closed and expansion will eventually turn into contraction (the big crunch); equal to it the universe is flat and expands for ever at a decreasing rate; below it the universe is open and expands for ever. Current observations indicate a nearly flat universe whose expansion is accelerating, which requires dark energy to explain."}, "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙学原理：各向同性 + 均匀性": {"name": "Cosmological principle: isotropy + homogeneity", "note": "The cosmological principle assumes that on the largest scales the universe is isotropic (the same in every direction) and homogeneous (matter is distributed identically everywhere), and this is the starting point shared by the Steady State and Big Bang theories alike. It holds only on the largest scales: on the scale of galaxies and galaxy clusters the universe is clearly not uniform."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践": {"name": "Experiments and Practical Work", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/科学探究技能：提出问题、假设、设计实验、安全操作、收集有效数据": {"name": "Scientific inquiry skills: posing questions, hypothesising, designing experiments, safe practice, collecting valid data", "note": "The complete chain of scientific inquiry is to pose a question, form a testable hypothesis, design and carry out the experiment, collect valid data under safe conditions, and analyse them to reach a conclusion. A hypothesis must be falsifiable and must relate explicitly to the variables being measured. Every stage needs a written record, because assessment is about the process and not only the result."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/SI 单位与有效数字表达；识别趋势、规律与关系": {"name": "SI units and expression of significant figures; identifying trends, patterns and relationships", "note": "All data should be recorded in SI units with an appropriate number of significant figures, and final answers are written to 3 significant figures. When identifying a trend, use the data or the graph to state whether the relationship between the variables is proportional, inversely proportional or a square relationship; for instance, “proportional” requires evidence of a straight line through the origin, and writing only “related” earns no marks."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/不确定度的陈述、计算与合成；异常数据识别与 % difference": {"name": "Stating, calculating and combining uncertainties; identifying anomalous data and % difference", "note": "A measurement must be reported in the form value ± uncertainty unit, with uncertainties combined according to the type of operation. Outliers should be identified using two standard deviations or a clear procedural reason, not simply because a value deviates greatly. Percentage difference is used to compare two measured values while percentage error is used to compare with a theoretical value; the two must not be mixed up."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/用证据得出结论、评价过程、构建科学论证、量纲分析": {"name": "Drawing conclusions from evidence, evaluating procedures, constructing scientific arguments, dimensional analysis", "note": "Conclusions must be traceable to specific data and physical principles, not merely an answer. An evaluation of the procedure should identify the real sources of error and concrete improvements (such as using a more precise instrument or taking more measurements), rather than writing vaguely that “error came from human factors”. Dimensional analysis can be used both to check whether a formula has been rearranged correctly and to work out the unit a gradient should have."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/抛体运动实验（测水平初速度并与能量守恒对比）；单摆测重力加速度 g": {"name": "Projectile motion experiment (measuring horizontal initial velocity and comparing with conservation of energy); measuring g with a simple pendulum", "note": "In the projectile experiment the initial speed is calculated from the measured horizontal range and drop height and then compared with the value predicted by conservation of energy to test the model. In the pendulum experiment the period equation T=2π√(l/g) is rearranged to T²=4π²l/g and g is found from the gradient of a graph of T² against l. The amplitude must be kept below about 10° for the simple harmonic approximation to hold, and many complete oscillations should be timed to reduce timing error."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/锥形摆测向心力；力桌实验验证矢量合成": {"name": "Measuring centripetal force with a conical pendulum; force table experiment verifying vector addition", "note": "In the conical pendulum the radius and angular velocity are varied, and a graph of F against ω² should be a straight line through the origin with gradient equal to mr. In the force table experiment three strings pull on a ring at different angles until it is in equilibrium, testing that the resultant of any two of the forces is equal in magnitude and opposite in direction to the third, and so verifying the parallelogram law of vector addition. Both use a graphical method to reduce random error."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/磁学实验：条形磁铁力-距离关系、载流导体受力、长直导线磁场强度": {"name": "Magnetism experiments: force–distance relationship for a bar magnet, force on a current-carrying conductor, magnetic field strength of a long straight wire", "note": "Magnetism experiments are usually of three kinds: measuring the force between bar magnets as a function of distance with a balance or force sensor to test an inverse-square or power law (which requires taking logarithms to linearise first); passing a current through a conductor in a magnetic field to verify F=BIl; and using a Hall probe to measure the field around a long straight wire and test how B varies with 1/r. In each case the background effect of the Earth’s magnetic field must be eliminated first."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/光学实验：折射性质探究、衍射法测激光波长、可见光谱与原子发射光谱": {"name": "Optics experiments: investigating refractive properties, measuring laser wavelength by diffraction, visible spectra and atomic emission spectra", "note": "Optics experiments generally include measuring the angle of refraction in a semicircular glass block for various angles of incidence to verify Snell’s law and find the refractive index; measuring the wavelength of a laser with a diffraction grating using nλ=d sinθ; and observing the line emission spectra of elements with spectral tubes and a grating. For the last of these, the spectrometer must be calibrated first and several lines read and averaged to reduce random error."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/普朗克常数测定；电阻串并联": {"name": "Determination of Planck's constant; resistors in series and parallel", "note": "The classic method of measuring Planck’s constant is to measure the stopping potential for several filters of different wavelength, plot V_s against f, take h/e from the gradient and multiply by e to obtain h. In the resistance experiment the currents and voltages of series and parallel combinations are measured to verify R_series=R₁+R₂ and 1/R_parallel=1/R₁+1/R₂, bearing in mind the systematic error introduced by the internal resistance of the meters."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/演示实验：电动机与交流发电机、光电效应模拟、范德格拉夫起电机、玻尔模型、狭义相对论": {"name": "Demonstration experiments: electric motors and AC generators, photoelectric effect simulation, Van de Graaff generator, Bohr model, special relativity", "note": "Demonstrations turn an abstract model into something visible: a motor and a generator are reverses of each other, a photoelectric effect simulation shows the separate effects of intensity and frequency, a Van de Graaff generator demonstrates charge accumulation and discharge, and demonstrations of the Bohr model and of relativity build an intuitive picture. When watching, focus on how what you see corresponds to the equations in the textbook."}, "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/实验报告范例：胡克定律测弹簧劲度系数（静态 F−x 与动态 T²−m 双法）、密度与不确定度": {"name": "Sample practical report: measuring the spring constant using Hooke's law (both the static F−x and dynamic T²−m methods), density and uncertainty", "note": "The Hooke’s law experiment can determine the spring constant in two ways: the static method plots F against extension x, with gradient k, while the dynamic method plots T² against mass m, which from T=2π√(m/k) has gradient 4π²/k. Similar results from the two methods confirm each other. In the density experiment the uncertainties in mass and volume are combined separately, then the percentage uncertainty in density is found using the rule for multiplication and division."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源": {"name": "Assessment and Supporting Resources", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/校本任务：TT1（14%）、EA 评估与分析（12%）、EE 评估考试（20%）、Lab Assessment（10%）、TT2（14%）、FE（30%）": {"name": "School-based tasks: TT1 (14%), EA assessment and analysis (12%), EE assessment exam (20%), Lab Assessment (10%), TT2 (14%), FE (30%)", "note": "Physics assessment totals 100%: Tests 40% (TT1 14%, TT2 14%, EA 12%), Examination 50% (EE 20%, FE 30%) and Science Inquiry 10%. EA is the evaluation and analysis task and EE is the evaluation examination; the names are similar but the nature of the two is different, so be sure to distinguish them before filling in any form."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/TT1 范围：重力、水平/竖直圆周运动、静平衡与质心；EE 范围：静平衡与质心、相对论、电磁学": {"name": "TT1 scope: gravity, horizontal/vertical circular motion, static equilibrium and centre of mass; EE scope: static equilibrium and centre of mass, relativity, electromagnetism", "note": "TT1 covers gravity and satellite motion, horizontal and vertical circular motion, and static equilibrium and centre of mass; the EE additionally covers relativity and electromagnetism, so its scope is clearly wider. When revising, work through the recurring common topics such as centre of mass and equilibrium first, since they are examined in both TT1 and the EE."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/TT2 范围：电磁学、波粒二象性与量子理论；FE 覆盖 Unit 3 + Unit 4 全部": {"name": "TT2 scope: electromagnetism, wave–particle duality and quantum theory; FE covers all of Unit 3 + Unit 4", "note": "TT2 covers electromagnetism and wave–particle duality and quantum theory, while the FE (final examination) covers all of Unit 3 and Unit 4, carries a weighting of 30% and is the single most heavily weighted assessment. Preparation for the FE must therefore be a full-scope review built around the formula and data sheet, not a bet on the topics that have already been examined."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/WACE 外部考试（180 分 / 3 小时）：Section 1 短答 30% + Section 2 长答 50% + Section 3 阅读理解与数据分析 20%": {"name": "WACE external examination (180 marks / 3 hours): Section 1 short answer 30% + Section 2 extended answer 50% + Section 3 comprehension and data analysis 20%", "note": "The WACE external written examination lasts 3 hours and is marked out of 180, made up of short answer (30%), extended answer (50%), and comprehension and data analysis (20%), with the extended answer worth the most. Answers must show the full formula, the substitution and the units; a final answer on its own earns nothing. Section 3 usually presents an unfamiliar context and tests the ability to transfer models from the course to a new situation."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/考试规则：最终答案 3 位有效数字、估算最多 2 位、必须带单位、须写全过程、使用公式与数据册": {"name": "Examination rules: final answers to 3 significant figures, estimates to at most 2, units must be included, full working must be shown, formula and data booklet permitted", "note": "The examination requirements are firm: all numerical answers to 3 significant figures (estimates to at most 2), units always included, and the complete working shown. Use the constants from the official formula and data sheet and set out the derivation clearly in the left-hand column. These are the easiest process marks both to secure and to lose."}, "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/VAULT OF ATPHY（79 页）：课
