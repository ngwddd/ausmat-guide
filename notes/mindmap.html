<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识导图 · AUSMAT 学习资料</title>
<style>
  :root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2733;--muted:#6b7684;--line:#dfe4ea;--accent:#2f6fed;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.05);z-index:5;}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
  header h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px;}
  .spacer{flex:1;}
  button{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.15s;}
  button:hover{background:#f0f4ff;border-color:#c3d3f7;color:var(--accent);}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  #search{font-family:inherit;font-size:12.5px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;width:170px;outline:none;}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.12);}
  #main{flex:1;display:flex;min-height:0;position:relative;}
  #canvasWrap{flex:1;position:relative;overflow:hidden;cursor:grab;}
  #canvasWrap.dragging{cursor:grabbing;}
  svg{display:block;width:100%;height:100%;}
  .node-rect{rx:9;ry:9;stroke-width:1.5;cursor:pointer;}
  .node-label{font-size:12.5px;pointer-events:none;dominant-baseline:middle;}
  .badge{font-size:11px;pointer-events:none;dominant-baseline:middle;font-weight:700;}
  .link{fill:none;stroke-width:1.8;opacity:.55;}
  .node-g{cursor:pointer;}
  .node-g:hover .node-rect{filter:brightness(.96);}
  .dim{opacity:.15;transition:opacity .2s;}
  .hit{opacity:1;}
  #side{width:335px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);padding:16px 18px;overflow-y:auto;}
  #side h2{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.6px;}
  #sideTitle{font-size:16px;font-weight:700;margin:0 0 10px;line-height:1.45;}
  #sideBody{font-size:13px;line-height:1.8;color:#333c49;white-space:pre-wrap;}
  #sideSrc{margin-top:14px;font-size:11.5px;color:var(--muted);background:#f6f8fb;border:1px solid #e8edf4;border-radius:8px;padding:9px 11px;line-height:1.6;word-break:break-all;}
  .legend{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;}
  .legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer;border-radius:6px;}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block;flex-shrink:0;}
  .legend div:hover{color:var(--accent);}
  .tip{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:#93a0b0;pointer-events:none;}
  #timeline{position:absolute;inset:0;background:rgba(244,246,249,.99);overflow-y:auto;padding:26px 34px 60px;display:none;}
  #timeline.show{display:block;}
  #timeline h2{margin:0 0 4px;font-size:19px;}
  #timeline p.sub{margin:0 0 20px;color:var(--muted);font-size:12.5px;line-height:1.7;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(16,24,40,.07);}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #eef1f6;vertical-align:top;line-height:1.6;}
  th{background:#eef3fd;color:#2b4a86;font-weight:600;font-size:12px;white-space:nowrap;}
  td.date{white-space:nowrap;font-weight:600;color:#2b3a52;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="../index.html" class="siteback" style="text-decoration:none;color:#2b6cb0;font-weight:600;font-size:14px;white-space:nowrap;padding:4px 10px;border:1px solid #cfd8e3;border-radius:6px;">← 返回站点</a>

    </div>
    <aside id="side">

      <div id="sideBody" data-i18n="这里会显示该知识点的具体内容。">这里会显示该知识点的具体内容。</div>
      <div id="sideSrc" style="display:none"></div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
</div>

const SVG_NS = "http://www.w3.org/2000/svg";
const NODE_H = 30, V_GAP = 9, H_GAP = 46, PAD_X = 13, MAX_W = 250;

function fontFor(d){ return (d<=1 ? "600 " : "") + (d<=1 ? 13 : 12.5) + "px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif"; }
function textW(s, d){ measureCtx.font = fontFor(d); return measureCtx.measureText(s).width; }

function wrapText(text, d, maxW){
  if (textW(text, d) <= maxW) return [text];
  const parts = text.split(/(?<=[\s\/、,，])/);
  const lines = []; let cur = "";
  for (const pt of parts){
    if (textW(cur + pt, d) > maxW && cur){ lines.push(cur.trim()); cur = pt; }
    else cur += pt;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines.slice(0, 3);
}

let UID = 0;
function normalize(n, d, color){
  n._id = UID++;
  n._depth = d;
  n._color = n.color || color;
  n._lines = wrapText(n.name, d, MAX_W);
  n._w = Math.max(46, Math.max.apply(null, n._lines.map(l => textW(l, d))) + PAD_X*2 + (n.children && n.children.length ? 16 : 0));
  n._h = n._lines.length > 1 ? NODE_H + (n._lines.length-1)*15 : NODE_H;
  n._open = d < 2;
  if (n.children) n.children.forEach(c => normalize(c, d+1, n._color));
  return n;
}

function layout(root){

  (function measure(n){
    if (!n._visible) return;
    colW[n._depth] = Math.max(colW[n._depth] || 0, n._w);
    if (n._open && n.children) n.children.forEach(measure);
  })(root);
  const colX = []; let acc = 0;
  for (let i=0;i<colW.length;i++){ colX[i] = acc; acc += (colW[i]||0) + H_GAP; }

  (function place(n){
    if (!n._visible) return;
    n._x = colX[n._depth];
    const kids = (n._open && n.children) ? n.children.filter(c => c._visible) : [];
    if (!kids.length){ n._y = cursor + n._h/2; cursor += n._h + V_GAP; return; }
    const start = cursor;
    kids.forEach(place);
    n._y = (start + cursor - V_GAP) / 2;

  return { width: acc, height: cursor };

  (function walk(n, visible){
    n._visible = visible;

    d.innerHTML = '<i style="background:' + s._color + '"></i><span>' + s.name + '</span>';
    d.onclick = function(){
      (function walk(n){ n._open = true; if (n.children) n.children.forEach(walk); })(s);
      render(); fit(0.5); showDetail(s);
    };
    el.appendChild(d);
  });
}

/Reading Materials（159 页）：Introduction to Scientific Programming with Python 及网络安全专题阅读": {"name": "Reading Materials (159 pages): Introduction to Scientific Programming with Python and cyber security topic readings", "note": ""}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Mentor Worksheet 9 份（W1–W9）：从算术运算、循环、伪代码追踪表，到网络、数据库规范化、网络安全": {"name": "9 Mentor Worksheets (W1–W9): from arithmetic operations, loops and pseudocode trace tables, to networks, database normalisation and cyber security", "note": ""}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Lab Practice（50 页）与 Homework：良好编程实践汇报、网络组件信息图、WACE 真题练习": {"name": "Lab Practice (50 pages) and Homework: presentation on good programming practice, network components infographic, WACE past-paper practice", "note": ""}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/Course Introduction（100 页）：SCSA syllabus 全文、Additional Syllabus Support Booklet（伪代码/算法/协议表/CISCO 图例/ER 图/SQL 速查）": {"name": "Course Introduction (100 pages): full SCSA syllabus, Additional Syllabus Support Booklet (pseudocode/algorithms/protocol tables/CISCO legends/ER diagrams/SQL quick reference)", "note": ""}, "AUSMAT May 2026 学习资料/CSC 计算机科学/语言、工具与考核资源/个人栏目：Class Notes、Handouts（含全部作业答案）、Homework、Quizzes": {"name": "Personal section: Class Notes, Handouts (including all assignment answers), Homework, Quizzes", "note": ""}};

// 记住当前语言
let LANG = "zh";
try { const s = localStorage.getItem("mm-lang"); if (s) LANG = s; } catch(e) {}

// 只重算文字与尺寸，不动 _open（normalize 会把展开状态重置成 d<2，不能用）
function refreshDims(n, d, color){
  n._depth = d;
  if (n.color) n._color = n.color;
  n._lines = wrapText(n.name, d, MAX_W);
  n._w = Math.max(46, Math.max.apply(null, n._lines.map(l => textW(l, d))) + PAD_X*2 + (n.children && n.children.length ? 16 : 0));
  n._h = n._lines.length > 1 ? NODE_H + (n._lines.length-1)*15 : NODE_H;
  if (n.children) n.children.forEach(c => refreshDims(c, d+1, n._color));
}

// 按路径把 name/note 换成目标语言；源语言存在 _zh 里，便于来回切
function swapLang(n, lang, path, zhData){
  const p = path ? path + "/" + (n._zh ? n._zh.name : n.name) : n.name;
  if (!n._zh){ n._zh = { name: n.name, note: n.note || "" }; }
  const tr = I18N[p] || I18N[path];
  if (lang === "en" && tr && tr.name){
    n.name = tr.name;
    if (tr.note) n.note = tr.note;
  } else {
    n.name = n._zh.name;
    n.note = n._zh.note;
  }
  if (n.children) n.children.forEach(c => swapLang(c, lang, p, zhData));
}

function applyLang(lang, rerender){
  LANG = lang;
  try { localStorage.setItem("mm-lang", lang); } catch(e) {}
  swapLang(DATA, lang, "", null);
  refreshDims(DATA, 0, "#2f6fed");
  DATA._open = true;

  if (rerender){
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      const k = el.getAttribute("data-i18n");
      if (lang === "en" && UI_EN[k]) el.textContent = UI_EN[k];
      else el.textContent = k;
    });
    const si = document.getElementById("search");
    if (si) si.placeholder = lang === "en" ? UI_EN["搜索知识点…"] : "搜索知识点…";
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    // 顶栏标题结构是 <h1>文字<small id="stat">计数</small></h1>。
    // 之前逐节点删除文本节点的写法把 <small> 也弄丢了（stat 变 null，render 报错），
    // 改为整体重建 h1，并把 small 一起重建，最稳。
    const h1 = document.querySelector("header h1");
    if (h1) {
      const old = document.getElementById("stat");
      const cnt = old ? old.textContent : "";
      h1.textContent = lang === "en" ? "AUSMAT Study Notes — Mind Map" : "AUSMAT 学习资料思维导图";
      const sm = document.createElement("small");
      sm.id = "stat";
      sm.textContent = cnt;
      h1.appendChild(sm);
    }
    const btn = document.getElementById("btnLang");
    if (btn) btn.textContent = lang === "en" ? "中文" : "EN";
    const st = document.getElementById("sideTitle");
    const sb = document.getElementById("sideBody");
    if (st) st.textContent = lang === "en" ? "Click a node to see its details" : "点击导图中的节点查看说明";
    if (sb) sb.textContent = lang === "en" ? "Details of the selected topic appear here." : "这里会显示该知识点的具体内容。";
    // 图例标题是 buildLegend() 在 JS 字符串里拼的，不能用 data-i18n 注，
    // 只能在这里跟着语言重写。
    const lh = document.querySelector("#legend h2");
    if (lh) lh.textContent = lang === "en" ? UI_EN["科目（点击展开整科）"] : "科目（点击展开整科）";
    buildLegend();
    const lh2 = document.querySelector("#legend h2");
    if (lh2) lh2.textContent = lang === "en" ? UI_EN["科目（点击展开整科）"] : "科目（点击展开整科）";
  }
  render();
  if (rerender) fit(0.5);
}

(function init(){
  normalize(DATA, 0, "#2f6fed");
  DATA._open = true;
  buildLegend(); buildTimeline(); render(); initialView();
})();

// 启动完成后按记忆的语言再应用一次。
// 不能放进上面的 IIFE：那时 var UI_EN / var I18N 还未赋值。
if (LANG === 'en') applyLang('en', true);
</script>
