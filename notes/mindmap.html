<!DOCTYPE html>

<style>
/* 知识导图 · 外壳配色取自站点 assets/style.css 的变量，深色模式自动生效。
   注意：**节点方块的颜色不走这里** —— 它们由脚本内联设置，深层节点读的是
   themeVar("--bg") / themeVar("--text")，同样跟随主题。
   这里只放导图独有的东西，通用排版（页头/页脚/标题/表格）交给站点样式表。 */
#app { display: block; }
.mm-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px;
}
.mm-toolbar input {
  font: inherit; font-size: .9rem; padding: 7px 12px; width: 210px; outline: none;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text);
}
.mm-toolbar input.mm-nohit { border-color: var(--warn); background: var(--warn-bg); }
.mm-toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.mm-toolbar button {
  font: inherit; font-size: .87rem; padding: 7px 14px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text-soft);
  transition: background .15s, border-color .15s, color .15s;
}
.mm-toolbar button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.mm-toolbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.mm-toolbar .spacer { flex: 1; }

/* 「适应窗口」缩到下限仍放不下时的提示条 */
.mm-hint {
  margin: 8px 0 0; padding: 7px 12px; border-radius: 6px;
  font-size: .82rem; color: var(--warn); background: var(--warn-bg);
}

/* ── 打印 ────────────────────────────────────────────────────────
   学生真实需求是「打出来背」（高分学生走查原话）。

   ⚠ 第一版这里只写了 `#canvasWrap svg { height: 70vh }`，**是坏的**：
   SVG 没有 viewBox、transform 也没重置，打印出来只截当前视口那一块。
   两位走查各自实测：全部展开后打印成 PDF，470 个知识点名命中 0 个。

   而把整棵树缩到一页宽同样不可读（1156px → 180mm 时 12.5px 的字只剩 1.9px）。
   所以打印改成输出**文本大纲**（#printOutline，由 buildPrintOutline 在
   beforeprint 时填充）：缩进反映层级、节点带说明，可读且能自然分页。
   画布本身在打印时隐藏，不再假装「导图能打印」。 */
.print-only { display: none; }

@media print {
  .mm-toolbar, #fitHint, #legend, #timeline, #canvasWrap,
  .site-nav, footer.site, .back, .lang-switch, nav { display: none !important; }
  .print-only { display: block !important; }
  #app, .wrap, main { max-width: none !important; width: 100% !important; }
  body { background: #fff !important; color: #000 !important; }
  .note-head h1, #sideTitle, #sideBody { color: #000 !important; }
  #printOutline h1 { font-size: 15pt; margin: 0 0 2pt; }
  #printOutline .po-meta { font-size: 9pt; color: #555; margin: 0 0 10pt; }
  #printOutline .po-l { font-size: 10pt; line-height: 1.45; white-space: pre-wrap; }
  #printOutline .po-n { font-size: 8.5pt; line-height: 1.4; color: #333;
                        white-space: pre-wrap; margin: 0 0 3pt; }
  #printOutline .po-d0 { font-weight: 700; margin-top: 8pt; }
  #printOutline .po-d1 { font-weight: 600; margin-top: 5pt; }
  #printOutline .po-d2 { margin-left: 10pt; }
  #printOutline .po-d3 { margin-left: 20pt; }
  #printOutline .po-d4 { margin-left: 30pt; }
  @page { margin: 14mm; }
}

/* 画布卡片。高度用 vh 夹住，太高会把页脚顶到屏幕外，太矮看不清树。 */
#canvasWrap {
  position: relative; overflow: hidden; cursor: grab;
  height: clamp(340px, 56vh, 600px);
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-soft);
}
#canvasWrap.dragging { cursor: grabbing; }
#canvasWrap svg { display: block; width: 100%; height: 100%; }
.node-rect { stroke-width: 1.5; cursor: pointer; }
.node-label { font-size: 12.5px; pointer-events: none; dominant-baseline: middle; }
.badge { font-size: 11px; pointer-events: none; dominant-baseline: middle; font-weight: 700; }
.link { fill: none; stroke-width: 1.8; opacity: .55; }
.node-g { cursor: pointer; }
.node-g:hover .node-rect { filter: brightness(.96); }
.dim { opacity: .15; transition: opacity .2s; }
.hit { opacity: 1; }

/* 提示条压在画布左下角 */
#canvasWrap .tip {
  position: absolute; left: 12px; bottom: 10px; pointer-events: none;
  font-size: 11.5px; color: var(--text-soft); opacity: .85;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
}

/* 详情栏：移到画布下方，跟文档流一致 */
#side {
  margin-top: 22px; padding: 16px 20px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-soft);
}
#side h2 {
  font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-soft); margin: 0 0 10px;
}
#sideTitle { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; line-height: 1.5; }
#sideBody { font-size: .94rem; line-height: 1.85; white-space: pre-wrap; }
#sideSrc {
  margin-top: 14px; padding: 9px 11px; font-size: .8rem; line-height: 1.6;
  color: var(--text-soft); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; word-break: break-all;
}

.legend { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.legend h2 {
  font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-soft); margin: 0 0 8px;
}
.legend div {
  display: flex; align-items: center; gap: 8px; font-size: .87rem;
  padding: 4px 0; cursor: pointer; border-radius: 6px;
}
.legend div:hover { color: var(--accent); }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex-shrink: 0; }

/* 考试时间线：盖在画布上的一张可滚动表 */
#timeline {
  position: absolute; inset: 0; display: none; overflow-y: auto;
  padding: 24px 28px 40px; background: var(--bg);
}
#timeline.show { display: block; }
#timeline h2 { margin: 0 0 4px; font-size: 1.15rem; }
#timeline p.sub { margin: 0 0 18px; color: var(--text-soft); font-size: .84rem; line-height: 1.7; }
#timeline table { width: 100%; margin: 0; font-size: .84rem; }
#timeline th, #timeline td { padding: 8px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
#timeline th { background: var(--accent-bg); color: var(--text); font-weight: 600; white-space: nowrap; }
#timeline td.date { white-space: nowrap; font-weight: 600; }
#timeline tr:last-child td { border-bottom: none; }
#timeline .tag {
  display: inline-block; padding: 1px 7px; border-radius: 20px;
  font-size: .72rem; font-weight: 600; color: #fff; white-space: nowrap;
}

@media print {
  .mm-toolbar, #canvasWrap .tip { display: none; }
  #canvasWrap { height: auto; page-break-inside: avoid; }
}
</style>

    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2);
    path.setAttribute("class", "link");
    path.setAttribute("stroke", c._color);
    viewport.appendChild(path);
  });

  nodes.forEach(function(n){
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", "node-g");
    g.setAttribute("transform", "translate(" + n._x + "," + (n._y - n._h/2) + ")");
    const isLeaf = !(n.children && n.children.length);
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("class", "node-rect");
    r.setAttribute("width", n._w); r.setAttribute("height", n._h);
    if (n._depth <= 1){ r.setAttribute("fill", n._color); r.setAttribute("stroke", n._color); }
    else { r.setAttribute("fill", themeVar("--bg", "#ffffff")); r.setAttribute("stroke", n._color); }
    g.appendChild(r);

    const dark = n._depth <= 1;
    n._lines.forEach(function(line, i){
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("class", "node-label");
      t.setAttribute("x", PAD_X);
      t.setAttribute("y", n._h/2 + (i - (n._lines.length-1)/2)*15);
      t.setAttribute("fill", dark ? "#ffffff" : themeVar("--text", "#1f2733"));
      t.textContent = line;
      g.appendChild(t);
    });

    if (!isLeaf){
      const b = document.createElementNS(SVG_NS, "text");
      b.setAttribute("class", "badge");
      b.setAttribute("x", n._w - 11);
      b.setAttribute("y", n._h/2);
      b.setAttribute("text-anchor", "middle");
      b.setAttribute("fill", dark ? "rgba(255,255,255,.85)" : n._color);
      b.textContent = n._open ? "–" : "+";
      g.appendChild(b);
    }

    g.addEventListener("click", function(ev){
      ev.stopPropagation();
      if (!isLeaf){ n._open = !n._open; render(); }
      showDetail(n);
    });
    // 悬停不再覆盖详情栏（面板在画布下方，划过就冲掉正在读的内容）。
    // 悬停仍有 CSS 的 .node-g:hover 高亮，点节点才更新详情。
    viewport.appendChild(g);
  });

  applyTransform();
  document.getElementById("stat").textContent = statText(nodes.length, DATA.children.length);
}

function fit(floorK){
  const rect = wrapEl.getBoundingClientRect();
  refreshVisibility(DATA);
  const b = layout(DATA);
  const pad = 46;
  const k = Math.min((rect.width - pad*2)/b.width, (rect.height - pad*2)/b.height, 1.15);
  const floor = floorK || MIN_READABLE_K;
  view.k = Math.max(k, floor);
  // 缩到下限仍放不下：不要把字继续缩小（那样等于看不见），
  // 改为横向居中、纵向回到顶部，并提示可以拖动。
  const overflow = k < floor - 1e-6;
  view.x = pad;
  view.y = overflow ? pad
                    : Math.max(20, (rect.height - b.height*view.k)/2);
  applyTransform();
  const hint = document.getElementById("fitHint");
  if (hint) hint.style.display = overflow ? "block" : "none";
}
function initialView(){
  refreshVisibility(DATA); layout(DATA);
  view.k = 0.85; view.x = 46; view.y = 28;
  applyTransform();
}

var MM_NOTES = {"AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/指数函数求导：e 的引入 lim(h→0)(aʰ−1)/h、d/dx(eˣ)=eˣ、A·e^(kx) 建模": "e 是使 lim(h→0)(aʰ−1)/h 等于 1 的唯一底数，故 d/dx(eˣ)=eˣ；由链式法则 d/dx(e^(kx))=k·e^(kx)，模型 A·e^(kt) 中 k>0 增长、k<0 衰减。易错：以为任意底数都有 d/dx(aˣ)=aˣ（应为 aˣ·ln a）。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/三角函数求导：d/dx(sin x)=cos x、d/dx(cos x)=−sin x（含几何构造法）": "d/dx(sin x)=cos x、d/dx(cos x)=−sin x 是弧度制下的结果，可由图像、数值逼近与几何构造推出；内层为 kx 时用链式法则，得 d/dx(sin kx)=k·cos kx。易错：漏掉 cos 的负号，或在角度制下套用求导公式。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/求导法则：乘积法则、商法则、链式法则（复合函数 f(ax−b)）": "乘积法则 d/dx(uv)=u′v+uv′；商法则 d/dx(u/v)=(u′v−uv′)/v²，分子顺序不可颠倒；链式法则 d/dx f(g(x))=f′(g(x))·g′(x)，处理 f(ax−b) 时外层导数还要乘 a。先辨结构再套公式，混用三者是最典型的失分点。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/二阶导数：作为变化率的变化率、加速度是位置的二阶导数": "把导函数再求一次导即二阶导数，含义是「变化率的变化率」；位置 s(t) 求导得速度、再求导得加速度。f″(x)>0 表示斜率在增大。注意 f′(x)=0 给出驻点，f″(x)=0 只是拐点的候选，二者通常不是同一批点。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/增量公式 δy ≈ f′(x)·δx（误差与近似计算）": "以切线代替曲线做近似：δy ≈ f′(x)·δx，即函数的小增量约等于导数乘自变量增量，δx 越小越准。常用于估算幂、根式或三角值的变化与误差，也可由允许误差反推 δx 的容差。前提是 δx 足够小，否则偏差明显。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/凹凸性与拐点；二阶导数判别法判定局部极大/极小": "f″(x)>0 曲线凹向上、f″(x)<0 凹向下，f″ 变号处为拐点。二阶导数判别法：f′(c)=0 时，f″(c)<0 为局部极大、f″(c)>0 为局部极小；f″(c)=0 时判别法失效，须回到一阶导数符号表。别把拐点误当极值点。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 微分进阶与应用/用一、二阶导数求驻点与拐点并作图；优化问题（最值应用）": "作图顺序：由 f′ 求驻点并判性质，由 f″ 定凹凸区间与拐点，再补截距和两端趋势。优化题先设变量、写出目标函数与约束，消元成单变量后求导置零，最后必须用二阶导或端点比较论证是最大还是最小。漏定义域、漏「证明最值」最易扣分。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/反导数（不定积分）：∫xⁿdx、∫eˣdx、∫sin x dx、∫cos x dx 等「九公式」": "不定积分是求导的逆运算，结果是一族函数，必须写 +c。基本公式由导数表反推：∫xⁿdx=xⁿ⁺¹/(n+1)+c（n≠−1）、∫eˣdx=eˣ+c、∫sin x dx=−cos x+c、∫cos x dx=sin x+c。易错：漏写 c；把 n=−1 也套幂公式。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/∫f(ax−b)dx 型不定积分与反微分的线性性质": "内层是一次式时可以直接「除以系数」：∫f(ax−b)dx=(1/a)F(ax−b)+c，因为回代求导时链式法则会带出 a。反微分还有线性性质，常数可提出、和差可拆项。注意该技巧只对 ax−b 这种一次内层成立，遇到 x² 等内层不能照搬。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/曲线族：由 f′(x) 与初始条件 f(a)=b 求出 f(x)": "已知 f′(x) 与一个初始条件即可定出唯一原函数：先积分得含常数 c 的通解，再代入 f(a)=b 解出 c。几何上通解是一族形状相同、上下平移的曲线，初始条件挑出其中一条。常见错误是先令 c=0 再解，或最终答案里不写 c。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/定积分：Σf(xᵢ)δxᵢ 求和逼近，定义为和的极限": "把 [a,b] 分成 n 段，用 Σf(xᵢ)δxᵢ 求矩形面积和，再令 n→∞、δx→0，该和的极限就是定积分。左端点、右端点与中点矩形给出不同近似，n 越大越接近真值。结果是一个数，不带 +c。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/定积分作为曲线下面积；带符号面积的相加": "定积分是曲线与 x 轴之间的带符号面积：x 轴上方取正、下方取负。求「总面积」须先找零点分段，各段积分后取绝对值相加；求两曲线所夹面积则积分「上减下」。最常见错误是直接积分就当作面积，忽略了 x 轴下方的负号。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/微积分基本定理：F′(x)=f(x)、∫ₐᵇf′(x)dx = f(b)−f(a)": "若 F′(x)=f(x)，则 ∫ₐᵇf′(x)dx=f(b)−f(a)，把定积分化为「找原函数、代上下限」；另一形式 d/dx∫ₐˣf(t)dt=f(x) 说明先积分再求导回到原函数。代入时上下限顺序不能颠倒，原函数的 +c 在相减中自动抵消。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 积分 Integrals/积分应用：由变化率求总变化、曲线间面积、由 v 求位移、由 a 求位置": "变化率的积分给出总变化：∫ₐᵇR′(t)dt=R(b)−R(a)；速度积分得位移、速率 |v| 积分得路程、加速度积分配合初值可得速度与位置。求曲线间面积要先求交点定上下限，并判断哪条曲线在上。典型陷阱：把位移当路程，未在速度变号处分段。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/离散随机变量与概率函数；用相对频率作概率点估计": "离散随机变量只取可数个值，其概率函数要求每个概率介于 0 与 1 之间且总和为 1——这一条常用来求未知常数 k。没有理论模型时，用大量数据的相对频率作为概率的点估计。注意 P(X=x) 与累积概率 P(X≤x) 不要混。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/均匀离散分布与非均匀离散分布": "均匀离散分布中各取值等可能，共 n 个取值时每个概率都是 1/n，适合骰子、转盘等对称情境；非均匀分布各取值概率不等，必须逐个列表给出。判断看的是概率是否相等，而不是取值之间的间隔是否相等。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/期望值/均值（位置度量）、方差与标准差（离散程度，用 CAS 计算）": "期望 E(X)=Σx·P(X=x) 度量分布中心，是长期平均值；方差 Var(X)=E(X²)−[E(X)]² 或 Σ(x−μ)²P(X=x)，标准差是它的平方根，度量离散程度且与 X 同单位。考场上可用计算器的统计功能求值。易错：把方差写成 μ²，或忘记开方。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/线性变换 Y=aX+b 对均值与标准差的影响": "对 Y=aX+b：E(Y)=aE(X)+b、σ_Y=|a|σ_X、Var(Y)=a²Var(X)。所以平移 b 只移动中心、不改变离散程度，缩放 a 使均值与标准差同比例变化。易错：标准差忘记取绝对值，方差忘记平方。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/Bernoulli 分布：适用情境、均值 p、方差 p(1−p)": "一次只有两种结果（成功/失败）、成功概率恒为 p 的试验服从 Bernoulli 分布，均值 p、方差 p(1−p)、标准差 √(p(1−p))。它是二项分布在 n=1 时的特例。判断情境紧扣三点：结果二分类、概率固定、只做一次。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U3 · 离散随机变量/二项分布：P(X=x)=C(n,x)pˣ(1−p)ⁿ⁻ˣ、均值 np、方差 np(1−p)": "n 次独立重复的 Bernoulli 试验中成功次数 X 服从二项分布：P(X=x)=C(n,x)pˣ(1−p)ⁿ⁻ˣ，均值 np、方差 np(1−p)。求「至多/至少」时可用累积概率。易错：把不放回抽样当成独立试验——各次不独立时不能用二项模型。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/对数定义为指数：aˣ=b ⇔ x=log_a b；a^(log_a b)=b": "对数是指数的逆运算：aˣ=b ⇔ x=log_a b（a>0 且 a≠1，b>0），于是 a^(log_a b)=b、log_a aˣ=x。把指数式与对数式互化是解指数方程的第一步。真数必须为正，解完方程务必回代检验增根。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/对数代数性质：log(xy)、log(xⁿ)、log(x/y)、log_a 1=0": "三条运算律把乘、除、幂降级：log(xy)=log x+log y、log(x/y)=log x−log y、log(xⁿ)=n·log x；另有 log_a 1=0 与换底公式 log_a b=ln b/ln a。前提是真数全为正，log(x+y) 不能拆开是最常见的错误。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/对数刻度（logarithmic scales）的解释与使用": "对数刻度上等长的一段代表相同的「倍数变化」而非相同差值，适合跨越多个数量级的量（地震震级、声强、pH 等）。读图时应先对刻度取对数再看斜率；用线性刻度的直觉解读，会把 1→10→100 误判成等差增长。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/用对数解指数方程；代数法与图像法解对数方程": "解指数方程可两边取对数或化为同底，借 log(xⁿ)=n·log x 把未知量从指数上拉下来；解对数方程先合并成单个对数再化为指数式。除代数法外，也可用图像法求两曲线交点得到近似解。无论哪种方法都要检验真数为正、底数合法。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/y=log_a x 图像特征、渐近线与 y=log_a(x−c)+b 的平移": "y=log_a x 的定义域为 x>0，过点 (1,0) 与 (a,1)，以 y 轴为竖直渐近线；a>1 时单调递增，0<a<1 时递减。作 y=log_a(x−c)+b 时图像右移 c、上移 b，渐近线随之移到 x=c，定义域变为 x>c。易错：把渐近线当成水平线。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/自然对数 ln x 与 eˣ 的互逆关系": "ln x 是以 e 为底的对数，与 eˣ 互为反函数：ln(eˣ)=x、e^(ln x)=x（x>0），两图像关于 y=x 对称，且 ln 1=0、ln e=1。用它可把 A·e^(kt) 这类模型两边取对数后线性化，从而求参数。注意真数必须为正。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/d/dx(ln x)=1/x、∫(1/x)dx = ln x + c": "对数函数是少数「导数比自身简单」的函数：d/dx(ln x)=1/x；反过来 ∫(1/x)dx=ln x+c（x>0 时成立，一般写作 ln|x|+c）。配合链式法则有 d/dx(ln kx)=1/x，与 k 无关，这是个常考的巧点。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 对数函数/d/dx(ln f(x)) 与 ∫f′(x)/f(x)dx = ln f(x)+c": "链式法则给出 d/dx(ln f(x))=f′(x)/f(x)；反过来，当分子恰好是分母的导数时，∫f′(x)/f(x)dx=ln f(x)+c，识别这一结构是积分的关键技巧，常与一次内层 ax+b 搭配。易错：分母次数高于一次时不能直接套用，绝对值也容易漏。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 连续随机变量与正态分布/用相对频率直方图估计连续随机变量概率": "把数据分组后以「相对频率÷组距」为柱高画直方图，则每根柱的面积等于该组的相对频率、总面积约为 1；组距越细，图形越接近真实的密度曲线。据此可按面积估计连续随机变量落在某区间的概率。易错：把柱高当概率，或用频数代替相对频率。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 连续随机变量与正态分布/概率密度函数 pdf 与累积分布函数 cdf；概率由积分给出": "连续随机变量的概率等于密度函数下的面积：P(a≤X≤b)=∫ₐᵇf(x)dx，且 f(x)≥0、全轴积分为 1（可用来求未知常数 k）；累积分布函数 F(x)=P(X≤x) 是 pdf 的积分，反过来对 F 求导得 pdf。关键区别：连续型取单点的概率为 0。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 连续随机变量与正态分布/连续随机变量的期望、方差、标准差；线性变换对均值与标准差的影响": "连续型按面积加权求和：E(X)=∫x·f(x)dx，Var(X)=∫(x−μ)²f(x)dx=E(X²)−[E(X)]²，标准差取平方根；可用计算器求值。线性变换满足 E(aX+b)=aE(X)+b、σ_Y=|a|σ_X。易错：积分限用错，或没先解出 pdf 里的 k。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 连续随机变量与正态分布/正态模型适用情境与正态 pdf 图像特征（均值 μ、标准差 σ）": "正态分布由均值 μ 与标准差 σ 完全确定：密度曲线关于 x=μ 对称、在 μ 处取最高点，以 x 轴为水平渐近线，拐点在 μ±σ；σ 越大曲线越矮胖。经验上约 68% 的数据落在 μ±σ 内、95% 落在 μ±2σ 内。适合自然变异等对称单峰情境。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 连续随机变量与正态分布/标准正态分布；用 CAS 计算概率与分位数/百分位": "标准化 Z=(X−μ)/σ 后即可用标准正态求概率：计算器上 normCdf(下界, 上界, μ, σ) 给概率，invNorm(左侧面积, μ, σ) 由概率反求分位数，如第 24 百分位对应左侧面积 0.24。易错：invNorm 只认左侧累积面积，上尾概率要先取 1 减。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/随机抽样：总体 / 样本 / 参数 / 统计量 / 普查": "总体是研究对象的全体，样本是其中抽出的部分；参数是刻画总体的未知常数（如 p、μ），统计量是由样本算出的量（如 p̂、x̄），用来估计参数；普查调查全体，没有抽样误差但成本高。分清参数与统计量、并确认抽样随机，是本章一切推断的前提。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/抽样偏差来源：选择偏差、设计缺陷、访谈者、回忆与报告、完成、无应答、自选样本": "常见偏差：选择偏差（抽样框本身偏斜）、问卷设计缺陷、访谈者影响、回忆与报告失真、完成偏差、无应答偏差、自选样本（自愿回应者态度往往更极端）。答题时应点明所给情境属于哪一类，并说明它会把估计值推向哪一边。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/样本比例 p̂ 作为随机变量：均值 p、标准差 √(p(1−p)/n)": "把样本比例 p̂=X/n 看作随机变量：其均值为总体比例 p，标准差为 √(p(1−p)/n)，随 n 增大而变小——n 变四倍，标准差减半。p 未知时用 p̂ 代入计算。理解「每次抽样得到的 p̂ 都不同」是后面区间估计的基础。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/大样本下 p̂ 的近似正态性；中心极限定理 CLT": "当 n 足够大（通常要求 np 与 n(1−p) 都不太小）时，p̂ 的抽样分布近似正态，均值为 p、标准差为 √(p(1−p)/n)，于是可把 p̂ 标准化后求概率。中心极限定理指出大量独立同分布随机变量之和（或均值）趋于正态，与总体本身是否正态无关。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/比例的近似置信区间：p̂ ± z√(p̂(1−p̂)/n)": "比例 p 的近似置信区间为 p̂ ± z√(p̂(1−p̂)/n)，z 由置信水平决定（90% 用 1.645、95% 用 1.96、99% 用 2.576），p 未知时以 p̂ 代入。解释须写「约有 95% 的区间会包含 p」，而非「p 有 95% 的概率落在本区间」。", "AUSMAT May 2026 学习资料/MAM12 数学方法/U4 · 比例的区间估计/误差范围 E = z√(p̂(1−p̂)/n)；误差范围与置信水平的权衡": "误差范围 E=z√(p̂(1−p̂)/n) 是置信区间的半宽：置信水平越高 z 越大、区间越宽；想同时提高置信水平又缩小误差，只能增大样本量。由 E 反解 n=(z/E)²p̂(1−p̂)，p̂ 未知时取 0.5 最保守，算出的 n 要向上取整。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/校本任务：Topic Test 1（10%）、Investigation（20%）、Topic Test 2（20%）、Topic Test 3（10%）、Final（40%）": "成绩按各项权重累计，缺考任何一次都会直接压低总分。三次测验的覆盖面依次推进：先微分，再积分、对数与随机变量，最后正态分布与抽样估计；课纲上这些日期均标注为暂定，实际以教师通知为准。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/Investigation：周长固定的烤盘最大体积优化（3 种形状比较）+ 联系联合国 SDG，28 分制、2 人小组": "Part 1 为两人小组报告：在固定内周长与固定深度下，为三种截面形状（矩形、直角三角形、组合图形）建模，用微分求出使体积最大的尺寸，并把方案联系到 SDG 2、9 或 12 之一。共 28 分（占 4%），其中 24 分给建模与求解、3 分给表达、1 分给 SDG 论证。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/WACE 外部考试：Section 1 禁用计算器 50 分钟（35%）+ Section 2 可用绘图/CAS 计算器 100 分钟（65%，可带 2 张 A4 手写笔记）": "外考分两节：Section One 禁用计算器，50 分钟、47 分，占 35%；Section Two 可用绘图或 CAS 计算器，100 分钟、97 分，占 65%，允许带两张 A4 手写笔记，公式表由考场提供。两节都要求写出推理过程——超过 2 分的题没有过程不给分。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/CAS Manual（46 页）：TI-Nspire CX 指令手册——作图、解方程、微积分、复数、向量矩阵、统计分布与置信区间": "指令要练到盲打：求导与积分在 Calculus 菜单，正态概率用 normCdf(下界, 上界, μ, σ)，由概率反求分位数用 invNorm(左侧面积, μ, σ)，比例的置信区间走 Statistics 的 Confidence Intervals。考前把常用路径抄进笔记。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/三大讲义册：1.Differentiation（293 页）、2.Integration n Log（396 页）、3.Statistics（443 页）": "三册按章编排，每章后附 Exercise 与 Answers，末尾有 Revision Exercises 与 Test & Exam Preparation 分区。复习时按章过例题、再用真题检验；其中「九公式」与 Extra Integration Formula 必须背熟。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/历年卷与复习：MAM Past Year Papers（WACE 2016–2025，806 页）、Revision Series（878 页）、Test Solutions、Exam Prep 考点清单": "复习区把真题、评分标准与考点频次表放在一起：评分标准逐步列出给分点，比答案本身更值得研究；WACE 2016–2025 的频次表能看出各章出题密度，便于把微分技巧、曲线作图、积分应用与统计推断这些高频内容排在复习前列。", "AUSMAT May 2026 学习资料/MAM12 数学方法/考核与备考资源/个人栏目：Class Notes（37 页笔记）、Homework、Quizzes": "课堂笔记多为 OneNote 手写墨迹，复习时应自己整理成公式清单与例题卡片；作业和测验的错题要标注错因（公式记错、审题失误、计算错误）并按章归档，考前优先看错题和讲义例题效率最高。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/向量 Vectors：标量与矢量、平行四边形/三角形法则、分量法、比例作图法": "矢量既有大小又有方向，标量只有大小。相加用首尾相接的三角形法或共起点的平行四边形法，也可分解成互相垂直的分量后按方向求和。常见错误是把矢量大小直接当标量相加，以及忘记最终要给出方向角。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/向量应用：相对速度、速度变化量、力桌实验（合力与平衡力）": "相对速度用 v(A对地)=v(A对B)+v(B对地) 做矢量叠加，速度变化量 Δv 是末速度减初速度的矢量差，方向不一定与初速度相同。力桌实验用三个力拉圆环至平衡来验证矢量合成，作图时要保持同一比例尺。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/力与斜面：牛顿三大定律、惯性、受力图 FBD、法向力": "牛顿三定律分别是惯性定律、F=ma 与作用力反作用力定律。惯性只由质量决定，与速度无关。画受力图时只画作用在该物体上的力，且法向力 N 垂直于接触面，大小由平衡条件决定，不一定等于 mg。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/斜面分量：W∥ = mg sinθ、W⊥ = mg cosθ、N = mg cosθ；摩擦力（粗糙/光滑）": "把重力沿斜面与垂直斜面方向分解：沿斜面向下的分量为 mg sinθ，垂直分量为 mg cosθ，故光滑斜面 N=mg cosθ。粗糙面摩擦力用 f=μN 计算，滑动时与运动方向相反，静摩擦则随外力变化直到达到最大值。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/运动方程：s = ut + ½at²、v = u + at、v² = u² + 2as；静力学与动力学、视重": "匀加速直线运动的三个方程分别是速度与时间、位移与时间、速度与位移的关系式 s=ut+½at²、v=u+at、v²=u²+2as。静力学处理合力为零的情形，动力学处理合力不为零的情形；升降机中的视重是支持力而非重力。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/功与能：W = Fs = mgΔh、重力势能 PE = mgΔh、动能 KE = ½mv²": "功定义为力与沿力方向位移的乘积 W=Fs，重力做功等于 mgΔh。重力势能 PE=mgΔh 与动能 KE=½mv² 都以焦耳为单位。只有力在位移方向上的分量才做功，力垂直于位移时做功为零，这是最常见的失分点。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/能量守恒与转化（PE↔KE→热）；非保守力做功；简谐运动弹簧能量互换": "系统内机械能可以互相转化，只要没有非保守力做功则总量守恒，写方程时务必先规定零势能面。摩擦力等非保守力会把机械能转化为内能，此时能量仍守恒但机械能减少。弹簧振子中弹性势能与动能来回互换，一个周期内各达到两次最大值。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/动量：p = mv、冲量 I = FΔt = Δp、动量守恒": "动量 p=mv 是矢量，方向与速度一致；冲量等于动量的改变量 I=FΔt=Δp，这解释了为何缓冲能减小冲击力。系统所受合外力为零时总动量守恒。常见错误是守恒方程里漏掉速度的符号，导致方向相反的动量被当成相加。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/碰撞类型：弹性（KE 守恒）、非弹性、完全非弹性；爆炸过程": "弹性碰撞同时满足动量守恒与动能守恒；非弹性碰撞只守恒动量，部分动能转为热与形变；完全非弹性碰撞中两物体碰后粘在一起共同运动。爆炸是动量为零的系统向相反方向分裂的过程。判断类型要先看动能是否守恒，再列式求解。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/直线运动：平均速度/加速度、匀加速三方程、自由落体": "平均速度等于总位移除以总时间，不等于各段速度的算术平均。加速度是速度变化率，与速度方向相反时物体减速。自由落体是初速度为零、加速度取 g=9.80 m·s⁻² 的匀加速运动，方向向下。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/位移-时间图（斜率=速度）与速度-时间图（斜率=加速度、面积=位移）": "两类图像要分清：斜率为速度的是位移-时间图，斜率为加速度、图线与时间轴围成的面积为位移的则是速度-时间图。曲线弯曲方向反映加速度正负；求某点斜率必须画切线而非割线，这是读图题最易失分之处。", "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/竖直抛体、反应时间与刹车距离": "竖直上抛只受重力作用，上升与下降过程对称，最高点速度为零但加速度仍为 g。全程可用 v=u+at 与 s=ut+½at² 处理，取向上为正时 a=−g。刹车总距离由反应时间内匀速行驶的距离加上制动距离构成，故不能忽略反应时间。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/实验报告结构：Title / Aim / Theory-Hypothesis / Apparatus & Diagram / Procedure（被动语态）/ Results / Discussion / Conclusion": "一份合格报告须含标题、目的、理论假设、器材与装置图、方法、结果、讨论与结论八部分。方法是别人复现实验的唯一依据，须用过去时被动语态并写清器材规格与操作量。结论只能回答目的中提出的问题，不要引入新数据。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/变量：自变量/因变量/控制变量；定性（名义、序数）与定量（离散、连续）": "自变量是实验者主动改变的量，因变量是被测量的响应，其余须保持不变的因素即控制变量。定量数据分离散型（可数）与连续型（可测量），定性数据分名义型与序数型。常见错误是把控制变量写成因变量，或没有说明具体如何保持其恒定。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/有效数字规则；加减法按小数位、乘除法按最少有效位；统一 3SF 或 3DP": "有效数字记录测量精度：加减法结果按小数位数最少的一项保留，乘除法按有效位数最少的一项保留。本科目最终答案统一写 3 位有效数字，中间步骤要多留一位以免累积舍入误差。写成科学计数法能避免 0.00 之类的歧义。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/绝对不确定度（±1 最小分度、与均值的最大偏差）与百分比不确定度": "模拟仪器单次读数的绝对不确定度常取最小分度的一半或整格，多次测量则取最大偏差或平均绝对偏差。相对（百分比）不确定度等于绝对不确定度除以测量值再乘 100%。通常先算百分比，因为它才便于互相比较与合成。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/不确定度合成：加减法直接相加、乘除法先转百分比再加；误差棒 error bars": "合成规则取决于运算类型：加减时绝对不确定度直接相加，乘除或乘方时先把各项转为百分比再相加。注意常系数不带不确定度、幂次要先乘以百分比。图上用误差棒表示每个数据点的不确定度范围，画成穿过该点的垂直线段。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/作图规范：轴标签含单位、分度用 2/4/5、占 ¾ 页面、最佳拟合线（不强行过原点）": "作图时横轴放自变量、纵轴放因变量，轴标签须写成「物理量 / 单位」的形式。分度取 2、4、5 的倍数使读数方便，图线应占据约四分之三页面。最佳拟合线要均匀穿过数据点，除非理论要求否则不要强行过原点。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/由最佳拟合线求梯度（画 gradient triangle），结果保留 2SF": "求梯度须在最佳拟合线上取两点作梯度三角形，两点尽量相距远些以减小读数误差，不要直接用原始数据点。梯度结果保留 2 位有效数字，并带单位。若图线是曲线，则应先线性化再求斜率，或改求某点处的切线斜率。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/线性化 linearisation：y = mx + c 映射，梯度/截距与物理量对应": "把非线性关系整理成 y=mx+c 的形式再作图即可得到直线，例如 T² 对 l 作图、1/v 对 1/u 作图。斜率与截距各自对应某个组合物理量，因此必须先做量纲分析确认它们的单位。这是实验题中「由此求某常数」类问题的标准解法。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/误差类型：系统误差（未校准、方法缺陷）vs 随机误差（读数、低电量）": "系统误差来源固定，使全部读数朝同一方向偏移，如仪器未校准、零点不准或方法本身有缺陷，重复测量无法消除，须靠校准或改进方法解决。随机误差来源不可预测，散布在真值两侧，可通过多次测量取平均来减小。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/效度 validity / 信度 reliability / 准确度 accuracy / 精密度 precision 的区分": "效度问「实验是否真的测到了想测的物理量」，信度问「重复测量是否得到一致结果」，准确度指测量值与真值的接近程度，精密度指多次测量彼此之间的接近程度。四者互相独立：可以很精密却很不准确，因为存在系统误差。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/误差削减方法与讨论：对比理论值、% error / % difference、异常值识别": "讨论部分要与理论值或文献值比较，算出百分比误差或百分比差异并分析其来源。异常值只有在有明确原因（如操作失误、仪器不稳）时才能剔除，否则应保留并纳入讨论。单凭偏差大就删数据是典型的错误做法。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/抛体定义与抛物线轨迹；水平与竖直分量相互独立": "抛体运动是只受重力作用的二维运动，轨迹为抛物线。它之所以能分解处理，是因为水平与竖直两个方向互不影响，可以在同一时间轴上分别列式。带电粒子在匀强电场中的偏转与它数学形式相同，称为类平抛运动。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/水平方向：a = 0，ux = vx = 常数，射程 R = ux·T": "水平方向不受力，故加速度为零、水平分速度全程不变，射程等于水平分速度乘以飞行时间 R=uxT。关键是飞行时间 T 完全由竖直方向决定，与水平速度无关，因此不能把它当作已知量直接代入。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/竖直方向：a = −g，最高点时竖直速度 v_y = 0": "竖直方向只受重力，加速度恒为 −g（取向上为正）。到最高点时竖直分速度为零但水平分速度不为零，所以最高点速度并非为零。同一高度处上升与下降的速率相等，这一对称性可用来快速检验结果是否合理。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/速度矢量分解：ux = u cosθ、uy = u sinθ": "把初速度按发射角分解为水平分量 u cosθ 与竖直分量 u sinθ，θ 从水平方向量起。分解是解题的第一步，之后两个方向各自独立运算。常见错误是把角度取成与竖直方向的夹角，或把合速度直接代入竖直方向的运动方程。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/解题步骤：画图→分解→x/y 独立分析→三运动方程→勾股定理求合速度": "标准流程是先画图并标出已知量，再把初速度分解，然后在水平与竖直方向分别套用运动方程，最后用勾股定理合成速度、用 tanθ 求方向角。若要合速度或某点速度，务必给出大小和方向两个要素，只写数值会失分。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/互余角射出同射程（15°/75°）；45° 射程最大": "从同一高度、以同一初速度抛出时，互余的两个发射角（如 15° 与 75°）射程相同，而 45° 时射程最大。这是 sin2θ 在一对互余角上取值相同所致。互余角中较大的那个飞得更高、滞空更久，但水平射程相同。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/空气阻力的影响：减小射程与最大高度、增大下落角度；与截面积和质量有关": "空气阻力使实际射程与最大高度都小于理想抛物线，轨迹变得不对称，下落段更陡，最佳发射角也略小于 45°。影响程度取决于迎风截面积、质量与速度。若题目问真实与理论值的差异，应从能量损耗和阻力方向两处说明。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/抛体运动中的能量守恒；应用题型（投弹、射箭、踢球、投石机）": "忽略空气阻力时抛体机械能守恒，可用 ½mu²=mgh+½mv² 直接由高度求速度，无需经过时间。它在竖直方向满足 v²=u_y²−2gΔh。求落地速度时用能量法往往比先算时间再合成更快，且不易出错。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/匀速圆周运动（水平面）": "「匀速」指速率不变，但速度方向时刻改变，因此物体始终有加速度，是变速运动。周期 T 与频率 f 互为倒数，角速度用 ω=2π/T=2πf 表示。常见错误是认为速度不变故加速度为零、合力为零。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/向心力与向心加速度：F_c = mv²/r = mω²r": "向心加速度指向圆心，大小 a_c=v²/r=ω²r；由牛顿第二定律，产生它的合力即向心力 F_c=mv²/r=mω²r。向心力是效果力而非独立的力，受力图上绝不能单独画出它，这也是本知识点最典型的错误。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/倾斜弯道 banked track 与飞机转弯": "倾斜路面上由支持力的水平分量与重力共同提供向心力，理想（无摩擦）车速满足 tanθ=v²/(rg)，即 v=√(rg tanθ)。飞机转弯时机翼升力的水平分量充当向心力，倾斜机身是为获得足够的水平分力，而不是为了保持升力。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/竖直圆周运动（匀速与非匀速）；摩天轮顶点/底点的视重": "竖直圆周运动中速率通常变化，绳张力与重力沿半径方向的分量共同提供向心力：最低点 T=mv²/r+mg，最高点 T=mv²/r−mg，故最低点张力最大。摩天轮顶点视重 N=mg−mv²/r 小于 mg，底点则大于 mg。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/圆周运动中的能量守恒": "物体沿圆弧轨道升降时重力做功，速率随之改变，须先用能量守恒求出该点速率，再对该点列径向的牛顿第二定律。这两步缺一不可：只列向心力方程会因速度未知而无解。过顶点的临界条件是 N 或 T 恰好为零，此时 v=√(gr)。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/实验：锥形摆测向心力（图像法）": "锥形摆中张力与重力的合力提供向心力，可得 F=mω²r，故以 F 对 ω² 作图应得直线，斜率为 mr、截距为零。改用图像法而非单点计算，是为了平均掉随机误差并检验正比关系是否成立，斜率可反解出质量。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/万有引力定律 F = GmM/r²；力的相互性与矢量性（沿两球心连线）": "任何两质点间都有引力，大小 F=GmM/r²，方向沿两者连线，是一对作用力与反作用力，故对双方的引力大小必然相等。计算时 r 从球心量起，贴地飞行的卫星 r 应取地球半径而不是高度，这是常见的漏加半径错误。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/重力场 g-field 与场线：指向质心、密度表示强度、永不相交": "重力场用场线描述：场线总是从无穷远指向质心（进入天体），线越密处场强越大，且任意两条场线不会相交，否则该点场强方向不唯一。均匀球壳外部的场与质量全部集中于球心的质点等效，这是常见结论题。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/重力场强度 g = F/m = GM/r²（N/kg）；赤道与两极差异、海拔影响": "重力场强度定义为单位质量所受的引力，g=F/m=GM/r²，单位 N/kg 与 m·s⁻² 等价。地表 g 随纬度略有差异：赤道半径大且有自转分力，故 g 最小；海拔升高或深入地下则 g 减小。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/常数：G = 6.67×10⁻¹¹、M_E = 5.97×10²⁴ kg、R_E = 6.37×10⁶ m、地月距离 3.84×10⁸ m": "计算前必须从公式与数据册中取用这些常数：引力常量 G=6.67×10⁻¹¹ N·m²·kg⁻²、地球质量 5.97×10²⁴ kg、地球半径 6.37×10⁶ m、地月平均距离 3.84×10⁸ m。使用 R_E 时要留意数据册给的是 6.37×10⁶ m。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/轨道运动：引力提供向心力；v = √(GM/r)，与卫星质量无关": "圆轨道上引力恰好提供向心力：GmM/r²=mv²/r，解得 v=√(GM/r)，轨道速度只取决于中心天体质量与轨道半径，与卫星自身质量无关。r 必须从地心算起，即地球半径加轨道高度，漏加半径是最常见的失分原因。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/轨道周期与开普勒第三定律 T²/r³ = 4π²/GM": "由引力提供向心力求周期可得开普勒第三定律 T²/r³=4π²/GM，比值只由中心天体质量决定。轨道半径越大，周期越长、速度越小。用它可比较不同天体或不同卫星，例如由月球周期反推地球质量。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/开普勒第一定律（椭圆轨道）与第二定律（面积定律）": "第一定律说行星沿椭圆轨道运行，中心天体位于一个焦点上，故日地距离周期性变化。第二定律说行星与太阳的连线在相等时间内扫过相等面积，等价于近日点速率最大、远日点最小，本质是角动量守恒。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/地球同步卫星（T = 24 h）；通信与电视广播应用": "周期必须等于地球自转周期，由 T²=4π²r³/GM 可算出轨道半径约 4.2×10⁷ m、即赤道上方约 3.6×10⁷ m。它必须固定在赤道正上方，否则会相对地面漂移，因此无法覆盖极地地区。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/质心 barycentre（地月系统，力矩法）；LEO/MEO/GEO 与极轨/太阳同步轨道": "双星系统的质心满足 m₁r₁=m₂r₂，地月质心位于地表之下约 1700 km 处，两者实际都绕该点转动。轨道按高度分为低轨 LEO、中轨 MEO 与地球同步轨道 GEO；极轨卫星能覆盖全球并可用于遥感与气象观测。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/力矩 τ = rF sinθ（单位 N·m）；力臂、支点、力的作用线": "力矩 τ=rF sinθ 衡量力使物体绕轴转动的效果，单位 N·m 是导出单位，不要写成 J。θ 是力与力臂（转轴到力的作用线的垂直距离）之间的夹角。力的作用线穿过转轴时力臂为零，该力不产生力矩。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/符号约定：逆时针为正、顺时针为负": "列转动平衡方程前须先规定转动的正方向，通常取逆时针为正、顺时针为负，并在全题中保持一致。解出的力矩为负只表示转动方向与约定相反，不代表力矩大小是负值。中途改变符号约定是常见的失分点。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/非垂直力的分解；净力矩": "力与杆不垂直时可用两种等效做法：把力分解为沿杆与垂直杆的分量，只有垂直分量产生力矩；或直接找该力的力臂再乘整个力。两种方法结果必然相同，可互为验算。净力矩是所有力矩的代数和，其为零是转动平衡的条件。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/平衡条件：ΣF = 0（平动平衡）+ Στ = 0（转动平衡）": "刚体平衡必须同时满足两个条件：合外力为零保证不平动，合外力矩为零保证不转动，二者缺一不可。转轴可以任选，选得巧可使未知力的力臂为零从而简化方程。只列一个方程通常解不出两个未知量。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/经典题型：跷跷板、梯子靠墙、跳水板、木板与绳索、悬臂梁": "这类题统一套路是画受力图、选一个未知力较多的点作转轴、列 Στ=0，再按需补充 ΣF=0。梯子靠墙题中要额外注意墙侧只有法向力而地面既有法向力又有摩擦；跷跷板题常需补充质心位置。重力要作用在重心上。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/撑杆与拉索 struts and ties": "撑杆（strut）受压、拉索（tie）受拉，判断方法是隔离该构件并看两端的受力是互相推还是互相拉。分析桁架类结构时逐个结点列 ΣF=0 即可定出各杆内力，若算出负值说明实际受力方向与假设相反。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 力矩与平衡/静平衡与质心；稳定性 stability": "物体不倾倒的条件是重力作用线落在支撑面之内，此时才有可用的恢复力矩。支撑面越宽、质心越低，稳定性越好。处理组合物体求质心时要按质量加权，不能简单取几何中点，空心部分应作为负质量处理。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电荷与电场；电场线（+向外/−向内、密度=强度、不可交叉）": "电荷周围存在电场，电场线从正电荷指向负电荷（或指向无穷远），线的疏密表示场强大小，任意两条电场线不能相交。电场线是描述工具而非真实存在的线，且它永远与等势面垂直。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/库仑定律 F = kq₁q₂/r²；k = 9.00×10⁹ N·m²/C²、ε₀ = 8.85×10⁻¹²": "两个点电荷间的作用力 F=kq₁q₂/r²，其中 k=1/(4πε₀)=9.00×10⁹ N·m²·C⁻²。代入时电荷量要带正负号以判断是吸引还是排斥，作用力方向沿两者连线。库仑力与万有引力形式相同，都是平方反比定律。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/三电荷以上：叠加原理（矢量和）": "多个电荷对某点电荷的作用力等于各对力单独的矢量和，须先分别算出大小与方向，再按分量合成，不能把大小直接相加减。两个等量同种电荷连线中点处合场强为零，而等量异种电荷中点处场强最大，是常考的对称情形。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电场强度 E = F/q = kQ/r²（N/C 或 V/m）；试探电荷 test charge": "电场强度是单位正电荷所受的电场力，E=F/q=kQ/r²，方向与正电荷受力方向相同，单位 N/C 与 V/m 等价。E 是场的属性，与是否放入试探电荷无关；试探电荷必须足够小以免扰动原场。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电场中的功与能：W = Eqd = qΔV；W = ΔE_k": "电场力做功 W=qEd=qΔV，只由起点与终点的电势差决定而与路径无关，因此静电力是保守力。结合动能定理 W=ΔE_k 可由加速电压直接求粒子速率，例如 v=√(2qV/m)，无需考虑场在中间的分布。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电势差 ΔV 与重力势能的类比": "电势差是单位电荷在两点的电势能之差，ΔV=ΔE_p/q=W/q，单位伏特，可类比重力场中的高度差。正电荷顺电场线方向运动时电势降低、电势能减小；负电荷情形恰好相反，这是最常见的判断错误。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/平行板间匀强电场 E = V/d": "平行板之间电场近似匀强，大小 E=V/d，方向由正极板指向负极板。注意 d 是板间距而非板长，V 是两板间的电压。带电粒子在板间运动时常需同时考虑竖直方向的电场力与水平方向的匀速运动。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/带电粒子在电场中的偏转（类平抛运动）": "粒子沿垂直电场方向进入平行板后做类平抛运动：沿板方向匀速，垂直板方向受恒力 a=qE/m=qV/(md) 而匀加速。偏移量 y=½at²、其中 t=L/v，离板速率用勾股定理合成，这与抛体运动完全同构。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 静电力与电场/电子伏特 1 eV = 1.60×10⁻¹⁹ J": "电子伏特是能量单位而非电压单位，等于一个电子通过 1 V 电势差所获得的能量，1 eV=1.60×10⁻¹⁹ J。它在原子与核物理中很方便，例如氢原子电离能 13.6 eV 即 2.18×10⁻¹⁸ J，换算时不要漏乘电荷量。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/磁通密度 B（特斯拉 T）与磁场线图": "描述磁场强弱的物理量记作 B，单位为特斯拉 T，也常被直接称为磁场强度。磁场线在磁体外部由 N 极指向 S 极、内部由 S 指向 N，处处闭合且不相交，线越密处 B 越大。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/长直导线磁场 B = μ₀I/2πr；右手螺旋定则；螺线管与电磁铁": "长直载流导线周围的磁场是同心圆，大小 B=μ₀I/2πr，与电流成正比、与距离成反比，其中 μ₀=4π×10⁻⁷ N·A⁻²。方向用右手螺旋定则判定：拇指指向电流，四指弯曲方向即磁场方向。螺线管内部磁场近似匀强。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/载流导体受力（电动机效应）：F = BIl sinθ": "磁场对载流导线的作用力 F=BIl sinθ，其中 θ 是电流方向与磁场方向的夹角，当导线平行于磁场时受力为零（常见错误是漏掉 sinθ）。方向用左手定则判断，这也是电动机把电能转为机械能的微观机制。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/左手定则 Fleming's Left Hand Rule（力/磁场/电流方向）": "左手定则用于判断磁场对电流的作用力：食指指磁场方向、中指指电流方向、拇指即受力方向，三指互相垂直。注意中指所指是正电荷的流动方向（即常规电流），对电子等负电荷必须反向后再判断。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/载流线圈力矩 τ = nBIA；力矩最大的位置": "处在磁场中的载流线圈受到的合力为零但合力矩不为零，τ=nBIA，其中 n 为匝数、A 为线圈面积。当线圈面平行于磁场时力臂最大、力矩最大，线圈面垂直于磁场时力矩为零，这正是换向器需要换向的位置。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/直流电动机结构与原理：电枢线圈、换向器、碳刷、磁场线圈；每 180° 反向电流": "直流电动机靠磁场对载流线圈的力矩持续转动，换向器在每转过 180° 时把线圈中的电流反向，从而保持转矩方向不变。碳刷负责把外部电流引入旋转的换向器。若没有换向器，线圈转到平衡位置后会因惯性来回摆动而不能持续旋转。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/反电动势 back emf 与楞次定律导致恒定转速": "电动机线圈转动时自身切割磁感线，会产生与电源电压方向相反的感应电动势（反电动势），使净电流与转矩自动减小。负载增加时转速下降、反电动势减小、电流增大，于是输出转矩增大，这是电动机能自我调节的原因。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/运动电荷受力 F = qvB sinθ；圆周运动半径 r = mv/qB": "运动电荷在磁场中受力 F=qvB sinθ，力的方向同时垂直于速度与磁场，故不做功、只改变方向。当 v 与 B 垂直时粒子做匀速圆周运动，半径由 qvB=mv²/r 得 r=mv/qB，周期与速率无关，这是回旋加速器的基础。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 磁学 Magnetism/应用：粒子加速器（直线/回旋/同步加速器）、质谱仪、速度选择器、磁悬浮、MRI": "磁场不能改变粒子速率、只能改变方向，因此加速必须靠电场，磁场只负责约束轨道。回旋加速器利用周期与速率无关的特点反复加速，但受相对论效应限制；速度选择器用 E 与 B 平衡筛选特定速度的粒子。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/速度选择器 velocity selector（电场力与磁场力平衡）": "速度选择器让带电粒子同时受到反向的电场力与磁场力，二者平衡时 qE=qvB，于是只有速度 v=E/B 的粒子能直线通过，与电荷量和质量都无关。速度偏大者被磁场力压弯、偏小者被电场力推偏，这是它筛选速度的原理。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/霍尔效应 Hall Effect：霍尔电压 V_H、漂移速度 drift velocity、F_B = F_E 平衡": "电流通过处在磁场中的导体薄片时，载流子被磁场偏转并在两侧积累，形成横向电压即霍尔电压。平衡时 qv_D B=qV_H/w，可得 V_H=BI/(nte)，其中 n 为载流子浓度、t 为薄片厚度。它常用来测磁场或反推载流子浓度。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/质谱仪 mass spectrometer 的分离原理": "样品先被电离并经电场加速获得动能 qV=½mv²，再垂直进入磁场做圆周运动，由 r=mv/qB 得 r=√(2mV/qB²)，即半径随质量增大而增大。不同质量的离子因此落在不同位置而被分离，可用于测定同位素丰度与未知元素。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电场与磁场的应用/粒子加速器如何控制带电粒子的运动": "加速靠电场做功提高动能，约束靠正交磁场提供向心力，二者是加速器的两条基本手段。回旋加速器中交变电压的周期须与粒子回旋周期同步；直线加速器则用一串交变电场逐段加速，同步加速器还须同步增强磁场以维持轨道半径。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/磁通量 Φ = BA cosθ（韦伯 Wb）；θ 为 B 与面积法线的夹角": "磁通量 Φ=BA cosθ 表示穿过某个面的磁场线的总量，单位韦伯 Wb。θ 是磁场与面积法线的夹角，因此线圈面平行于磁场时 Φ=0、垂直于磁场时 Φ=BA 最大。把 θ 当成与线圈面的夹角是最常见的错误。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/产生电磁感应的条件：相对运动、B 大小变化、线圈面积变化、B 方向变化": "产生感应电动势的充要条件是穿过回路的磁通量发生变化，具体可来自磁场强弱变化、线圈相对磁场运动、回路面积变化或磁场方向变化。只要 Φ 恒定，即使值很大也不会有感应电流，这一点常被误解为「有磁场就有感应」。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/法拉第定律 ε = −N ΔΦ/Δt（感应电动势）": "感应电动势与磁通变化率成正比：ε=−NΔΦ/Δt，其中 N 为匝数，负号体现楞次定律所定的方向。必须用 ΔΦ/Δt 而不是 Φ 本身，且计算平均电动势时要用整个时间间隔内的磁通改变量，漏掉 N 是高频扣分点。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/楞次定律：感应电流的方向总是阻碍磁通量的变化（能量守恒的体现）": "楞次定律指出感应电流的效果总是反抗引起它的磁通变化：磁通增加时感应电流的磁场与原磁场反向，减少时同向。它本质上是能量守恒的体现——若感应电流帮助变化，就会凭空产生能量，因此必须反抗。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/右手定则判断感应电流方向；涡电流 eddy current": "导线在磁场中运动时用右手定则判断感应电流方向：拇指指运动方向、食指指磁场、中指即电流方向。大块金属处在变化磁场中会在内部形成环状涡电流，它既造成变压器的能量损耗（可用叠片铁芯减小），也用于感应加热与电磁炉。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/磁铁进出线圈时的受力与做功分析": "磁铁插入线圈时穿过线圈的磁通增加，由楞次定律线圈靠近磁铁的一侧会形成同名磁极从而排斥磁铁；拔出时则吸引，因此无论进出都阻碍相对运动。外力必须克服这个阻力做功，所做的功转化为电能，这正是发电机与再生制动的能量来源。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 电磁感应/应用：直流/交流发电机、变压器、再生制动、电磁炉、电动车、磁悬浮": "电磁感应的应用可归为两类：靠磁场与导体的相对运动发电（发电机、再生制动），或靠交变磁场在导体中激起涡流（电磁炉、感应充电）。变压器利用互感转移能量，但它只能对交流电工作，因为直流电产生的磁通不变化。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/发电机：机械能→电能（电动机的逆过程）；能量来源（水力、煤炭、核、风、地热）": "发电机把机械能转化为电能，是电动机的逆过程。各种发电方式只是驱动涡轮的能源不同：水力、风能、地热直接提供机械能，煤炭与核能则先产生蒸汽再推动涡轮。无论来源如何，中间环节都是转动线圈切割磁感线。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/滑环 slip rings 输出交流 vs 换向器输出直流": "滑环始终与线圈的同一端相连，线圈每转半圈电流方向反转一次，输出交变电流；换向器则每半圈把与外电路的接点互换，使输出电流方向始终不变，得到脉动直流。判断装置类型只看用滑环还是换向器即可。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/部件与功能：外磁铁、电枢线圈、滑环/换向器、碳刷": "发电机的四大部件各有分工：外磁铁（或电磁铁）提供磁场，电枢线圈被机械能带动旋转，滑环或换向器负责与外电路保持滑动接触并决定输出交流还是直流，碳刷则把电流引出。回答「某部件的作用」时要指明它解决的是磁场、转动还是接出电流的问题。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/线圈旋转各角度（0°/90°/180°/270°/360°）的磁通与电动势变化": "线圈面垂直于磁场时磁通最大而电动势为零（该时刻磁通变化率为零）；转过 90° 到线圈面平行于磁场时磁通为零而电动势达到峰值。所以磁通与电动势始终相差四分之一周期，凡是磁通取极值处电动势必为零，反之亦然。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/关系式：Φ = NBA cos ωt；emf = NBAω sin ωt；ε_max = NBAω = 2πfNBA": "线圈匀速转动时磁通按 Φ=NBA cos ωt 变化，由法拉第定律求导得 emf=NBAω sin ωt，峰值 ε_max=NBAω=2πfNBA。注意峰值随转速与磁场线性增大；若题给 rms 值，须乘 √2 才能代回峰值公式。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/平均电动势 ε_avg = 4BANf；用右手定则与楞次定律判断正负端": "一个完整周期内正弦电动势的平均值为零，所以「平均电动势」通常指四分之一周期或半周期内的平均值，此时可用 ε_avg=4BANf。判断输出正负端时，先由楞次定律定出感应磁场方向，再用安培定则推电流方向，电流流出的那端即正极。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/变压器：两线圈 + 叠片硅钢芯；互感 mutual induction": "变压器由绕在同一铁芯上的原、副两个线圈构成，靠互感工作：原线圈中变化的电流在铁芯中产生变化的磁通，从而在副线圈中感应出电动势。叠片硅钢芯既增强磁通耦合又减小涡流损耗。它无法对恒定直流工作。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/匝数比 Vs/Vp = Ns/Np；升压与降压；理想变压器功率守恒": "对理想变压器，电压比等于匝数比 Vs/Vp=Ns/Np，而功率守恒 VpIp=VsIs，故电流比与匝数比成反比。Ns>Np 为升压变压器，Ns<Np 为降压变压器。常见错误是认为升压也提高了功率，那会违反能量守恒。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/电力输送：为何要升压、为何铁芯要叠片": "输电线上损耗的功率为 P_loss=I²R，在输送功率不变的前提下升压可成比例减小电流，从而大幅降低损耗，这就是远距离输电要先升压、入户前再降压的原因。铁芯用叠片是为了切断涡电流回路，减小涡流造成的发热损耗。", "AUSMAT May 2026 学习资料/PHY 物理/U3 · 交流发电机与变压器/欧姆定律 V = IR；电阻串并联（实验）": "电压、电流与电阻的关系式为 V=IR，但它只适用于欧姆器件（R 恒定）。串联时总电阻等于各电阻之和且电流处处相同，并联时总电阻的倒数等于各倒数之和且电压处处相同。实验须注意电流表串联、电压表并联。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/参考系与惯性参考系（恒定速度）": "参考系是观察者据以描述运动的坐标框架，惯性参考系指牛顿定律在其中成立的参考系，即静止或做匀速直线运动的参考系。凡是有加速度的参考系都是非惯性系，需要引入惯性力才能套用牛顿定律。狭义相对论只讨论惯性系之间的关系。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/光速不变 c = 3.00×10⁸ m/s；爱因斯坦两条基本假设": "狭义相对论建立在两条假设上：物理定律在所有惯性系中形式相同（相对性原理），以及真空光速 c=3.00×10⁸ m·s⁻¹ 对一切惯性系中的观察者都相同。第二条假设与经典速度叠加直接冲突，由此推出时间膨胀与长度收缩。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/同时性的相对性（火车思想实验）": "两个事件是否同时发生取决于所选参考系：在一列运动的火车上，车厢中央的光源同时照到两端，但地面观察者会看到光先到达后端。因此不存在绝对的「现在」，同时性只有相对于某个参考系才有意义。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/时间膨胀 t = t₀/√(1−v²/c²)；固有时间 t₀ 与洛伦兹因子 γ；双生子佯谬": "运动的时钟走得慢：t=γt₀，其中 t₀ 是在与事件相对静止的参考系中测得的固有时间，γ=1/√(1−v²/c²) 恒大于等于 1。要判断哪个是 t₀，只需问「谁与这两个事件同处一地」。双生子佯谬中旅行者折返时改变了惯性系，故两人的经历并不对称。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/长度收缩 L = L₀√(1−v²/c²)；固有长度；梯子-车库佯谬": "沿运动方向测得的长度会缩短：L=L₀/γ，其中 L₀ 是与物体相对静止时测得的固有长度。收缩只发生在运动方向上，垂直方向不变。梯子-车库佯谬的解答关键在于两端是否同时进入在两种参考系中判断不同，即同时性的相对性。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/相对论速度叠加 u = (u′ + v)/(1 + u′v/c²)": "相对论速度叠加式为 u=(u′+v)/(1+u′v/c²)，分母中的修正项在低速时可忽略而还原为经典公式。它的重要意义在于：只要 u′ 与 v 都不超过 c，合成速度也永远不会超过 c，这正是光速不变假设的必然结果。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/相对论动量 p = mv/√(1−v²/c²)（高速下增大，阻止达到光速）": "相对论动量写作 p=γmv，随速度趋近光速而急剧增大，因此要让它继续加速所需的力也急剧增大，这就是有静止质量的粒子无法达到光速的原因。计算时若 v 远小于 c，γ 近似为 1，可直接用 p=mv 检验结果是否合理。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/质能等价 E = mc²；静止质量能量": "质量本身就是能量的一种形式，换算系数为光速的平方 E=mc²，因此即使静止的物体也蕴含 E_rest=mc² 的能量。核反应中极小的质量亏损会释放巨大能量 ΔE=Δmc²，这是太阳与核电站的能量来源，计算时不要漏掉 c²。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/总能量与能量-动量关系 E² = p²c² + m²c⁴；光子 E = pc": "相对论总能量满足 E²=p²c²+m²c⁴，其中动能是总能量减去静止能量 E_k=(γ−1)mc²。对静止质量为零的光子，m=0 故 E=pc，于是动量 p=E/c=h/λ，这正是光子虽有动量却没有静止质量的原因。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 狭义相对论/实验证据：Rossi–Hall 实验（μ 子）、μ 子寿命与长度收缩、GPS 修正、粒子加速器": "μ 子本应在到达地面前就衰变，但 Rossi–Hall 实验在高空与海平面都探测到大量 μ 子，说明其寿命因高速运动而被拉长（或大气厚度在其参考系中被缩短）。此外 GPS 卫星必须做相对论修正、粒子加速器中粒子的能量与动量符合相对论公式，都是有力证据。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/牛顿的引力观 vs 爱因斯坦：引力不是力，而是时空弯曲的效应": "牛顿把引力看作物体间瞬时传递的力，作用在平直的绝对时空背景上；爱因斯坦则认为引力根本不是力，而是质量-能量使时空弯曲的表现，物体只是在弯曲时空中沿最自然的路径运动。前者在强场与高速情形下失效。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/时空弯曲（质量-能量弯曲时空；时空 = x, y, z + t）": "广义相对论把三维空间与一维时间统一为四维时空，质量与能量会使其弯曲，曲率由爱因斯坦场方程与能量动量张量相联系。这种弯曲的表现就是我们所称的引力。注意弯曲的是时空本身，而不是物体在既有空间中受到拉扯。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/测地线 geodesics 与自由落体；失重": "测地线是弯曲时空中两点间的最短（或最长）路径，即四维意义上的「直线」。自由落体物体正是在沿测地线运动，因此它其实不受任何力，这就是失重的本质：航天员与飞船沿同一条测地线下落，彼此之间没有相对加速度。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/光沿时空测地线传播；引力透镜 gravitational lensing": "光子虽无静止质量，但会沿时空测地线传播，经过大质量天体附近时路径发生弯曲。其观测表现是背景星系的位置偏移、被拉成弧形或在同一方向出现多个像，这种效应称为引力透镜，1919 年的日食观测首次证实了光线偏折。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/引力时间膨胀（引力势越低，时间越慢）": "引力势越低（即离大质量天体越近）处，时间流逝越慢。因此地面上的钟比高山上的钟走得慢，同一座楼里楼层不同也会有时间差，这也是 GPS 卫星必须做引力修正的原因。它与狭义相对论的时间膨胀方向恰好相反。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/应用：GPS 需同时考虑狭义与广义相对论（每天约 10 km 位置误差）": "GPS 卫星钟因高速运动（狭义相对论）每天变慢约 7 μs，又因处于较弱的引力场（广义相对论）每天变快约 45 μs，净效应是每天快约 38 μs。若不做这项修正，定位每天将累积约 10 km 的误差，这个例子是两种效应综合的经典考题。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/黑洞：极端曲率、事件视界 event horizon、奇点、吸积盘": "黑洞是时空曲率极端到连光都无法逃逸的天体，其边界称为事件视界，视界内的逃逸速度超过光速。视界内部据经典理论存在密度无限大的奇点。被吸引的物质在视界外高速旋转摩擦发光，形成吸积盘，这常是天文观测中它的可见标志。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 广义相对论/证据：飞机上的原子钟、GPS、引力波、引力透镜": "支持广义相对论的证据主要有四类：飞机搭载原子钟的环球飞行实验证实了运动与引力对时间的影响，GPS 的日常修正证明了引力时间膨胀确实存在，引力透镜证实了光线被弯曲，2015 年 LIGO 首次直接探测到引力波则证实了时空弯曲可以像波一样传播。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波 = 振荡的电场与磁场；麦克斯韦方程组；加速电荷产生电磁波": "电磁波是相互垂直、同相振荡的电场与磁场在空间中的传播。麦克斯韦方程组统一了电与磁并预言其存在，而赫兹的实验予以证实。产生电磁波的必要条件是电荷做加速运动（振荡），匀速运动的电荷不辐射，这是天线的工作原理。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波谱：无线电→微波→红外→可见光→紫外→X 射线→γ 射线": "按频率由低到高（波长由长到短）排列为无线电波、微波、红外线、可见光、紫外线、X 射线、γ 射线。可见光只占极窄的一段。所有电磁波在真空中都以 c 传播，因此频率与波长成反比，相邻波段之间有重叠而无明确分界。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/电磁波性质：横波、E ⊥ B 且同相、c = 3.0×10⁸ m/s、无需介质": "电磁波是横波，E 与 B 互相垂直且同时达到最大值，传播方向由 E×B 决定。它不需要介质，可在真空中以 c=3.00×10⁸ m·s⁻¹ 传播。偏振现象正是电磁波为横波的直接证据；纵波（如声波）不能偏振。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/波方程 c = fλ；周期；频率与波长成反比": "波速等于频率与波长的乘积：c=fλ，周期与频率互为倒数 T=1/f。光进入另一种介质时频率不变而波长改变，因此速度随之改变，这是折射的原因。解答这类题务必先确认哪一个量在跨介质时保持不变。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/反射、折射（斯涅尔定律）、衍射、干涉、偏振": "光在界面处发生反射（入射角等于反射角）与折射（斯涅尔定律 n₁sinθ₁=n₂sinθ₂），遇到障碍物或狭缝会衍射，两束光相遇会干涉，通过偏振片则显示偏振。这五种现象都属于波动行为，其中折射率 n=c/v 恒大于 1。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/衍射：波长 ≥ 孔径时显著；波长不变": "衍射是波绕过障碍物或在狭缝后扩展的现象，只有当孔径与波长相当或更小时才显著，因此声波易衍射而光波不明显。关键点是衍射不改变波长与频率，只改变传播方向与强度分布，所以衍射后光的颜色不变。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/干涉：相长与相消、光程差 path difference、相位": "两束相干光相遇时按光程差叠加：光程差为波长整数倍时相长干涉（亮），为半波长奇数倍时相消干涉（暗）。干涉是波动性的最强证据。要观察到稳定图样，两光源必须相干（频率相同、相位差恒定），普通灯泡做不到这一点。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/杨氏双缝实验：明暗条纹；粒子说预言与实际不符，成为光的波动性的证据": "让光穿过两条很窄很近的缝，屏上会出现等间距的明暗条纹，条纹间距满足 Δy=λL/d。若光只是粒子，两条缝应只给出两个亮斑，因此这一结果成为波动性的决定性证据。间距与波长、屏距成正比，与缝距成反比。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的波动性/应用：光的折射性质实验、用衍射理论测激光波长": "利用衍射光栅公式 nλ=d sinθ，测出各级亮纹的角度与光栅常数即可算出激光波长，这是实验室里测波长的标准方法；同理可用折射实验测定介质的折射率。这类实验要求测多级条纹并取平均，以减小角度读数的随机误差。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/牛顿微粒说 vs 惠更斯波动说的历史争论": "牛顿主张光是微粒流，能自然解释直线传播与反射；惠更斯主张光是波，能解释衍射与干涉。争论持续百余年，直到杨氏双缝与泊松亮斑支持波动说。最终光电效应表明两者都不完整，光具有波粒二象性，这场争论才获得统一解释。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光电效应实验装置（阴极/阳极、石英窗、光电子、电流计、真空管）": "装置是抽成真空的玻璃管，内有阴极与阳极，光经石英窗（能透过紫外光）照到阴极上打出光电子，它们被阳极收集形成光电流，由电流计读出。真空是为了避免光电子与空气分子碰撞而损失能量；加反向电压则可测出遏止电压。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/波动模型的三大预言与实际结果的矛盾：亮度↑只增电子数不增能量、存在截止频率、发射是瞬时的": "按经典波动理论，光强越大光电子动能应越大、任何频率只要照射够久都应能打出电子、弱光下应有一段延迟。实验却显示：增大光强只增加光电子数目而动能不变、低于截止频率无论多强都不发射、发射几乎瞬时完成。这三点直接否定了纯波动模型。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光子：E = hf = hc/λ；h = 6.63×10⁻³⁴ Js；一个光子对应一个电子、完全吸收": "光由一份份能量为 E=hf=hc/λ 的光子组成，普朗克常量 h=6.63×10⁻³⁴ J·s。光电效应近似是一对一过程：一个光子被一个电子完全吸收，因此光强决定光子数（即光电子数），而单个光子的能量只由频率决定，与光强无关。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/逸出功 W = hf₀ 与截止频率；不同金属的逸出功数值": "逸出功 φ 是把电子从金属表面移出所需的最小能量，对应截止频率 f₀=φ/h；低于它时无论光多强都不产生光电效应。不同金属的逸出功不同，铯等碱金属较小故对可见光敏感，铂等较大则需紫外光，这是选材类题目的依据。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/光电方程 KE_max = hf − W；遏止电压 stopping potential": "能量守恒在光电效应中的表达是 KE_max=hf−φ：光子能量一部分用于挣脱金属束缚，余下部分成为光电子最大初动能。使光电流恰好为零的反向电压称遏止电压，满足 eV_s=KE_max，故 V_s 对 f 作图可得 h/e 与 φ/e。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 光的粒子性/波粒二象性 wave–particle duality": "光在传播过程中表现出波动性（干涉、衍射、偏振），在与物质相互作用时表现出粒子性（光电效应、康普顿散射），二者不能同时在同一实验中显现。德布罗意进一步指出电子等实物粒子也有波动性，因此波粒二象性是所有微观客体的共同属性。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/黑体辐射：光谱形状及其随温度的依赖；经典波动模型无法解释": "黑体是能完全吸收并重新辐射所有入射电磁波的理想物体，其辐射谱只由温度决定：温度升高时总辐射强度增大，且峰值波长按维恩位移定律向短波方向移动。经典波动理论预言短波处强度趋于无穷（紫外灾难），与实际曲线不符，这一矛盾促使普朗克提出能量量子化。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/德布罗意物质波 λ = h/p = h/mv": "德布罗意假设实物粒子也对应一个物质波，波长 λ=h/p=h/mv，动量越大波长越短。它最初只是理论猜想，后被电子衍射实验证实。计算宏观物体时波长极小（约 10⁻³⁴ m 量级）而完全不可观测，这就是日常生活中看不到物质波的原因。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/宏观物体/人/电子三案例对比：宏观波长过小不可观测，电子可检测": "用 λ=h/mv 比较可见：一个人（约 70 kg、1 m·s⁻¹）的波长约 10⁻³⁵ m，远小于原子核尺度；而电子在 10⁶ m·s⁻¹ 下波长约 10⁻⁹ m，与原子间距相当，故能在晶体上产生可观测的衍射。判据就是波长与障碍物尺寸的数量级比较。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/戴维孙-革末实验：电子衍射证实物质波": "戴维孙与革末把低能电子束射向镍晶体，测得散射强度随角度的分布出现极大值，其规律与 X 射线衍射完全一致，由此算出电子的波长与 λ=h/p 相符。这是物质波假设的第一个直接实验证据，也说明电子能像波一样被晶体光栅衍射。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/双缝实验重做：电子逐个通过也会累积出干涉图样": "把双缝实验用于电子时，即使一次只发射一个电子，屏上最初只出现零散亮点，长时间累积后仍浮现出干涉条纹。这说明单个电子也以波的形式同时通过两条缝并与自身干涉，而每个电子的落点又是随机的——概率由波的强度决定。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/应用：电子显微镜（TEM/SEM/STEM，分辨率约 10⁻¹⁰ m）、中子衍射、X 射线衍射": "因电子波长可远短于可见光，电子显微镜用电子束成像，分辨率可达原子尺度（约 10⁻¹⁰ m），TEM 看透射内部结构、SEM 看表面形貌。类似地，中子衍射适合定位氢原子与磁结构，X 射线衍射则用于测定晶体结构。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/四类光谱：线状发射光谱、带状光谱、连续光谱、吸收光谱": "连续谱由炽热固体或液体发出，包含所有波长；线状发射谱由低压激发态气体发出，只有若干条明线；吸收谱是连续光穿过冷气体后出现的暗线；带状光谱则由分子产生。线状谱与吸收谱的谱线位置一一对应，这是识别元素的关键。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 黑体辐射与光谱/光谱分析：元素的特征谱线": "每一种元素都有唯一的特征谱线组合，就像指纹一样可用于识别。将未知样品的光谱与标准谱对照即可确定其成分，这条原理既用于实验室的元素分析，也用于通过吸收谱推断遥远恒星的组成，且不要求样品与仪器接触。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/玻尔假设：电子只能在特定轨道上具有固定能量；基态与激发态": "玻尔假设电子只能处于若干分立的允许轨道上，能量是量子化的，因此不会因绕核运动而连续辐射能量；处于最低能级即基态，吸收能量后跃迁到较高能级即激发态。这一假设突破了经典电磁学「加速电荷必辐射」的结论。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/氢原子能级图（−13.60、−3.40、−1.51、−0.85、−0.54 eV，电离为 0.00）": "氢原子能级为 −13.60、−3.40、−1.51、−0.85、−0.54 eV……能级越高越密集，取零点为电子完全脱离原子。能级为负表示电子被束缚，绝对值就是把它移到无穷远所需的能量。画跃迁箭头时要注意向上为吸收、向下为发射。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/跃迁规则：吸收或释放的能量必须恰好等于两能级之差": "电子只能在能级间跃迁，且吸收或释放的能量必须恰好等于两能级之差 ΔE=E₂−E₁，因此只有能量匹配的光子才能被吸收。这就是吸收谱为分立暗线的原因：光子能量对不上就无法被吸收，也就不会在谱上留下痕迹。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/激发态寿命约 10⁻⁸ s；退激可一步或多步，每次跃迁释放一个光子": "激发态寿命极短，约 10⁻⁸ s 后电子便自发退回低能级。退激可以一步回到基态而放出高能光子，也可以经若干中间能级分几步完成，每步只发射一个特定能量的光子，因此同一种元素能产生多条谱线，且存在几种可能的跃迁路径。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/电离 Ionisation：电离能；超过阈值的多余能量成为电子的动能": "电离是把电子从所在能级完全移出原子、使其成为自由电子，所需的最小能量即电离能（基态氢为 13.6 eV）。若提供的能量超过电离能，多余部分全部转化为自由电子的动能，且此时吸收谱会由分立谱线变为连续谱。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/用 ΔE = hf = hc/λ 解释发射光谱与吸收光谱": "把光子能量与能级差联系起来：ΔE=hf=hc/λ。吸收时电子跃升并夺取能量恰好匹配的光子，形成暗线；发射时电子下落并放出相应波长的光子，形成明线。因此同一元素的发射线与吸收线位置完全重合，只是明暗互补。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/氢光谱系列：Lyman（紫外）、Balmer（可见光）、Paschen（红外）": "氢原子的谱线按跃迁的末态能级分成几个系列：Lyman 系落到 n=1，位于紫外区；Balmer 系落到 n=2，主要在可见光区；Paschen 系落到 n=3，位于红外区。判断某条谱线属于哪个系列，只需看它终止于哪个能级。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/能级计算 E = −13.6 Z²/n²": "类氢离子的能级为 E=−13.6 Z²/n²（eV），与核电荷数的平方成正比、与主量子数的平方成反比，负号表示电子被束缚。求跃迁光子波长时先算出两能级差，再用 λ=hc/ΔE。Z 只适用于单电子离子，多电子原子不能直接套用。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 玻尔原子模型/应用：荧光与磷光、X 射线产生、激光、光伏电池、LED、荧光标记": "这些应用都建立在能级跃迁上：荧光与磷光的区别在于退激余辉的长短，激光靠受激辐射产生相干单色光，X 射线由高速电子撞击金属靶或内层电子跃迁产生，LED 与光伏电池则分别实现电光与光电转换。解释时要点明涉及哪两个能级。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/天文距离单位：AU（1.50×10¹¹ m）、光年、秒差距 parsec（3.1×10¹⁶ m）、Mpc": "天文距离用专门单位表示：1 AU 是地日平均距离 1.50×10¹¹ m，1 光年是光在真空中一年走过的距离约 9.46×10¹² km，1 秒差距约 3.26 光年、即 3.09×10¹⁶ m。星系际距离常用 Mpc，换算关系须从数据册中查取。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/稳恒态理论 Steady State（各向同性 + 均匀 + 静态）及其被否定": "稳恒态理论认为宇宙虽然膨胀但在大尺度上始终各向同性、均匀且状态不随时间变化，靠物质不断创生来维持密度不变，因此没有开端。它与大爆炸理论的关键区别就在「宇宙是否有起点」，后被宇宙微波背景辐射的发现所否定。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/多普勒效应；红移与蓝移（波长变长/变短）": "多普勒效应指波源与观察者之间有相对运动时，观察到的频率会发生变化。光源远离时波长变长称为红移，靠近时波长变短称为蓝移。注意「红」与「蓝」只是指波长变长或变短，并不限于可见光波段，任何电磁波都适用。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/红移参数 z = (λ_观测 − λ_静止)/λ_静止 ≈ v/c": "红移参数定义为 z=(λ_观测−λ_静止)/λ_静止，在 z 远小于 1 时可用 z≈v/c 求退行速度。这里 λ_静止 是实验室中测得的同一谱线波长，靠比对特征谱线才能确定。z 为负值表示蓝移，说明该天体在靠近我们。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/哈勃定律 v = H₀d；H₀ = 70.0 km·s⁻¹·Mpc⁻¹；图像斜率即哈勃常数": "哈勃定律指出星系的退行速度与距离成正比：v=H₀d，H₀≈70.0 km·s⁻¹·Mpc⁻¹。以 d 为横轴、v 为纵轴作图，斜率就是哈勃常数，单位须换算为 s⁻¹。注意 d 必须用 Mpc 与 H₀ 的单位配套，直接代入米制会差若干数量级。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/距离测量：亮度与光度；造父变星 Cepheid 作为标准烛光": "由观测到的亮度 b 与已知的光度 L 可反推距离：b=L/(4πd²)。造父变星的脉动周期与其光度存在确定关系，测出周期即可得知光度，因此被称为标准烛光。它是建立宇宙距离阶梯的关键一环，也是哈勃当年测定星系距离的依据。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙膨胀的含义：空间本身在膨胀（星系与地球内部由引力/电磁力维系）": "膨胀指的是空间本身在拉伸，而不是星系在既有空间中向外飞散，因此不存在一个膨胀中心，任何星系上的观察者都会看到同样的退行图景。星系内部、太阳系与原子都由引力或电磁力维系，其内部空间并不随宇宙一起膨胀。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙年龄估算 t = 1/H₀ ≈ 137 亿年": "若假设膨胀速率始终不变，把星系倒推回同一点所需的时间就是哈勃常数的倒数 t=1/H₀，取 H₀=70.0 km·s⁻¹·Mpc⁻¹ 算得约 1.4×10¹⁰ 年，即约 140 亿年。这个估算忽略了膨胀速率的变化，因此只是量级上正确的下限式结果。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/大爆炸时间线：暴胀→夸克汤→冷却形成质子中子→核合成（H、He、Li，约 3 分钟）": "大爆炸后极短时间内发生暴胀，随后是高温的夸克-胶子等离子体，随着温度下降夸克结合成质子与中子，约在最初几分钟内完成轻元素核合成，生成氢、氦与少量锂，之后核反应迅速停止。因此宇宙中的轻元素丰度是原初核合成的化石记录。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/四大证据：哈勃定律、宇宙微波背景辐射 CMBR（2.7 K）、轻元素丰度、星系光谱红移": "支持大爆炸的四条主要证据是：哈勃定律显示宇宙在膨胀、宇宙微波背景辐射是原初高温辐射红移至今的余晖（约 2.7 K，峰值波长约 1.06 mm）、轻元素丰度与理论预言一致、以及大量星系光谱普遍呈现红移。其中哈勃定律与星系红移本质上是同一条证据的两个方面。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙的未来：闭合、平坦、开放三种模型；临界密度约 9×10⁻²⁷ kg·m⁻³": "宇宙的未来取决于实际平均密度与临界密度的比较：大于临界密度为闭合宇宙，膨胀终将转为收缩（大挤压）；等于临界密度为平坦宇宙，永远膨胀但速率渐减；小于临界密度为开放宇宙，永远膨胀。现有观测表明宇宙接近平坦且膨胀正在加速，这需要暗能量来解释。", "AUSMAT May 2026 学习资料/PHY 物理/U4 · 宇宙学/宇宙学原理：各向同性 + 均匀性": "宇宙学原理假设宇宙在大尺度上各向同性（从任一方向看都一样）且均匀（各处物质分布相同），这正是稳恒态理论与大爆炸理论共同接受的出发点。它只在大尺度上成立：在星系、星系团这样的尺度上宇宙显然是不均匀的。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/科学探究技能：提出问题、假设、设计实验、安全操作、收集有效数据": "科学探究的完整链条是提出问题、形成可检验的假设、设计并实施实验、在安全前提下收集有效数据、分析后得出结论。假设必须能被实验证伪，且要与所测变量明确对应。每个环节都要留出书面记录，因为评估考的是过程而不只是结果。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/SI 单位与有效数字表达；识别趋势、规律与关系": "所有数据都要用 SI 单位记录并标注适当位数的有效数字，最终结果统一写 3 位有效数字。识别趋势时要用数据或图线说明变量之间是正比、反比还是平方关系，例如「成正比」须给出通过原点的直线证据，仅写「有关」不能得分。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/不确定度的陈述、计算与合成；异常数据识别与 % difference": "报告测量结果必须写成「数值 ± 不确定度 单位」的形式，并按运算类型合成不确定度。异常值要按 2 倍标准差或明显的操作原因来识别，不能仅因偏差大就剔除。% difference 用于比较两个测量值，% error 则用于与理论值比较，两者不要混用。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/用证据得出结论、评价过程、构建科学论证、量纲分析": "结论必须能追溯到具体数据与物理原理，不能只给答案。评价过程要指出真实的误差来源与具体改进办法（如换用更精密的仪器、增加测量次数），而不是笼统地写「误差来自人为因素」。量纲分析可用来检验公式推导是否正确，也可用于判断斜率应有的单位。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/抛体运动实验（测水平初速度并与能量守恒对比）；单摆测重力加速度 g": "抛体实验通过测量水平射程与下落高度算出初速度，再与能量守恒 predicted 的值对比以检验模型。单摆实验用 T=2π√(l/g) 整理成 T²=4π²l/g，以 T² 对 l 作图由斜率求 g。摆角须小于约 10° 才能满足简谐近似，并要测多次全振动以减小计时误差。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/锥形摆测向心力；力桌实验验证矢量合成": "锥形摆实验中改变半径与角速度，以 F 对 ω² 作图应得通过原点的直线，斜率等于 mr。力桌实验用三根绳互成角度拉动圆环使其平衡，检验任意两力的合力与第三力大小相等、方向相反，从而验证矢量合成的平行四边形法则。两者都靠图像法减小随机误差。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/磁学实验：条形磁铁力-距离关系、载流导体受力、长直导线磁场强度": "磁学实验通常有三类：用天平或力传感器测条形磁铁间的力与距离关系以验证平方反比或幂律（需先取对数线性化）；通电流测导线在磁场中的受力以验证 F=BIl；用霍尔探头测长直导线周围的磁场并检验 B 随 1/r 变化。每次都要先消去地磁场的背景影响。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/光学实验：折射性质探究、衍射法测激光波长、可见光谱与原子发射光谱": "光学实验一般包括用半圆玻璃砖测量不同入射角下的折射角以验证斯涅尔定律并求折射率；用衍射光栅按 nλ=d sinθ 测激光波长；以及用光谱管与光栅观察元素的线状发射谱。后者要注意先校准分光计、再读取多条谱线取平均以减小随机误差。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/普朗克常数测定；电阻串并联": "测定普朗克常数的经典做法是测不同波长滤光片下的遏止电压，以 V_s 对 f 作图，斜率给出 h/e，再乘 e 即得 h。电阻实验则通过测量串、并联组合的电流与电压验证 R_串=R₁+R₂ 与 1/R_并=1/R₁+1/R₂，此时须考虑电表内阻带来的系统误差。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/演示实验：电动机与交流发电机、光电效应模拟、范德格拉夫起电机、玻尔模型、狭义相对论": "演示实验的作用是把抽象模型变成可见现象：电动机与发电机互为逆过程，光电效应模拟展示光强与频率各自的影响，范德格拉夫起电机演示电荷积累与放电，玻尔模型与相对论演示则用于建立直观图像。观察时要抓住它与课本公式的对应关系。", "AUSMAT May 2026 学习资料/PHY 物理/实验与实践/实验报告范例：胡克定律测弹簧劲度系数（静态 F−x 与动态 T²−m 双法）、密度与不确定度": "胡克定律实验可用两种方法测劲度系数：静态法以 F 对伸长量 x 作图，斜率即 k；动态法以 T² 对质量 m 作图，由 T=2π√(m/k) 得斜率 4π²/k。两法结果相近可互相印证。密度实验则须分别合成质量与体积的不确定度，再按乘除规则求密度的百分比不确定度。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/校本任务：TT1（14%）、EA 评估与分析（12%）、EE 评估考试（20%）、Lab Assessment（10%）、TT2（14%）、FE（30%）": "物理评估共 100%：Tests 40%（TT1 14%、TT2 14%、EA 12%）、Examination 50%（EE 20%、FE 30%）、Science Inquiry 10%。EA 是评估与分析任务，EE 是评估考试，二者名称相近但性质不同，填表前务必分清。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/TT1 范围：重力、水平/竖直圆周运动、静平衡与质心；EE 范围：静平衡与质心、相对论、电磁学": "TT1 考重力与卫星运动、水平与竖直圆周运动、静平衡与质心；EE 在此基础上还覆盖相对论与电磁学，范围明显更宽。复习顺序建议先吃透质心与平衡这类反复出现的共同考点，因为它在 TT1 和 EE 中都要考。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/TT2 范围：电磁学、波粒二象性与量子理论；FE 覆盖 Unit 3 + Unit 4 全部": "TT2 考电磁学与波粒二象性、量子理论；FE（期末考试）则覆盖 Unit 3 与 Unit 4 的全部内容，权重 30%，是单项占比最高的一次评估。因此 FE 的准备必须以公式数据册为主线做全范围回顾，而不能只押考过的专题。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/WACE 外部考试（180 分 / 3 小时）：Section 1 短答 30% + Section 2 长答 50% + Section 3 阅读理解与数据分析 20%": "WACE 外部笔试为 3 小时、满分 180 分，由短答（30%）、长答（50%）与阅读理解及数据分析（20%）三部分组成，长答占比最高。答题时须写全公式、代入过程与单位，只写最终答案不给分。Section 3 通常给出一段陌生情境，考的是把课内模型迁移应用的能力。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/考试规则：最终答案 3 位有效数字、估算最多 2 位、必须带单位、须写全过程、使用公式与数据册": "考试硬性要求：所有数值答案保留 3 位有效数字（估算题最多 2 位）、必须带单位、须写出完整解题过程。作答时使用官方公式与数据册中的常数，并向左对齐展示推导。这几点是最容易避免也最容易丢失的过程分。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/VAULT OF ATPHY（79 页）：课程总览、评估大纲、科学探究技能、公式册、实验手册与报告范例": "这份 79 页的总纲文件囊括课程总览、评估大纲、科学探究技能、公式与数据册、实验手册以及实验报告范例。考前最值得反复使用的是公式与数据册与实验报告范例，前者决定计算题能否做对，后者决定实验题能否拿满分。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/各 Topic 讲义：向量、力与斜面、功与能、动量、直线运动、抛体、重力与卫星、力矩、相对论、电磁学、量子、宇宙学": "按课程顺序覆盖从向量与斜面到宇宙学的全部内容，是复习时的第一手材料。电磁学与量子理论两块讲义数量最多，也对应 TT2 与 FE 的重点，建议按编号顺序通读后再用课后题检验是否真的掌握。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/REVISION 复习卷：TT1 / EA / FE 复习（含 WACE 2019–2024 真题汇编与完整解答）": "REVISION 卷按 TT1、EA、FE 等评估类型分类编成，并附历年 WACE 真题与完整解答。最有效的用法是先限时独立完成，再逐题对照评分标准，重点分析自己丢的是过程分还是结论分。近五年的真题覆盖面与出题风格最接近正式考试。", "AUSMAT May 2026 学习资料/PHY 物理/考核与配套资源/实时物理 Real World Physics 拓展 + DIGITAL LIBRARY 数字资源索引": "Real World Physics 提供与真实技术、工程和生活情境挂钩的拓展材料，DIGITAL LIBRARY 则是所有附件与原始 PDF 的索引。它们的价值在于帮助理解「为什么学」以及把公式迁移到陌生情境，这正是 Section 3 阅读理解与数据分析题的考查方向。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/探究类型：观察法、对照实验、双盲实验、安慰剂、随机分组、调查、试错、个案/纵向研究": "按「是否人为干预」分：观察法只记录自然出现的模式；对照实验只改一个变量（fair test）；双盲实验中受试者与测试者都不知分组，且受试者随机分配、由独立管理员操作，用于暴露安慰剂效应；调查、试错与个案研究属描述性，无法确立因果。考点：双盲的关键是「双方都不知情＋随机分组」。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/科学方法流程：识别问题→文献综述→提出假设→实验→分析→结论→报告": "科学探究的骨架：先界定可检验的问题，查文献避免重复，再提出可证伪的假设与预测，然后设计并执行实验、处理数据、得出结论，最后以科学报告交流。易错：假设必须能被数据否定，不能写成「证明某结论正确」；结论只适用于本研究范围，不可随意外推。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/变量：自变量 IV / 因变量 DV / 控制变量 CV": "自变量 IV 是研究者主动改变的因素，因变量 DV 是随之测量、代表结果的那一项，控制变量 CV 是必须全程保持一致以免污染结果的其他因素。考点：写变量要带测量方式与单位（如 DV＝每分钟心跳次数）；作图时 IV 恒为横轴、DV 为纵轴；控制变量是「本会变化、被刻意固定」的因素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/实验质量：效度 validity、信度 reliability、准确度 accuracy": "效度问的是「有没有测到该测的东西」——控制变量不足或存在系统误差即失效；信度指重复实验能否得到一致结果，靠重复与复本提高；准确度指数据与真值的接近程度，取决于仪器是否校准。关键：重复与复本只能提高信度，不能提高准确度，这是最常见的混淆点。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/重复 repeats 与复本 replicates 的区别；测量误差与不确定性": "repeats 是同一实验由同一人、同一条件反复做多次；replicates 是并行做多组或扩大受试人数。测量误差来自受试自然差异与测量过程，若源于仪器精度则只能校准仪器。数据常以置信区间表示，如 45±1.5 指 95% 置信水平下真值落在 43.5–46.5。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/数据类型：定性/定量、离散/连续；误差识别与图表类型选择": "定性数据不含数字（A 比 B 高），定量数据带测量值，又分离散（只能取整数，如人数）与连续（区间内可取任意值，如身高）。选图规则：两个连续变量用折线图或散点图，离散或类别比较用柱状图，比例构成用饼图。易错：离散数据不能连成折线，柱状图各柱之间要留空隙。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch1 探究人体生物学/伦理：人体受试者知情同意；动物伦理 3R（替代/减少/优化）；风险评估": "人体研究必须取得知情同意、允许随时退出并保护隐私；动物实验遵循 3R——Replacement 用替代方法、Reduction 减少动物数量、Refinement 改进技术以减轻痛苦。风险评估要写出具体危害、风险等级与相应控制措施。考点：3R 三个英文词必须能对上，并能各举一例。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/外分泌腺 vs 内分泌腺（无导管、直接分泌入血）": "外分泌腺有导管，分泌物经管道排到体表或体腔（汗腺、唾液腺、胰腺外分泌部）；内分泌腺无导管，激素直接进入组织液再入血液，随血液遍布全身但只作用于带对应受体的靶细胞。易错：胰腺两者兼具——外分泌部经胰管送消化酶，内分泌部（胰岛）分泌胰岛素与胰高血糖素入血。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/9 大内分泌腺：下丘脑、垂体（前叶/后叶）、甲状腺、甲状旁腺、胸腺、肾上腺（皮质/髓质）、胰岛、性腺、松果体": "记忆口诀是 4P＋2TAG：4P 为垂体、松果体、胰腺、甲状旁腺，2TAG 为胸腺、甲状腺、肾上腺、性腺，再加指挥它们的下丘脑，构成九个内分泌腺。考点：肾上腺皮质与髓质在来源、激素与功能上完全不同，必须分开记——皮质分泌皮质醇与醛固酮，髓质分泌肾上腺素与去甲肾上腺素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/类固醇激素（脂溶性、源自胆固醇）vs 蛋白/胺类激素（水溶性）": "类固醇激素脂溶性、由胆固醇衍生（皮质醇、醛固酮、性激素），能穿过细胞膜，故口服有效；蛋白与胺类激素水溶性（胰岛素、生长激素、肾上腺素、ADH），无法过膜，口服会被消化道酶分解，只能注射。对比表还要能填：受体位置、是否用第二信使、起效快慢与作用持续时间。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/作用机制：胞内受体→激活基因→转录翻译 vs 膜受体→第二信使→酶级联放大": "类固醇激素扩散入细胞，与胞内受体形成激素-受体复合物，激活基因→转录出 mRNA→翻译成蛋白质，从而改变细胞功能，起效慢但持久。蛋白与胺类激素只能结合膜受体，产生第二信使 cAMP，触发酶级联放大：一个激素分子可激活上千分子，最终生成十亿级酶分子，故起效快而短暂。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/下丘脑-垂体通讯：前叶（垂体门脉系统与释放因子）vs 后叶（神经细胞直接支配）": "前叶是真正的腺体：下丘脑神经分泌细胞把释放因子与抑制因子送入垂体门脉系统，再刺激前叶分泌 TSH、ACTH、FSH、LH、GH 与催乳素。后叶只是储存与释放站：ADH 与催产素在下丘脑合成，沿神经轴突运至后叶，由神经冲动直接触发释放。易错：后叶自己不合成激素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/代表激素：ADH、催产素、FSH、LH、GH、TSH、ACTH、胰岛素、胰高血糖素、肾上腺素、皮质醇、甲状腺素": "按来源记：下丘脑合成 ADH 与催产素（经后叶释放）；前叶分泌 GH、TSH、ACTH、FSH、LH 与催乳素；甲状腺分泌 T3/T4；肾上腺髓质分泌肾上腺素，皮质分泌皮质醇与醛固酮；胰岛 β 细胞分泌胰岛素、α 细胞分泌胰高血糖素。考点：TSH、ACTH 是促激素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch2 激素调控人体（内分泌）/负反馈调节机制；激素失调与激素替代疗法": "多数激素靠负反馈稳定：靶腺激素升高会反过来抑制下丘脑的释放因子与垂体的促激素，形成下丘脑→垂体→靶腺的三级环路。失调即某种激素过多或过少，如甲亢、甲减、糖尿病、尿崩症；替代疗法就是补足缺失的激素（胰岛素注射、甲状腺素片）。正反馈极少，典型是分娩时的催产素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/神经元结构：胞体、树突、轴突、髓鞘（施万细胞）、轴突末梢": "信息单向流动：树突接收→胞体整合→轴突传导→轴突末梢输出。髓鞘是包裹轴突的脂质绝缘层，外周由施万细胞、中枢由少突胶质细胞形成，可防电流泄漏并实现跳跃式传导；相邻两段髓鞘之间的裸露间隙叫郎飞结。考点：传导方向由突触结构决定，与轴突长短无关。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/神经元 4 种结构类型与 3 种功能类型（感觉/中间/运动）": "结构分四型：多极（一轴突加多树突，多数运动与中间神经元）、双极（一轴突加一树突，见于眼、耳、鼻）、假单极（单一突起再分叉，多数感觉神经元）、单极（仅见于昆虫）。功能分三型：感觉（受体→CNS）、中间（CNS 内连接）、运动（CNS→效应器）。易错：假单极最常考。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/静息膜电位（三大维持因素）与钠钾泵": "膜内外约 −70 mV 由三因素维持：①膜对 K⁺ 通透性高、漏通道多，K⁺ 顺浓度外流；②对 Na⁺ 通透性低；③对大分子有机阴离子不通透，负电荷留在胞内。钠钾泵每耗 1 分子 ATP 泵出 3 Na⁺、泵入 2 K⁺。考点：泵维持浓度梯度，静息电位主要靠 K⁺ 漏通道。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/动作电位四阶段：去极化→复极化→超极化→恢复静息；阈值 −55 mV、峰值 +30 mV": "刺激使电压门控 Na⁺ 通道开放，内流把电位推过 −55 mV 阈值并冲上 +30 mV（去极化）；随后 Na⁺ 通道关闭、K⁺ 通道开放，外流使电位回落（复极化）；K⁺ 通道关闭慢，过量外流造成超极化；最后泵恢复静息。易错：去极化靠 Na⁺ 入、复极化靠 K⁺ 出。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/全或无定律 all-or-none、不应期；刺激强度→动作电位频率": "刺激达不到阈值就没有动作电位；一旦达到或超过阈值，动作电位的幅度恒定不变，这就是全或无。更强的刺激只能提高动作电位的频率，不能提高幅度。不应期内 Na⁺ 通道失活，膜无法再次兴奋，从而保证冲动单向传导、不回头。考点：问「加大刺激会怎样」，答频率升高、幅度不变。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/跳跃式传导 saltatory conduction（有髓鞘）vs 无髓鞘轴突；传导速度": "有髓鞘轴突的离子交换只发生在郎飞结，动作电位像跳格子一样逐结传导，比无髓鞘轴突沿整段膜逐点去极化快得多，也更节省 ATP；轴突越粗、髓鞘越厚，传导越快。考点：多发性硬化因髓鞘被破坏而传导变慢，说明髓鞘的作用是绝缘与加速，而不是产生电位。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/化学突触传递：钙内流→突触小泡融合→神经递质→突触后受体；乙酰胆碱酯酶": "顺序记牢：动作电位到达轴突末梢→电压门控 Ca²⁺ 通道开放、Ca²⁺ 内流→突触小泡与前膜融合并胞吐释放神经递质→递质扩散过突触间隙→与突触后膜受体结合→引起兴奋或抑制。随后乙酰胆碱酯酶把乙酰胆碱分解，终止信号。突触传递是单向的，也是药物与毒素最常攻击的环节。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/神经-肌肉接头；药物与毒素如何干扰突触": "运动神经元轴突末梢与骨骼肌纤维形成的特化突触，递质为乙酰胆碱，结合后引起肌纤维去极化并收缩。干扰方式可分四类：阻断突触后受体（箭毒）、抑制乙酰胆碱酯酶使递质堆积（有机磷农药）、阻止递质释放（肉毒毒素）、促进递质释放（黑寡妇毒蛛）。考点：能按作用在突触前还是突触后归类。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/6 类受体（温度/渗透压/化学/机械/痛觉/本体感受）与躯体/特殊感觉": "感受器按刺激分六类：痛觉 nociceptor（组织损伤、缺血、过强压力与温度）、机械（声波、压力、触压）、化学（化学物质、血中 pH 与气体）、温度（冷热）、光（仅眼）、渗透压 osmoreceptor（血浆渗透压，位于下丘脑）。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/反射与反射弧五部分：受体→感觉神经元→中间神经元→运动神经元→效应器": "反射弧五部分缺一不可：受体感受刺激→感觉神经元传入→中间神经元（位于脊髓或脑的灰质内）整合→运动神经元传出→效应器（肌肉或腺体）作出反应。膝跳反射只含感觉与运动两个神经元（单突触），仍属反射。考点：反射是无意识的快速自动反应，答题要写明中间神经元的位置。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/神经系统与内分泌系统比较：速度、持续时间、信息性质、特异性": "神经传导靠电信号与神经递质，沿固定通路点对点传递，速度极快（毫秒级）、作用短暂、靶位精确；内分泌调节靠激素经血液运输，起效慢（数秒到数小时甚至更久）、作用持久、全身分布但只对带受体的靶细胞起作用。考点：两者都由下丘脑协调，常以表格对比速度、持续时间、传递方式与特异性。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/中枢神经系统 CNS 与三层保护：颅骨脊椎、脑膜、脑脊液": "三层保护由外到内：颅骨与脊柱构成骨性外壳；脑膜三层——硬膜 dura mater、蛛网膜、软膜 pia mater；脑脊液 CSF 充于脑膜之间与脑室，起缓冲减震、供给营养并维持颅内压的作用。考点：脑膜炎即脑膜感染，腰椎穿刺抽取的正是脑脊液；答「保护」时必须写全骨、膜、液三者。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/脑结构：大脑四叶（额/顶/颞/枕）、小脑、延髓、下丘脑、胼胝体": "额叶管思维、计划、随意运动与语言的产生；顶叶管躯体感觉；颞叶管听觉与语言理解；枕叶管视觉。小脑主管平衡与动作协调，使随意运动平滑；延髓含心搏、呼吸与血管运动中枢，并管吞咽、咳嗽、喷嚏、呕吐等反射；下丘脑是稳态中枢（体温、水盐、摄食、内分泌协调、自主神经）；胼胝体连接左右半球。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/大脑功能分区与语言区：Broca 区（产生）与 Wernicke 区（理解）": "大脑皮层按功能分感觉区（解读受体传来的冲动）、运动区（控制肌肉）与联络区（智力与情绪）。语言区几乎都位于左半球：Broca 区在额叶，负责语言的产生与构音，受损则说不出话但仍能听懂；Wernicke 区在颞叶，负责语言理解，受损则话讲得流利却无意义、也听不懂别人。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/白质与灰质；神经束 tracts": "灰质以神经细胞体与树突为主，位于大脑表面（皮层）与脊髓中央；白质以有髓鞘轴突为主，位于大脑内部与脊髓外周，颜色来自髓鞘。CNS 内的纤维束叫 tracts，分三类：联络束连接同侧皮层各区，连合束连接左右半球，投射束连接皮层与脑干或脊髓。考点：大脑与脊髓的灰白质内外位置恰好相反。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/周围神经系统 PNS：传入（躯体/内脏感觉）与传出（躯体运动 + 自主神经）": "PNS 把 CNS 与全身连接起来。传入（感觉）部分把躯体感觉与内脏感觉送进 CNS；传出部分再分两支——躯体运动神经支配骨骼肌（随意），自主神经支配心肌、平滑肌与腺体（不随意），自主神经又分交感与副交感。考点：分类必须按「传入／传出」再按「躯体／自主」两级展开，不能混着写。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/自主神经：交感 vs 副交感对各效应器（心、血管、瞳孔、消化、呼吸、汗腺）的对比": "交感以去甲肾上腺素为主，应激时占优：心率与收缩力增加、骨骼肌与心肝血管舒张而内脏与皮肤血管收缩、瞳孔放大、支气管扩张、消化活动受抑、汗腺分泌增加。副交感以乙酰胆碱为主，静息时占优：心率减慢、瞳孔缩小、支气管收缩、促进消化与排尿。考点：两者是同一器官接受两套纤维的拮抗关系。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/战斗或逃跑反应 fight or flight；脊髓背根与腹根结构": "面临恐惧、愤怒、压力或竞争时交感兴奋，肾上腺髓质释放肾上腺素与去甲肾上腺素，使心输出量与血压升高、骨骼肌血流增加、气道扩张、血糖升高、汗液增多，以强化并延长上述反应。脊髓横断面：背根含感觉神经元轴突、其上有背根神经节（感觉胞体所在），腹根含运动神经元轴突。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/刺激-反应-反馈模型 SRF；负反馈 vs 正反馈": "SRF 模型把稳态机制串成一条链：刺激（偏离设定点）→受体检测→控制中心（多为下丘脑或延髓）→效应器反应→反馈。负反馈使变化被抵消、回到设定点，是绝大多数激素与体温调节的机制；正反馈使变化被放大，如分娩时催产素与凝血级联。考点：要写全受体、控制中心、效应器三要素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/血糖：糖原分解、糖原生成、脂解、脂肪生成、糖异生": "方向别记反：糖原生成 glycogenesis＝葡萄糖→糖原，糖原分解 glycogenolysis＝糖原→葡萄糖（肝、肌）；糖异生 gluconeogenesis＝脂肪/蛋白质→葡萄糖（肝）；脂肪生成 lipogenesis＝葡萄糖→脂肪（肝）；脂解＝脂肪→脂肪酸（肝）。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/血糖激素：胰岛素、胰高血糖素、肾上腺素、皮质醇及其分泌腺": "胰岛 β 细胞分泌胰岛素，是体内唯一降血糖的激素，促糖原生成、脂肪生成与细胞摄取葡萄糖；胰岛 α 细胞分泌胰高血糖素，促糖原分解与糖异生而升高血糖。肾上腺髓质分泌肾上腺素（应激时快速升糖），肾上腺皮质分泌皮质醇（促糖原分解、糖异生与脂解）。考点：胰岛素是唯一降血糖的激素。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/效应器：肝、肌肉、脂肪组织各自的独特反应": "肝是核心：血糖高时把葡萄糖变糖原储存或变脂肪；血糖低时把糖原分解，并经糖异生把脂肪与氨基酸转成葡萄糖，还能把肌肉产生的乳酸再利用。骨骼肌只能储存与分解自身糖原供自己使用，不能把葡萄糖放回血液。脂肪组织在胰岛素作用下储脂，在胰高血糖素与肾上腺素作用下脂解供能。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/糖尿病 mellitus 与临床数据分析": "1 型糖尿病因 β 细胞被破坏、胰岛素绝对不足，多见于年轻患者，必须注射胰岛素；2 型因靶细胞受体减少或反应下降（胰岛素抵抗），多与肥胖和年龄相关，可先靠饮食、运动与口服药控制。考点：看血糖曲线——糖尿病者空腹血糖偏高、进食后峰值更高且回落更慢；尿中出现葡萄糖说明已超过肾阈值。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温：7 种产热/散热途径（辐射、传导、对流、蒸发等）": "散热与产热途径要分清：代谢产热（细胞呼吸的副产物）是唯一真正产热的途径；辐射（向周围发射热量）、传导（与直接接触的物体交换热）、对流（流动的空气或水不断带走体表热量）、蒸发（汗液汽化带走大量热）、排泄（排出温热的尿、粪与呼出气）都只能散热。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温效应器：血管舒缩、骨骼肌战栗、汗腺与竖毛肌、甲状腺素与肾上腺素、行为性调节": "过热时皮肤小动脉舒张，更多血流通向体表经辐射与对流散热，同时汗腺分泌增加、靠蒸发散热。过冷时皮肤血管收缩以减少体表血流，骨骼肌不自主收缩战栗产热，竖毛肌收缩形成鸡皮疙瘩，甲状腺素与肾上腺素提高代谢率，并出现添衣、蜷缩、找暖处等行为性调节。考点：战栗是产热，鸡皮疙瘩几乎不产热。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温失调：低体温、中暑、热衰竭": "低体温指核心体温过低，酶反应与代谢变慢，严重时意识丧失、心律不齐。热衰竭多因剧烈运动大量出汗加血管扩张，导致脱水与血容量下降，表现为头晕、乏力、皮肤湿冷、血压偏低；中暑是体温调节机制彻底失效，核心体温很高而皮肤干热无汗、意识障碍，可致命。考点：靠出汗与皮肤状态区分两者。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/体液类型与分布：细胞内液 / 细胞外液（血浆、组织液）": "体液分细胞内液与细胞外液，细胞外液又包括血浆、组织液以及淋巴、脑脊液等。细胞外液是细胞真正的内环境，其成分与渗透压必须保持稳定。考点：物质在血液与细胞之间往返必须穿过毛细血管壁和细胞膜两道屏障；血浆与组织液的主要差别在于血浆含有较多血浆蛋白。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/肾单位结构：肾小球、鲍曼囊、近曲小管、髓袢、远曲小管、集合管": "肾单位是肾的功能单位，由肾小体与肾小管组成：肾小球是毛细血管球，被鲍曼囊包裹，二者合称肾小体，滤过在此发生；此后依次为近曲小管、髓袢（亨利氏袢，深入髓质、参与浓缩尿液）、远曲小管，最后汇入集合管。考点：常给图要求标注各段，并问哪一段受 ADH 或醛固酮调节。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/尿形成四步：滤过→重吸收→分泌→排泄；尿检 urinalysis": "滤过发生在肾小球与鲍曼囊：高压把水、葡萄糖、氨基酸、盐类与小分子废物压入囊腔，血细胞与血浆蛋白被留下。重吸收主要在近曲小管，把有用物质与水收回血液。分泌是把血液中多余的物质主动送入小管。最后经集合管、输尿管、膀胱、尿道排出。尿检查葡萄糖、蛋白、血细胞与 pH 可提示肾病或糖尿病。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/渗透调节：下丘脑渗透压感受器、ADH→水通道蛋白 aquaporin、醛固酮→钠通道、口渴反应": "失水使血浆渗透压升高→下丘脑渗透压感受器兴奋→后叶释放 ADH→作用于远曲小管与集合管，增加水通道蛋白 aquaporin 使水重吸收，尿少而浓，并引起口渴。醛固酮由肾上腺皮质分泌，作用部位相同，促 Na⁺ 重吸收、K⁺ 排出，水随之渗透回吸。水多时 ADH 减少，尿稀而多。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/气体浓度：O₂/CO₂ 运输、CO₂ 浓度与血液 pH（碳酸/碳酸氢盐缓冲体系）": "O₂ 主要与红细胞中的血红蛋白结合运输，少量溶解在血浆里；CO₂ 大部分以碳酸氢根的形式在血浆中运输，少部分与血红蛋白结合。CO₂ 与水在碳酸酐酶催化下生成碳酸，解离出 H⁺，故 CO₂ 升高会使 pH 下降。碳酸与碳酸氢盐构成缓冲对，把血液 pH 维持在约 7.35–7.45。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/中枢与外周化学感受器；延髓调节中枢；肋间肌与膈肌": "感受器两类：延髓的中枢化学感受器对 CO₂ 与 H⁺ 敏感，主动脉体与颈动脉体的外周感受器对 O₂、CO₂ 与 pH 敏感。调节中枢是延髓呼吸中枢，含吸气与呼气两个区域。效应器是膈肌（膈神经）与肋间肌（肋间神经）。考点：CO₂ 是最强呼吸调节因素，O₂ 降得很低才起作用。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/换气过度 hyperventilation：深潜的致命风险 vs 缓解焦虑的用途": "快速深呼吸会排出过多 CO₂，使血液 pH 升高、呼吸驱动减弱。潜水前换气过度看似能憋更久，其实不是因为多带了氧，而是失去了「CO₂ 升高」这个呼吸冲动信号，人会在感到憋气之前就先因脑缺氧而昏迷。用于缓解焦虑时也要注意头晕、手脚发麻等呼吸性碱中毒的表现。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/病原体四大类型：细菌、病毒、真菌、寄生虫": "按结构与大小记：病毒最小、非细胞结构，必须寄生在活细胞内；细菌是单细胞原核生物，可独立繁殖；真菌是真核生物，常有菌丝与孢子；寄生虫包括原虫、蠕虫等，均为真核且生活史复杂。考点：抗生素只对细菌有效，对病毒、真菌与寄生虫无效，这是高频简答题。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/细菌：原核 vs 真核、4 种形态（球菌/杆菌/螺旋菌/弧菌）、革兰氏染色与细胞壁结构": "细菌是原核生物：没有膜包被的细胞核与膜性细胞器，有细胞壁、环状 DNA 与质粒，以二分裂繁殖。形态分球菌、杆菌、螺旋菌、弧菌。革兰氏染色步骤为结晶紫初染→碘液媒染→酒精脱色→番红复染；阳性菌细胞壁肽聚糖厚、染成紫色，阴性菌肽聚糖薄且外有脂多糖层、染成红色。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/病毒结构与复制方式；与细菌的三大区别": "病毒只有核酸核心（DNA 或 RNA）与蛋白质外壳衣壳，有些还有包膜，没有细胞结构也没有核糖体，不能独立代谢或繁殖，必须借助宿主细胞的机器复制，因此被视为介于非生命与生命之间。与细菌的三点区别：非细胞结构而细菌是原核细胞、不能独立繁殖而细菌行二分裂、抗生素对病毒无效而对细菌有效。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/6 种传播途径：直接接触、间接接触、体液、病媒、污染食物与水、空气飞沫": "可归为接触类与非接触类：直接接触（触摸、接吻）、间接接触（共用毛巾餐具等污染物）、体液传播（血液与性接触）、病媒传播（蚊虫等媒介，如疟疾）、污染的食物与饮水（粪口途径）、空气飞沫与气溶胶。考点：答预防措施时必须对应到具体途径，例如病媒途径就要防蚊灭蚊。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/外部防御（皮肤、黏膜、纤毛、胃酸、泪液、唾液等）与 4 种保护性反射": "第一道防线含皮肤（皮脂与汗液抑菌）、黏膜、鼻毛与纤毛（把黏液扫向咽部）、胃酸与阴道酸性分泌物、泪液与唾液中的溶菌酶、耳垢与排尿冲洗。四种保护性反射各有刺激与反应：打喷嚏（鼻黏膜受刺激）、咳嗽（下呼吸道受刺激）、呕吐（胃过度牵张或毒素）、腹泻（肠道受刺激后蠕动加快排走刺激物）。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/内部非特异性防御：吞噬作用、炎症（肥大细胞与组织胺）、发热（致热原与体温调定点上移）、淋巴系统": "第二道防线不针对特定病原：吞噬细胞（中性粒细胞、巨噬细胞）吞噬并消化病原体；受损组织释放组织胺等，使局部血管扩张、通透性增加，出现红、肿、热、痛并招募更多吞噬细胞；致热原使下丘脑体温调定点上移而引起发热，抑制病原繁殖并加快免疫反应；淋巴系统过滤组织液并把病原带到淋巴结。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/特异性免疫·体液免疫：B 细胞→浆细胞→抗体 6 种作用方式 + 记忆细胞": "B 细胞被抗原激活后增殖分化为浆细胞与记忆细胞，浆细胞分泌抗体。抗体六种作用：中和细菌毒素或酶使其失活、结合病毒表面阻止其入侵细胞、包被细菌便于吞噬细胞吞噬、使细菌病毒或异体血细胞凝集、溶解病原体（破坏其膜）、与可溶性物质反应使其变为不溶以便吞噬。记忆细胞使二次应答更快更强。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/特异性免疫·细胞免疫：辅助 T / 细胞毒 T 细胞 + 记忆细胞；B 与 T 细胞比较": "T 细胞在胸腺成熟，针对胞内病原体、癌细胞与移植组织。辅助 T 细胞识别抗原呈递后释放细胞因子，激活细胞毒 T 与 B 细胞；细胞毒 T 细胞用穿孔素在靶细胞膜打孔并释放颗粒酶，引发凋亡。对比：B 细胞靠抗体对付细胞外病原，T 细胞靠直接接触杀灭胞内病原，两者都产生记忆细胞。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/免疫四大类型（主动/被动 × 自然/人工）；疫苗接种与群体免疫": "按抗体来源与是否自身产生分四类：自然主动＝患病后获得；自然被动＝婴儿经胎盘或母乳获得母体抗体；人工主动＝接种疫苗，机体自己产生抗体与记忆细胞，保护持久；人工被动＝注射抗毒素或免疫球蛋白，立即起效但没有记忆细胞、保护短暂。群体免疫需足够高比例的人免疫才能阻断传播。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/抗生素（抑菌/杀菌、广谱/窄谱）与抗病毒药；耐药性 antibiotic resistance": "抗生素只作用于细菌：按作用分抑菌（抑制繁殖）与杀菌，按范围分广谱（影响多种菌，易破坏正常菌群）与窄谱；抗病毒药则需干扰病毒进入细胞或复制。耐药性源于随机突变加选择：用药剂量不足、疗程不完整或滥用会留下耐药菌并大量繁殖。故须按医嘱足量足疗程，且抗生素对感冒等病毒感染无效。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/重组 DNA 技术：限制性内切酶（平末端/黏末端）、DNA 连接酶、质粒": "三种工具各司其职：限制性内切酶识别特定序列切开 DNA，交错切口产生黏末端、平直切口产生平末端；质粒作载体，须用同一种酶切开以产生互补黏末端；DNA 连接酶封闭糖-磷酸骨架缺口，把目的基因与质粒接成重组质粒，再导入细菌扩增。考点：互补黏末端是关键，所以两步须用同一种酶。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/细菌转化 transformation：热激、CaCl₂、LB 培养基、抗生素筛选": "先用 CaCl₂ 处理细菌，使细胞壁与膜通透性增加形成感受态，再加入重组质粒，短时热激使 DNA 进入细胞，然后置于 LB 培养基中扩增。因质粒携带抗性基因，在含抗生素的培养基上只有成功转化的细菌能存活成菌落，从而完成筛选。考点：抗生素筛选是选出已摄取质粒的菌，不是杀死全部细菌。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/基因治疗 gene therapy；干细胞与细胞替代疗法；组织工程": "基因治疗是向细胞导入正常基因以替代缺陷基因，多用于单基因隐性病（囊性纤维化、镰状细胞贫血、亨廷顿病），但无法修复已造成的严重器官损伤。细胞替代疗法用干细胞诱导分化出健康细胞（如神经元）再移植，治疗阿尔茨海默病与帕金森病。组织工程更进一步，把干细胞种在支架上长成三维组织或器官。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/疾病治疗应用：糖尿病、甲亢/甲减、脑部疾病（Alzheimer's、Parkinson's）": "糖尿病用重组人胰岛素或胰岛素类似物替代；甲亢用药物、放射性碘或手术抑制或去除甲状腺，甲减则补充甲状腺素。阿尔茨海默病与帕金森病属神经退行性疾病，传统药物只能缓解症状，现探索用干细胞分化出的健康神经元做细胞替代。考点：能区分「缺什么补什么」与「换掉坏细胞」两类思路。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/合成激素；用重组 DNA 技术生产激素与疫苗": "把人胰岛素基因插入质粒、导入细菌或酵母，让其大量表达，再提取纯化，即得合成激素——产量大、纯度高，不依赖动物胰腺，还可避免动物源病原体与免疫排斥。疫苗也可用同样思路生产亚单位疫苗（只取病原体的一段抗原蛋白），比传统减毒或灭活疫苗更安全。考点：rDNA 产物是借细胞工厂造蛋白。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/中心法则复习：DNA→RNA→蛋白质": "遗传信息的流向是 DNA→（转录）→mRNA→（翻译）→蛋白质：mRNA 在细胞核内按碱基互补原则由 DNA 转录而来，随后到核糖体上按每三个碱基（密码子）对应一个氨基酸的方式翻译成多肽。基因通过控制蛋白质合成来控制性状。考点：突变若改变密码子却不改变氨基酸，即为沉默突变。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/突变：基因突变与染色体突变、诱变剂 mutagens；突变是新等位基因的最终来源": "基因突变只影响一个基因，可为点突变（碱基置换）或移码突变（插入或缺失使读码框全乱）；染色体突变影响多个基因或整段染色体，如缺失、重复、倒位、易位与非整倍体（不分离所致）。诱变剂如辐射与某些化学物质可提高突变率。突变是随机、无方向的，却是新等位基因的最终来源。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/变异来源：突变、独立分配、交叉互换、随机受精、不分离 non-disjunction": "减数分裂中同源染色体随机取向进入配子（独立分配）与同源染色体的交叉互换，加上突变提供的新等位基因和随机受精，共同造成后代基因组合的多样。不分离是减数分裂时一对染色体或姐妹染色单体未分开，导致配子染色体数目异常（如 21 三体）。考点：只有突变产生新等位基因，其余只是重新组合。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/基因库 gene pool 与等位基因频率的动态变化": "基因库是一个种群中全部等位基因的总和，可用等位基因频率来描述，并用来比较同一物种在不同时间或不同地点的种群。等位基因频率是动态的，受突变、选择压力、随机遗传漂变（含奠基者效应）与基因流影响。考点：进化的定义就是种群基因库中等位基因频率的世代改变——个体不进化，种群才进化。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/进化机制：基因流/迁移、随机遗传漂变（含奠基者效应）、自然选择、选择压力": "基因流是等位基因随个体迁移在种群间流动，可减少种群间差异；随机遗传漂变是小种群中等位基因频率的偶然波动，与是否适应无关，奠基者效应是其特例（少数个体建立新种群，基因库不具代表性）；自然选择则是有方向的，选择压力使有利表型的个体留下更多后代。考点：漂变的效应随种群变小而增强。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/物种形成 speciation；案例：镰状细胞贫血": "物种形成需先出现生殖隔离：地理屏障使基因流中断，被分隔的基因库在自然选择与漂变下独立变化，最终无法交配繁殖。镰状细胞贫血是经典案例：疟疾流行区中杂合子（镰状细胞特征）能抵抗疟疾，比正常纯合子与患病纯合子都有生存优势，故致病等位基因频率被维持在高位，称为杂合子优势。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/聚合酶链反应 PCR": "在体外大量扩增特定 DNA 片段，每一轮含三个步骤：高温变性使双链解开→降温退火让引物结合到互补序列→升温延伸，由 Taq 聚合酶从引物开始合成新链。Taq 来自嗜热菌，能耐高温而不变性，因此可反复循环，产物量每轮约翻倍、呈指数增长。考点：顺序必须是变性→退火→延伸。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/凝胶电泳 gel electrophoresis、DNA 指纹、Sanger 测序": "DNA 带负电，在电场中向正极移动；凝胶起分子筛作用，片段越短跑得越远，即按长度分离 DNA，条带图就是 DNA 指纹，可用于亲子鉴定、法医与物种比较。Sanger 测序在反应中加入终止性的双脱氧核苷酸，使链合成随机终止，再按长度读出序列。考点：PCR 是扩增，电泳是分离。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/比较基因组学 comparative genomics、比较蛋白质（氨基酸序列差异）、生物信息学": "比较基因组学研究与比较不同物种的基因组序列，找出共有与差异的基因；比较蛋白质则比对同一种蛋白质在不同物种间的氨基酸序列差异。差异越小说明亲缘关系越近、分化时间越短。生物信息学用计算机与统计工具处理这些海量序列数据，构建并修正系统发生树。考点：两类证据都基于差异量正比于分化时间。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/内源性逆转录病毒、线粒体夏娃、DNA 杂交": "三者都是分子层面的证据：内源性逆转录病毒是远古病毒插入人类基因组后不再外移的片段，插入位置相同说明有共同祖先；线粒体夏娃是依据线粒体 DNA 只经母系遗传而追溯出的现代人最近共同母系祖先；DNA 杂交通过比较不同物种 DNA 解链后再配对的结合程度衡量相似性。三者结论一致。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/系统发生树的使用（不要求绘制）": "系统发生树用分叉表示物种间的共同祖先与分化顺序：两物种若在同一个最近共同祖先处分出，说明亲缘最近；分叉点越靠近现在，分化越晚；分支长短还可表示变化量。考点：只要求会读图，能判断谁与谁亲缘最近、谁最先分化，并推断某性状是共有衍征还是趋同演化，不要求独立绘制。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/化石形成 fossilisation 与化石记录的不完整性": "化石是生物遗体、遗物或遗迹被矿物质置换或留存于沉积岩中形成的。形成条件苛刻：需被迅速掩埋、具备坚硬部分（骨、壳、齿），并且不被分解或扰动。因此化石记录并不完整，只代表当时生物多样性的一小部分；软体生物、陆生生物与森林环境中的生物尤其难以留下化石。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/相对测年：地层学 stratigraphy、标准化石 index fossils": "相对测年只判断先后顺序、不给绝对年代。地层学依据沉积岩「下老上新」以及岩层的叠覆与穿插关系；标准化石则是生存时间短、地理分布广、数量多且易于识别的化石，用它可以把不同地点的岩层对应起来，从而判断含化石岩层的相对年代。考点：标准化石的关键特征是时限短加分布广。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/绝对测年：碳十四、钾氩法及其各自局限": "放射性测年依据同位素恒定速率衰变、用半衰期算绝对年代。碳十四半衰期约 5730 年，生物死亡时体内的碳十四被固定，之后与碳十二的比例随衰变下降，适用于数万年内的有机遗骸；钾氩法测火山岩中钾四十衰变为氩，半衰期约 12.5 亿年，适用于数百万至数十亿年岩石，但对沉积岩本身无效。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/地质时间线；系统发生树 phylogenetic trees 的解读": "地质时间线把化石按相对测年与绝对测年的结果排到各个代、纪、世上。要能对照时间线判断某化石属于哪个时期，并读出系统发生树中的分化顺序与亲缘远近。考点：常把两者合并出题——先据树判断谁更近缘，再用年代说明分化时间；注意「更早出现」不等于「更原始」，也不等于「就是祖先」。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/退化器官 vestigial organs；比较解剖学与比较生物化学证据": "退化器官是仍然存在但已明显缩小、失去原有功能的构造，如人的阑尾、尾骨、智齿与耳动肌，它们提示祖先曾需要这些结构，因而支持进化。比较解剖学比较同源器官（结构相同、功能可以不同，如人的手臂与鲸的鳍肢）；比较生物化学则比较 DNA 与蛋白质序列，差异越小亲缘越近。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/人类作为灵长类 / 大猿；种间差异源于 DNA 核苷酸序列差异": "人类属灵长目人科，与大猿（猩猩、大猩猩、黑猩猩）同属，并不是由现代猿类进化而来，而是与其有共同祖先。大猿科内各物种的差别归根到底来自 DNA 核苷酸序列的差异，序列差异越小说明亲缘越近、分化越晚。考点：人类最近的现存亲属是黑猩猩，两者 DNA 序列差异极小，但仍属不同物种。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/四大区分特征：大脑皮层相对大小、指趾活动度、姿势与运动、颌凸与齿列": "大猿科内的四个区分维度：大脑皮层相对大小（人最大，与智力、语言相关）、指趾活动度（人的拇指可对掌，特化出精细抓握，猿类拇指较短）、姿势与运动（人双足行走，猿类以臂行为主）、颌凸与齿列（人颌部不突出、犬齿小、齿弓呈抛物线形，猿类面中部明显前突且犬齿大）。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/运动方式：双足行走 bipedalism、臂行 brachiation、四足行走 quadrupedalism": "三种运动方式对应不同解剖适应：双足行走者枕骨大孔位于颅底中央、脊柱呈 S 形、骨盆宽而短呈碗状、股骨内倾形成携物角、足有足弓且拇趾不对生；臂行者肩关节活动度极大、手臂长而有力、指关节可挂钩；四足行走者四肢近等长、枕骨大孔靠后、骨盆窄长。考点：枕骨大孔位置是判断双足行走的关键。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/人科化石比较：Australopithecus afarensis / africanus、Paranthropus robustus": "南方古猿阿法种与非洲种体型纤细（gracile），脑容量小但已能双足行走，阿法种更早（约 320 万年前）、面部更突出。粗壮傍人 Paranthropus robustus 体格粗壮，颅顶有矢状嵴附着强大咀嚼肌，臼齿大而平，适应咀嚼硬植物，是特化的素食支系，并非现代人直系祖先。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/Homo habilis / erectus / neanderthalensis / sapiens 的脑容量与体型趋势": "总趋势是脑容量渐增、颌部渐平直：南方古猿约 500 mL；能人介于其与直立人之间，是最早制造石器的人属成员；直立人约 1000 cm³，会用火并制造阿舍利手斧；尼安德特人可达 1350–1400 mL、眉脊粗壮、枕部隆起，脑量大却不是现代人直系祖先；智人面部平坦、前额高。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/人亚科进化时间线；非洲化石点与 3D 化石模型": "时间线：约 500–600 万年前人亚科与猿类分化；南方古猿（阿法种约 320 万年前）已双足行走；能人最早制造石器；直立人约 180 万年前出现并走出非洲、会用火；尼安德特人约 10 万年前分布于欧亚；智人随后扩散全球。非洲关键化石点有哈达尔、奥杜威峡谷与南非洞穴遗址。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/工具文化趋势：从 Homo habilis 到 sapiens 的制造技术与材料演变": "工具文化由简到繁：能人的 Oldowan（奥杜威）石器只是把砾石打掉几片做成简单砍砸器；直立人进入 Acheulian（阿舍利）文化，制作两面加工、左右对称的手斧并会用火；尼安德特人的 Mousterian（莫斯特）文化用预制石核技术打出规整石片。考点：物种与工具文化对应。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/其他文化趋势：火的使用、埋葬、艺术、语言、农业": "除石器外还有一串文化证据：直立人开始用火（控制火、熟食）；尼安德特人已有埋葬死者与照顾伤病者的迹象；智人出现洞穴壁画、雕刻等艺术与装饰品；语言与符号能力随脑容量和前额叶的发展而出现；农业则是较晚近的发明，使人类从游猎转向定居，并改变了自己的食物结构与疾病谱。", "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/人类对环境的控制如何改变选择压力": "人类用火、穿衣、建房、医药与农业改变了自己所处的环境，从而削弱了原有的选择压力：御寒的衣物与住所使体毛与耐寒体型的优势下降；医疗与疫苗使许多致死疾病的等位基因不再被强烈剔除；农业带来新的饮食结构与疾病，也带来乳糖耐受等新的适应。结果是选择压力被人工化，方向与速度都改变了。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/校本任务：TT1（Ch1–3，10%）、ER1（7%）、Lab Assessment（10%）、EE（Ch1–8，20%）、ER2（Ch8–10，8%）、TT2（15%）、FE（30%）": "校内成绩构成：TT1 与 TT2 是分章测验，ER1/ER2 是拓展作答，Lab Assessment 考实验设计，EE 覆盖 Ch1–8 且占比最重，FE 是期末考占 30%。用法：把 EE 与 FE 当复习主线，ER 与 Lab 提前按评分标准练格式，别等考前才看。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/WACE 统考：3 小时 + 10 分钟阅读；Section 1 选择 30% + Section 2 简答 50% + Section 3 拓展作答 20%": "外部统考结构与配分：3 小时作答，外加 10 分钟阅读；Section 1 选择占 30%，Section 2 简答占 50%，Section 3 拓展作答占 20%。简答是分数主体，要练关键词加机制链的作答；Section 3 要求成段论述，要专门练结构，不能只背名词。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/NOTES（436 页）：Ch1–7 全套讲义 + 每章 Chapter Checklist 自查清单": "全课程主讲义合集，覆盖 Ch1–7 的完整内容，每章附 Chapter Checklist。复习用法：先拿 Checklist 逐条自问能不能讲出来，把讲不出的条目定位回讲义对应小节精读，不要从头重读一遍。注意它主要覆盖 Unit 3，Unit 4 进化内容要另找教材答案与真题。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/TUTORIALS（118 页）：Ch1–6 教程与答案（科学探究、内分泌、神经元、神经系统、血糖、肾单位与气体调节）": "按章节配套的练习册，含题目与评分答案。用法：先不看答案自己写一遍，再逐句对照评分答案补上漏掉的得分点——答案里的一句话往往就是一个得分点，这是练简答题最有效的方式；Unit 3 各章都有对应套题，可配合 Chapter Checklist 使用。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/LAB PROCEDURES（72 页）：15+ 实验手册与答案——反应时间、神经末梢、渗透、尿检、酶活性、显微镜、革兰染色、细菌培养": "实验手册与配套答案，含反应时间、神经末梢分布、渗透、尿检、酶活性、显微镜使用、革兰染色、细菌培养等十五个以上实验。用法：Lab Assessment 考的是实验设计而不是背结论，重点记每个实验的自变量怎么设、对照怎么做、为什么要重复，以及安全与伦理要点。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/TEXTBOOK ANSWER（394 页）：Human Perspectives 8th Ed. Ch1–13 + 7th Ed. Ch1–20 教材答案": "Human Perspectives 第 8 版 Ch1–13 与第 7 版 Ch1–20 习题答案合集。它是唯一系统覆盖 Unit 4（Ch9–13 的进化、人亚科与工具文化）的材料，而教师讲义只到 Ch7.4，故进化部分主用这一本；先自己做题，再用答案核对表述与关键词。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/REVISION SET（128 页）：Revision 1–7 + Mock Test 全套 + 拓展题三档水平范文": "综合性复习集，含 Revision 1–7、整套模拟卷，以及拓展题三档水平的范文。用法：Revision 用来按章查漏；模拟卷必须限时完成，练时间分配与 Section 3 的长答案；三档范文最有价值——对比低分与高分答案，看清分数差在机制链是否完整、有没有结合题目给出的情境。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/WACE EXAM PAPERS：2015–2025 历年真题 + 官方评分标准": "2015 至 2025 年的官方统考真题与评分标准。用法：留到最后阶段限时刷，做完必须逐题对照评分标准，把它当作得分点清单来记——同一考点的标准表述年年重复；同时统计高频考点（动作电位、肾单位、免疫、测年与人类进化）来决定复习时间的分配。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/DIGITAL LIBRARY：Ch1–13 录播课目录 + 按章整理的视频资源（动作电位、免疫、PCR、测年、双足行走等）": "按章整理的录播课与视频索引，覆盖 Ch1–13，含动作电位、免疫、PCR、测年、双足行走等难点专题。用法：适合某机制看文字看不懂时定点补课，尤其适合动作电位四阶段、突触传递、PCR 循环这类过程性内容；看完立刻回讲义用 Checklist 复述，否则只有印象、没有得分点。", "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/教师版课件：Ch1–Ch7.4 教材扫描 + 教师批注（364 页）": "教师版教材扫描件，含 Ch1–Ch7.4 的批注，能看出老师强调哪些点、补充了哪些例子。用法：批注处往往就是测验与简答题的落脚点，可用来校准复习重点；注意它只到 Ch7.4，Unit 4 没有教师批注，进化部分仍需依靠教材答案与历年真题。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/核心概念：cultural schemas 文化图式、cultural constructs 文化建构": "文化图式是一群人共享的认知框架，决定他们怎样解读世界；文化建构则是被社会塑造出来、并非天生自然的观念，比如种族、国族、所谓“正常”。读文本时追问：作者预设了哪套常识？哪些“理所当然”其实是被建构出来的？", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/多元社会与个人自由；commonality and difference 共通性与差异": "讨论澳洲如何在保障个人自由（信仰、语言、文化实践、灵性追求）与维护社群整体利益之间取舍。写作时用“共通—差异”双面结构：先找不同群体共享的价值，再指出张力所在，如文化实践与法律权利、性别平等。把某一文化写成铁板一块是典型失分。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/意义是协商而来而非既定（meaning is negotiated, not given）": "同一句话的意思不是字典给定的，而是在交际双方之间协商出来的；跨文化语境里，同一表述常被读出不同含义。分析时专门找“说话人本意是 X、听众却理解成 Y”的位置，说明语境与立场如何改变意义。只复述这句话的字面意思而不举文本例证，拿不到分。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/文本：Growing Up Aboriginal / Asian / African in Australia 三部文集": "Black Inc. 出版的三部自述文集，分别收录原住民、亚裔与非裔澳洲人书写成长经历的短篇。用它们时应按主题而非按篇目整理——身份、归属、种族歧视、家庭期待、语言失落，每个主题至少记牢两篇的具体细节（人物、场景、原话）与作者名。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/文本：Sticks and Stones and Such-like、The relative advantages of relearning my language、Cronulla to Papunya": "三篇自述：Badami 写名字被同学取笑怎样动摇文化认同；Amy Choi 写成年后重学母语带来的身份转向；Marlee Silva 写从 Cronulla 到 Papunya 的志愿经历如何推翻她对原住民身份的预设。引证要落到具体场景或原话，只说“作者感到被歧视”属证据不足。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/NRW 2020 材料：27 May Referendum、Mabo decision、Native Title": "1967 年 5 月 27 日公投以九成以上赞成票授权联邦为原住民立法并计入人口统计；1992 年 Mabo 判决推翻“无主地”的法律虚构，承认既有的土地权 Native Title，6 月 3 日为 Mabo Day。注意区分“公投赋权”与“判决承认既有权”。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/《Life in Australia — Australian Values and Principles》": "澳洲内政部发给签证申请人的价值观手册，多数签证申请人须签署 Australian Values Statement，承诺遵守法治、议会民主、男女平等、宗教与言论自由、“fair go”等原则。分析时要看出它同时在建构国族认同、界定“谁是澳洲人”，并隐含对移民同化的期待。", "AUSMAT May 2026 学习资料/ELD 英语/U3 · 澳大利亚作为文化共同体/澳洲国旗（米字旗/南十字星/联邦星）与国歌 Advance Australia Fair 解析": "米字旗象征与英国的历史纽带，南十字星代表南半球位置与探索，联邦星七角对应六州加领地与未来州。国歌 1984 年取代《God Save the Queen》，第二段“those who've come across the seas”是移民议题的现成证据。要注意象征包容与排他两面。", "AUSMAT May 2026 学习资料/ELD 英语/U4 · 语言与赋权/核心概念：power of language 语言的力量": "中心命题是：语言本身就是权力，它既能赋权（让人被听见、被承认），也能边缘化（用标签、被动语态、委婉语把某些人消音）。复习时准备几条证据链，每条写清“谁在说、用了什么词、谁被省略”。只喊“语言很有力量”而不落到词句层面，是主要失分点。", "AUSMAT May 2026 学习资料/ELD 英语/U4 · 语言与赋权/语言如何赋权或边缘化个体、群体与意识形态": "常见手段有贴标签与刻板化、以偏概全的类指、被动语态隐去施动者、委婉语（把拘留中心说成 facility）、术语门槛。答法分三步：先抄原句，再指认手段，最后说明效果——被边缘化的群体失去了什么话语位置。三步缺一不可，只列手段等于没分析。", "AUSMAT May 2026 学习资料/ELD 英语/U4 · 语言与赋权/文化概念化如何嵌入语言": "不同语言里沉淀着不同的文化分类方式：亲属称谓、敬语、时间与方位表达、颜色词、隐喻（如以“上下”喻地位）。考查方式是给出跨语言例子，让你指出语言预设了某种世界观。措辞要稳，说语言“倾向”或“便利”某种认知，不要断言语言决定思维。", "AUSMAT May 2026 学习资料/ELD 英语/U4 · 语言与赋权/修辞与劝服装置如何制造权力关系": "三大诉求是 ethos 信誉、pathos 情感、logos 逻辑，具体装置包括重复、三项并列、反问、对比、呼语与隐喻。分析要给出原文、指认装置、说明它把听众摆到什么位置。最常见错误是只报术语（“这里用了反问”）而不解释它如何让听众先接受说话人的前提。", "AUSMAT May 2026 学习资料/ELD 英语/U4 · 语言与赋权/文本：《Speeches that Changed the World》（含音频）": "收录历史著名演讲并附音频的选集，是 Unit 4 的指定文本来源。用它的方法是分三层记：说话人及其处境、这场演讲要改变听众的什么、语言上靠哪几个装置达成。听音频时标出声调、停顿与重音落在哪里，演讲稿写作与听力理解都从这里取材。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/语音特征：发音、重音、节奏、语调、音高；音素与词素": "口语评分中的 Fluency and clarity 就考这一项：能否用重音与语调突出要点，而不只是“念得准”。练法是朗读时给关键词加对比重音、在转折处换调。词素指最小意义单位（un-、-ness），拆词能帮助判断生词的词性与词义。L/D1 口音本身不扣分，影响理解才扣。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/非语言特征：文化合宜的手势与行为": "眼神接触、体距、点头与手势在不同文化里含义不同。Task 2A 与 Task 7 的口语评分明确包含“用非语言线索与听众互动”，全程低头读稿会掉到低档；评分同时要求以笔记和视觉辅助作提示而非照读。COAT 全程录像，机位在侧面，不要背对镜头。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/正字法：标点系统、学科词汇拼写、缩写符号、印刷体/草书": "涵盖标点（句号、大写、逗号、撇号、引号、冒号、分号、括号、感叹号）、学科术语拼写、常见缩写与符号。议论文语言讲义明确要求用高级标点：可主动使用冒号与分号，但不要用问号和感叹号。常错点有所有格撇号与专有名词大写。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/词汇能力：metalanguage、discourse markers、搭配 collocation、习语、口语化表达、同反义词、词汇链": "metalanguage 指评价文本用的术语（thesis、tieback）；discourse markers 标示因果与转折；collocation 指固定搭配。正式语体的硬指标是剔除口语词与缩写形式，并靠同反义词和词汇链衔接成篇。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/语法能力：从句与句子结构、词类、动词时态、情态、语态（主动/被动）": "要求混用简单句与复杂句：全篇短句拿不到高分，但用一串 and 拼长句也不算能力。时态要与内容一致，谈历史用过去时，陈述观点用现在时；情态动词表达确定程度；被动语态既可客观化，也会隐去施动者——分析文本时要专门指出后者。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/语法能力：四种从句类型（陈述/疑问/祈使/感叹）、名词化 nominalisation": "四种语气分别是陈述（提供信息）、疑问（含修辞性反问）、祈使（要求行动）、感叹（强化情绪），演讲稿会刻意混用以调动听众。名词化是把动词或形容词变成名词，如 decide→decision、diverse→diversity，能让学术语体更凝练客观，但堆太多会让句子僵硬难读。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/语法能力：四类连词（增补/比较/时间/因果）、主谓一致、直接与间接引语、指代衔接": "四类连词是增补（moreover）、比较（whereas）、时间、因果，不要反复用同一个。主谓一致在插入语和集合名词处最易出错。引用可用直接引语（加引号照抄）或间接引语（改人称与时态）；指代衔接要求 this、it、they 指向明确。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/语义能力：听主旨/论点/细节、语义场、言外之意、歧义、appraisal 评价理论、事实与观点": "听力要同时抓主旨、论证走向与具体细节，靠速记关键词短语而不是写整句。appraisal 指语言如何表达态度与强度（engagement、attitude、graduation），是分析评价性语言的工具。区分事实与观点、识别言外之意与歧义，是短答题的高频考点。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/社会语言学：澄清提问、意义协商、劝服语言、语域 register 实验、话轮起承转合": "口语互动要会主动澄清（Do you mean…?）与临场救场，COAT 与 Task 7 都看这一点。语域分熟悉、半正式、正式三档，须按场合切换；劝服语言包括呼语、反问与行动号召。话轮技巧指如何开启、承接并把话交回对方——COAT 是访谈，独白式背稿会被打断。", "AUSMAT May 2026 学习资料/ELD 英语/语言能力表 Language Table/社会文化：语域变异（熟悉/半正式/正式）、文化指涉、反讽与幽默、礼貌规范、眼神与体距": "要能辨认三种语域的标志（缩略、俚语、称呼方式），并解释文化指涉、反讽与幽默为何可能跨文化失效。礼貌规范、眼神与体距的差异既是分析对象，也是口语考试的隐性评分点。分析反讽必须指出字面义与真实义之间的落差，只说“很讽刺”不构成分析。", "AUSMAT May 2026 学习资料/ELD 英语/学术写作与文本分析/Discursive Essay 结构：引言 = 背景与语境 + 含 3 个分论点的论点句（漏斗式）": "引言先给背景，可选历史信息、当下趋势、概念定义或议题概述，再收束到一句 thesis statement：嵌入题目关键词并预告三个分论点，句式如 This essay will discuss…。漏斗式即由宽到窄。常见错误是在引言里就举证据或展开论证，把正文空间挤掉。", "AUSMAT May 2026 学习资料/ELD 英语/学术写作与文本分析/正文 3 段：Point/Topic sentence → Explanation（3 句，不放证据）→ Evidence/Example → Link（≥3 句分析 + Tieback）": "每段依次是主题句（含题目关键词）→ 解释（约三句，做定义或交代背景，此处不得插证据）→ 证据（所学文本的具体细节，忌讲故事式复述）→ 链接（至少三句分析，末句 tieback 复述分论点）。评分表看 thesis、topic、tieback 是否紧扣题目，链接缺位失分最重。", "AUSMAT May 2026 学习资料/ELD 英语/学术写作与文本分析/结论：重述论点 + 收尾，不引入新观点": "先用另一套措辞重述 thesis 并概括三段分论点，再给收尾：预测未来走向、下一步行动、可进一步探讨的角度或反思性洞察。硬性要求是不引入新论点或新证据。常见错误是在 tieback 句里用 In conclusion（属衔接词误用），或在结论里第一次抛出例子。", "AUSMAT May 2026 学习资料/ELD 英语/学术写作与文本分析/3-Whys Technique（5W1H 追问链）提升批判性思考深度": "对每个论断连续追问：我为什么这样说、这为何重要、它如何发生、怎样促成或避免、谁该负责。追问链能把段落里的链接部分撑到三句以上，直接抬高分析与评估一项的档位。只描述现象而连续追问三次都做不到，段落深度就不够，这是从中档进到高档的关键动作。", "AUSMAT May 2026 学习资料/ELD 英语/学术写作与文本分析/语言控制：正式衔接词（Anyway→Nevertheless）、高级词汇（Get→Obtain）": "把口语衔接换成书面衔接，如 Anyway→Nevertheless、But→However，但同一个衔接词不要连用多次。词汇上避免 like、good、a lot of 等笼统词，改用具体
