ays of interfering: blocking postsynaptic receptors (curare), inhibiting acetylcholinesterase so transmitter accumulates (organophosphate pesticides), preventing transmitter release (botulinum toxin) and promoting transmitter release (black widow spider venom). Exam point: be able to classify these as acting pre- or postsynaptically."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/6 类受体（温度/渗透压/化学/机械/痛觉/本体感受）与躯体/特殊感觉": {"name": "The 6 types of receptors (thermoreceptors/osmoreceptors/chemoreceptors/mechanoreceptors/pain/proprioceptors) and somatic/special senses", "note": "Receptors are grouped into six types by stimulus: pain nociceptor (tissue damage, ischaemia, excessive pressure and temperature), mechanical (sound waves, pressure, touch), chemical (chemicals, blood pH and gases), thermal (hot and cold), light (eye only) and osmotic osmoreceptor (plasma osmotic pressure, located in the hypothalamus)."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/反射与反射弧五部分：受体→感觉神经元→中间神经元→运动神经元→效应器": {"name": "Reflexes and the five parts of the reflex arc: receptor → sensory neuron → interneuron → motor neuron → effector", "note": "All five parts of the reflex arc are essential: the receptor detects the stimulus, the sensory neuron carries it in, the interneuron (in the grey matter of the spinal cord or brain) integrates it, the motor neuron carries it out, and the effector (muscle or gland) responds. The knee-jerk reflex contains only a sensory and a motor neuron (monosynaptic) and is still a reflex. Exam point: a reflex is an unconscious, rapid, automatic response, and answers must state where the interneuron is."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch3 神经元快速通讯/神经系统与内分泌系统比较：速度、持续时间、信息性质、特异性": {"name": "Comparing the nervous and endocrine systems: speed, duration, nature of the information, specificity", "note": "Nervous conduction uses electrical signals and neurotransmitters along fixed point-to-point pathways, is extremely fast (milliseconds), acts briefly and is precisely targeted; endocrine regulation uses hormones carried in the blood, has a slow onset (seconds to hours or longer), acts for a long time and is distributed body-wide but acts only on target cells with receptors. Exam point: both are coordinated by the hypothalamus, and a table comparing speed, duration, mode of transmission and specificity is common."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织": {"name": "U3 · Ch4 Organisation of the Nervous System", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/中枢神经系统 CNS 与三层保护：颅骨脊椎、脑膜、脑脊液": {"name": "The central nervous system (CNS) and its three layers of protection: skull and vertebral column, meninges, cerebrospinal fluid", "note": "Three layers of protection from outside in: the skull and vertebral column form the bony casing; the meninges are three layers - dura mater, arachnoid and pia mater; cerebrospinal fluid CSF fills the spaces between the meninges and the ventricles, cushioning against shock, supplying nutrients and maintaining intracranial pressure. Exam point: meningitis is infection of the meninges and a lumbar puncture samples cerebrospinal fluid; when answering about protection you must include bone, membranes and fluid."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/脑结构：大脑四叶（额/顶/颞/枕）、小脑、延髓、下丘脑、胼胝体": {"name": "Brain structure: the four lobes of the cerebrum (frontal/parietal/temporal/occipital), cerebellum, medulla oblongata, hypothalamus, corpus callosum", "note": "The frontal lobe handles thinking, planning, voluntary movement and the production of speech; the parietal lobe handles somatic sensation; the temporal lobe handles hearing and language comprehension; the occipital lobe handles vision. The cerebellum controls balance and coordination of movement, making voluntary movement smooth; the medulla oblongata contains the cardiac, respiratory and vasomotor centres and controls reflexes such as swallowing, coughing, sneezing and vomiting; the hypothalamus is the homeostasis centre (temperature, water and salt, feeding, endocrine coordination, autonomic control); the corpus callosum connects the two hemispheres."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/大脑功能分区与语言区：Broca 区（产生）与 Wernicke 区（理解）": {"name": "Functional areas of the cerebrum and the language areas: Broca's area (production) and Wernicke's area (comprehension)", "note": "The cerebral cortex is divided by function into sensory areas (interpreting impulses from receptors), motor areas (controlling muscles) and association areas (intelligence and emotion). The language areas are almost all in the left hemisphere: Broca's area in the frontal lobe is responsible for producing speech and articulation, and damage means the person cannot speak but can still understand; Wernicke's area in the temporal lobe is responsible for language comprehension, and damage means speech is fluent but meaningless and the person cannot understand others."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/白质与灰质；神经束 tracts": {"name": "White matter and grey matter; nerve tracts", "note": "Grey matter is mainly nerve cell bodies and dendrites, and lies on the surface of the brain (cortex) and in the centre of the spinal cord; white matter is mainly myelinated axons, and lies inside the brain and around the outside of the spinal cord, its colour coming from myelin. Fibre bundles within the CNS are called tracts and fall into three groups: association tracts connect areas of cortex on the same side, commissural tracts connect the two hemispheres, and projection tracts connect the cortex with the brainstem or spinal cord. Exam point: the inner-outer arrangement of grey and white matter is reversed between the brain and the spinal cord."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/周围神经系统 PNS：传入（躯体/内脏感觉）与传出（躯体运动 + 自主神经）": {"name": "Peripheral nervous system PNS: afferent (somatic/visceral sensory) and efferent (somatic motor + autonomic)", "note": "The PNS connects the CNS with the rest of the body. The afferent (sensory) part brings somatic and visceral sensory information into the CNS; the efferent part splits into two - somatic motor nerves supplying skeletal muscle (voluntary) and autonomic nerves supplying cardiac muscle, smooth muscle and glands (involuntary), with the autonomic nerves further divided into sympathetic and parasympathetic. Exam point: classification must be set out in two levels, afferent/efferent and then somatic/autonomic, and must not be mixed together."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/自主神经：交感 vs 副交感对各效应器（心、血管、瞳孔、消化、呼吸、汗腺）的对比": {"name": "Autonomic nervous system: sympathetic vs parasympathetic comparison across effectors (heart, blood vessels, pupils, digestion, respiration, sweat glands)", "note": "The sympathetic division works mainly with noradrenaline and dominates under stress: heart rate and contractility increase, blood vessels in skeletal muscle, the heart and the liver dilate while those in the viscera and skin constrict, the pupils dilate, bronchioles widen, digestive activity is inhibited and sweat secretion increases. The parasympathetic division works mainly with acetylcholine and dominates at rest: heart rate slows, pupils constrict, bronchioles narrow and digestion and urination are promoted. Exam point: the two are an antagonistic arrangement in which the same organ receives both sets of fibres."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch4 神经系统的组织/战斗或逃跑反应 fight or flight；脊髓背根与腹根结构": {"name": "Fight or flight response; structure of the dorsal and ventral roots of the spinal cord", "note": "Facing fear, anger, stress or competition the sympathetic division is activated and the adrenal medulla releases adrenaline and noradrenaline, raising cardiac output and blood pressure, increasing blood flow to skeletal muscle, widening the airways, raising blood glucose and increasing sweating, which strengthens and prolongs the response above. Spinal cord cross-section: the dorsal root contains sensory neuron axons and carries the dorsal root ganglion (where the sensory cell bodies are), and the ventral root contains motor neuron axons."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温": {"name": "U3 · Ch5 Homeostasis: blood glucose and body temperature", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/刺激-反应-反馈模型 SRF；负反馈 vs 正反馈": {"name": "Stimulus-Response-Feedback model SRF; negative feedback vs positive feedback", "note": "The SRF model links homeostatic mechanisms into one chain: stimulus (deviation from the set point), detection by a receptor, control centre (usually the hypothalamus or medulla), response by an effector, feedback. Negative feedback cancels the change and returns the body to the set point and is the mechanism for most hormones and for temperature regulation; positive feedback amplifies the change, as with oxytocin in childbirth and the clotting cascade. Exam point: receptor, control centre and effector must all be written."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/血糖：糖原分解、糖原生成、脂解、脂肪生成、糖异生": {"name": "Blood glucose: glycogenolysis, glycogenesis, lipolysis, lipogenesis, gluconeogenesis", "note": "Do not reverse the directions: glycogenesis = glucose to glycogen, glycogenolysis = glycogen to glucose (liver and muscle); gluconeogenesis = fat/protein to glucose (liver); lipogenesis = glucose to fat (liver); lipolysis = fat to fatty acids (liver)."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/血糖激素：胰岛素、胰高血糖素、肾上腺素、皮质醇及其分泌腺": {"name": "Blood glucose hormones: insulin, glucagon, adrenaline, cortisol and their secreting glands", "note": "The beta cells of the islets secrete insulin, the only hormone in the body that lowers blood glucose, promoting glycogenesis, lipogenesis and glucose uptake by cells; the alpha cells of the islets secrete glucagon, which raises blood glucose by promoting glycogenolysis and gluconeogenesis. The adrenal medulla secretes adrenaline (rapidly raising glucose under stress) and the adrenal cortex secretes cortisol (promoting glycogenolysis, gluconeogenesis and lipolysis). Exam point: insulin is the only hormone that lowers blood glucose."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/效应器：肝、肌肉、脂肪组织各自的独特反应": {"name": "Effectors: the distinct responses of liver, muscle and adipose tissue", "note": "The liver is central: when blood glucose is high it stores glucose as glycogen or converts it to fat; when blood glucose is low it breaks down glycogen and, through gluconeogenesis, converts fat and amino acids into glucose, and can also reuse lactate produced by muscle. Skeletal muscle can only store and break down its own glycogen for its own use and cannot release glucose back into the blood. Adipose tissue stores fat under the action of insulin and breaks fat down for energy under the action of glucagon and adrenaline."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/糖尿病 mellitus 与临床数据分析": {"name": "Diabetes mellitus and clinical data analysis", "note": "Type 1 diabetes is caused by destruction of the beta cells and an absolute lack of insulin, is more common in younger patients and requires insulin injection; type 2 is caused by fewer receptors or a reduced response in target cells (insulin resistance), is mostly linked to obesity and age, and can first be managed with diet, exercise and oral drugs. Exam point: read the blood glucose curve - a diabetic has a higher fasting glucose and a higher peak after eating that falls more slowly; glucose in the urine shows the renal threshold has been exceeded."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温：7 种产热/散热途径（辐射、传导、对流、蒸发等）": {"name": "Body temperature: 7 heat production/heat loss pathways (radiation, conduction, convection, evaporation, etc.)", "note": "Separate heat loss from heat production: metabolic heat production (a by-product of cellular respiration) is the only route that actually produces heat; radiation (emitting heat to the surroundings), conduction (exchanging heat with objects in direct contact), convection (moving air or water continually carrying heat away from the skin surface), evaporation (sweat vaporising and carrying away a large amount of heat) and excretion (passing warm urine and faeces and exhaling warm air) can only lose heat."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温效应器：血管舒缩、骨骼肌战栗、汗腺与竖毛肌、甲状腺素与肾上腺素、行为性调节": {"name": "Thermoregulatory effectors: vasoconstriction/vasodilation, skeletal muscle shivering, sweat glands and arrector pili muscles, thyroxine and adrenaline, behavioural regulation", "note": "When too hot, skin arterioles dilate so more blood flows to the surface and loses heat by radiation and convection, while sweat glands secrete more and lose heat by evaporation. When too cold, skin blood vessels constrict to reduce blood flow to the surface, skeletal muscles contract involuntarily and shiver to produce heat, arrector pili muscles contract to give goose bumps, thyroxine and adrenaline raise the metabolic rate, and behavioural responses appear such as putting on clothes, curling up and finding somewhere warm. Exam point: shivering produces heat, goose bumps produce almost none."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch5 稳态：血糖与体温/体温失调：低体温、中暑、热衰竭": {"name": "Thermoregulatory disorders: hypothermia, heat stroke, heat exhaustion", "note": "Hypothermia means the core body temperature is too low, so enzyme reactions and metabolism slow down and in severe cases there is loss of consciousness and irregular heartbeat. Heat exhaustion is usually caused by heavy sweating during intense exercise plus vasodilation, leading to dehydration and a fall in blood volume, with dizziness, weakness, cold clammy skin and low blood pressure; heat stroke is the complete failure of temperature regulation, with a very high core temperature, dry hot skin with no sweating and impaired consciousness, and can be fatal. Exam point: distinguish the two by sweating and skin condition."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态": {"name": "U3 · Ch6 Homeostasis of body fluids and gas concentrations", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/体液类型与分布：细胞内液 / 细胞外液（血浆、组织液）": {"name": "Body fluid types and distribution: intracellular fluid / extracellular fluid (plasma, interstitial fluid)", "note": "Body fluids are divided into intracellular fluid and extracellular fluid, and extracellular fluid includes plasma, tissue fluid and also lymph, cerebrospinal fluid and others. Extracellular fluid is the true internal environment of the cells, and its composition and osmotic pressure must stay stable. Exam point: substances moving between the blood and cells must cross two barriers, the capillary wall and the cell membrane; the main difference between plasma and tissue fluid is that plasma contains more plasma proteins."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/肾单位结构：肾小球、鲍曼囊、近曲小管、髓袢、远曲小管、集合管": {"name": "Nephron structure: glomerulus, Bowman's capsule, proximal convoluted tubule, loop of Henle, distal convoluted tubule, collecting duct", "note": "The nephron is the functional unit of the kidney and consists of the renal corpuscle and the renal tubule: the glomerulus is a ball of capillaries wrapped by Bowman's capsule, and together these are the renal corpuscle where filtration occurs; after that come the proximal convoluted tubule, the loop of Henle (which dips into the medulla and helps concentrate urine) and the distal convoluted tubule, which finally joins the collecting duct. Exam point: a diagram is often given to label each section and to ask which part is regulated by ADH or aldosterone."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/尿形成四步：滤过→重吸收→分泌→排泄；尿检 urinalysis": {"name": "Four steps of urine formation: filtration → reabsorption → secretion → excretion; urinalysis", "note": "Filtration occurs at the glomerulus and Bowman's capsule: high pressure forces water, glucose, amino acids, salts and small waste molecules into the capsule, while blood cells and plasma proteins are held back. Reabsorption occurs mainly in the proximal convoluted tubule, returning useful substances and water to the blood. Secretion is the active transfer of excess substances from the blood into the tubule. Finally the urine leaves via the collecting duct, ureter, bladder and urethra. Urinalysis for glucose, protein, blood cells and pH can indicate kidney disease or diabetes."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/渗透调节：下丘脑渗透压感受器、ADH→水通道蛋白 aquaporin、醛固酮→钠通道、口渴反应": {"name": "Osmoregulation: hypothalamic osmoreceptors, ADH → aquaporin water channels, aldosterone → sodium channels, thirst response", "note": "Water loss raises plasma osmotic pressure, which excites osmoreceptors in the hypothalamus, so the posterior lobe releases ADH, which acts on the distal convoluted tubule and collecting duct, increasing aquaporin water channels so more water is reabsorbed, giving a small amount of concentrated urine, and also causes thirst. Aldosterone is secreted by the adrenal cortex, acts at the same site and promotes Na⁺ reabsorption and K⁺ excretion, with water following osmotically. With plenty of water ADH falls and urine is dilute and plentiful."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/气体浓度：O₂/CO₂ 运输、CO₂ 浓度与血液 pH（碳酸/碳酸氢盐缓冲体系）": {"name": "Gas concentrations: O₂/CO₂ transport, CO₂ concentration and blood pH (carbonic acid/bicarbonate buffer system)", "note": "O₂ is carried mainly bound to haemoglobin in red blood cells, with a small amount dissolved in plasma; most CO₂ is carried in plasma as hydrogencarbonate, with a small amount bound to haemoglobin. CO₂ and water form carbonic acid catalysed by carbonic anhydrase, which dissociates to release H⁺, so a rise in CO₂ lowers pH. Carbonic acid and hydrogencarbonate form a buffer pair that keeps blood pH at about 7.35–7.45."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/中枢与外周化学感受器；延髓调节中枢；肋间肌与膈肌": {"name": "Central and peripheral chemoreceptors; medullary control centre; intercostal muscles and diaphragm", "note": "Two classes of receptor: the central chemoreceptors in the medulla are sensitive to CO₂ and H⁺, while the peripheral receptors in the aortic and carotid bodies are sensitive to O₂, CO₂ and pH. The control centre is the respiratory centre in the medulla, with an inspiratory and an expiratory area. The effectors are the diaphragm (phrenic nerve) and the intercostal muscles (intercostal nerves). Exam point: CO₂ is the strongest stimulus for breathing, and O₂ only matters when it falls very low."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch6 体液与气体浓度稳态/换气过度 hyperventilation：深潜的致命风险 vs 缓解焦虑的用途": {"name": "Hyperventilation: fatal risk in deep diving vs use for relieving anxiety", "note": "Rapid deep breathing blows off too much CO₂, raising blood pH and weakening the breathing drive. Hyperventilating before a dive seems to let you hold your breath longer, but not because you carry more oxygen - it is because the signal of rising CO₂ that drives the urge to breathe is lost, so the person loses consciousness from cerebral hypoxia before even feeling the need to breathe. When used to relieve anxiety, watch for dizziness, tingling in the hands and feet and other signs of respiratory alkalosis."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）": {"name": "U3 · Ch7 Defence against infection (immunity)", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/病原体四大类型：细菌、病毒、真菌、寄生虫": {"name": "Four major types of pathogens: bacteria, viruses, fungi, parasites", "note": "Learn them by structure and size: viruses are the smallest and are non-cellular, and must parasitise living cells; bacteria are single-celled prokaryotes that can reproduce independently; fungi are eukaryotes, often with hyphae and spores; parasites include protozoa and helminths, all eukaryotic with complex life cycles. Exam point: antibiotics work only on bacteria and not on viruses, fungi or parasites, a high-frequency short-answer question."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/细菌：原核 vs 真核、4 种形态（球菌/杆菌/螺旋菌/弧菌）、革兰氏染色与细胞壁结构": {"name": "Bacteria: prokaryotic vs eukaryotic, 4 shapes (cocci/bacilli/spirilla/vibrio), Gram staining and cell wall structure", "note": "Bacteria are prokaryotes: no membrane-bound nucleus and no membrane-bound organelles, but they have a cell wall, circular DNA and plasmids, and reproduce by binary fission. Shapes are cocci, bacilli, spirilla and vibrio. Gram stain steps are crystal violet primary stain, iodine mordant, alcohol decolouriser, safranin counterstain; Gram-positive bacteria have a thick peptidoglycan wall and stain purple, Gram-negative bacteria have a thin peptidoglycan layer with an outer lipopolysaccharide layer and stain red."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/病毒结构与复制方式；与细菌的三大区别": {"name": "Virus structure and replication; three key differences from bacteria", "note": "A virus has only a nucleic acid core (DNA or RNA) and a protein coat called the capsid, and some also have an envelope; it has no cell structure and no ribosomes, cannot metabolise or reproduce on its own and must use the host cell's machinery to replicate, so it is regarded as lying between non-living and living. Three differences from bacteria: non-cellular rather than a prokaryotic cell, cannot reproduce independently whereas bacteria divide by binary fission, and antibiotics do not work on viruses but do work on bacteria."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/6 种传播途径：直接接触、间接接触、体液、病媒、污染食物与水、空气飞沫": {"name": "6 modes of transmission: direct contact, indirect contact, body fluids, vectors, contaminated food and water, airborne droplets", "note": "These can be grouped into contact and non-contact: direct contact (touching, kissing), indirect contact (shared towels, utensils and other fomites), body fluid transmission (blood and sexual contact), vector transmission (mosquitoes and other carriers, e.g. malaria), contaminated food and water (faecal-oral route), and airborne droplets and aerosols. Exam point: prevention measures must match the specific route - for the vector route, for example, control and repel mosquitoes."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/外部防御（皮肤、黏膜、纤毛、胃酸、泪液、唾液等）与 4 种保护性反射": {"name": "External defences (skin, mucous membranes, cilia, stomach acid, tears, saliva, etc.) and 4 protective reflexes", "note": "The first line of defence includes skin (sebum and sweat inhibit microbes), mucous membranes, nasal hairs and cilia (sweeping mucus towards the pharynx), stomach acid and acidic vaginal secretions, lysozyme in tears and saliva, earwax and the flushing action of urination. The four protective reflexes each have a stimulus and a response: sneezing (irritation of the nasal mucosa), coughing (irritation of the lower respiratory tract), vomiting (overdistension of the stomach or toxins) and diarrhoea (increased peristalsis after intestinal irritation flushes the irritant away)."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/内部非特异性防御：吞噬作用、炎症（肥大细胞与组织胺）、发热（致热原与体温调定点上移）、淋巴系统": {"name": "Internal non-specific defences: phagocytosis, inflammation (mast cells and histamine), fever (pyrogens and rising temperature set point), lymphatic system", "note": "The second line of defence is not specific to a particular pathogen: phagocytes (neutrophils, macrophages) engulf and digest pathogens; damaged tissue releases histamine and other substances that dilate local blood vessels and increase permeability, producing redness, swelling, heat and pain and recruiting more phagocytes; pyrogens raise the hypothalamic set point and cause fever, which inhibits pathogen reproduction and speeds up the immune response; the lymphatic system filters tissue fluid and carries pathogens to lymph nodes."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/特异性免疫·体液免疫：B 细胞→浆细胞→抗体 6 种作用方式 + 记忆细胞": {"name": "Specific immunity · humoral immunity: B cells → plasma cells → antibodies, 6 modes of action + memory cells", "note": "Once activated by antigen, B cells proliferate and differentiate into plasma cells and memory cells, and plasma cells secrete antibodies. Six antibody actions: neutralising bacterial toxins or enzymes so they are inactivated, binding the surface of viruses to stop them entering cells, coating bacteria so phagocytes can engulf them, agglutinating bacteria, viruses or foreign blood cells, lysing pathogens (destroying their membrane), and reacting with soluble substances to make them insoluble so they can be phagocytosed. Memory cells make the secondary response faster and stronger."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/特异性免疫·细胞免疫：辅助 T / 细胞毒 T 细胞 + 记忆细胞；B 与 T 细胞比较": {"name": "Specific immunity · cell-mediated immunity: helper T / cytotoxic T cells + memory cells; B vs T cell comparison", "note": "T cells mature in the thymus and target intracellular pathogens, cancer cells and transplanted tissue. Helper T cells recognise antigen presentation and release cytokines, activating cytotoxic T cells and B cells; cytotoxic T cells use perforin to punch holes in the target cell membrane and release granzymes, triggering apoptosis. Comparison: B cells use antibodies against extracellular pathogens while T cells kill intracellular pathogens by direct contact, and both produce memory cells."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/免疫四大类型（主动/被动 × 自然/人工）；疫苗接种与群体免疫": {"name": "Four types of immunity (active/passive × natural/artificial); vaccination and herd immunity", "note": "Classified by the source of antibody and whether the body makes it: natural active = acquired after illness; natural passive = the baby receives maternal antibodies across the placenta or in breast milk; artificial active = vaccination, in which the body makes its own antibodies and memory cells with long-lasting protection; artificial passive = injection of antitoxin or immunoglobulin, which acts immediately but gives no memory cells and only short-lived protection. Herd immunity needs a high enough proportion of people immune to block transmission."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch7 抗感染防御（免疫）/抗生素（抑菌/杀菌、广谱/窄谱）与抗病毒药；耐药性 antibiotic resistance": {"name": "Antibiotics (bacteriostatic/bactericidal, broad-spectrum/narrow-spectrum) and antivirals; antibiotic resistance", "note": "Antibiotics act only on bacteria: by action they are bacteriostatic (inhibiting reproduction) or bactericidal, and by range broad-spectrum (affecting many bacteria, easily disrupting normal flora) or narrow-spectrum; antiviral drugs instead have to interfere with the virus entering the cell or replicating. Resistance arises from random mutation plus selection: too low a dose, an incomplete course or overuse leaves resistant bacteria behind to multiply. So the full dose and full course must be taken as prescribed, and antibiotics do not work on viral infections such as the common cold."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术": {"name": "U3 · Ch8 Technologies for treating disease", "note": "Key chapter for Science as a Human Endeavour"}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/重组 DNA 技术：限制性内切酶（平末端/黏末端）、DNA 连接酶、质粒": {"name": "Recombinant DNA technology: restriction enzymes (blunt/sticky ends), DNA ligase, plasmids", "note": "Each of the three tools has its job: restriction endonucleases recognise a specific sequence and cut the DNA, staggered cuts giving sticky ends and straight cuts giving blunt ends; the plasmid is the vector and must be cut with the same enzyme to produce complementary sticky ends; DNA ligase seals the gaps in the sugar-phosphate backbone, joining the gene of interest to the plasmid to form a recombinant plasmid, which is then put into bacteria to be amplified. Exam point: complementary sticky ends are the key, which is why both steps must use the same enzyme."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/细菌转化 transformation：热激、CaCl₂、LB 培养基、抗生素筛选": {"name": "Bacterial transformation: heat shock, CaCl₂, LB medium, antibiotic selection", "note": "Bacteria are first treated with CaCl₂ to increase the permeability of the cell wall and membrane and make them competent, then the recombinant plasmid is added and a short heat shock drives the DNA into the cells, which are then grown in LB medium to multiply. Because the plasmid carries a resistance gene, on medium containing antibiotic only bacteria that were successfully transformed survive and form colonies, completing the selection. Exam point: antibiotic selection picks out the bacteria that have taken up the plasmid; it is not about killing all the bacteria."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/基因治疗 gene therapy；干细胞与细胞替代疗法；组织工程": {"name": "Gene therapy; stem cells and cell replacement therapy; tissue engineering", "note": "Gene therapy introduces a normal gene into cells to replace a faulty one, and is mostly used for single-gene recessive disorders (cystic fibrosis, sickle cell anaemia, Huntington's disease), but it cannot repair severe organ damage that has already occurred. Cell replacement therapy uses stem cells induced to differentiate into healthy cells (such as neurons) which are then transplanted, to treat Alzheimer's disease and Parkinson's disease. Tissue engineering goes further, seeding stem cells onto a scaffold to grow three-dimensional tissue or organs."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/疾病治疗应用：糖尿病、甲亢/甲减、脑部疾病（Alzheimer's、Parkinson's）": {"name": "Disease treatment applications: diabetes, hyperthyroidism/hypothyroidism, brain disorders (Alzheimer's, Parkinson's)", "note": "Diabetes is treated with recombinant human insulin or insulin analogues; hyperthyroidism is treated with drugs, radioactive iodine or surgery to suppress or remove the thyroid, while hypothyroidism is treated by replacing thyroxine. Alzheimer's and Parkinson's are neurodegenerative diseases, and conventional drugs only relieve symptoms, so using healthy neurons differentiated from stem cells for cell replacement is now being explored. Exam point: be able to distinguish the two approaches of replacing what is missing and swapping out bad cells."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U3 · Ch8 治疗疾病的技术/合成激素；用重组 DNA 技术生产激素与疫苗": {"name": "Synthetic hormones; producing hormones and vaccines using recombinant DNA technology", "note": "Insert the human insulin gene into a plasmid, put it into bacteria or yeast, let them express it in large amounts and then extract and purify it to obtain a synthetic hormone - high yield, high purity, no reliance on animal pancreases, and it also avoids animal-borne pathogens and immune rejection. Vaccines can be produced the same way as subunit vaccines (taking only one antigenic protein from the pathogen), which is safer than traditional attenuated or inactivated vaccines. Exam point: rDNA products are proteins made using cells as factories."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化": {"name": "U4 · Ch9 Evolution produces change between generations", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/中心法则复习：DNA→RNA→蛋白质": {"name": "Central dogma review: DNA → RNA → protein", "note": "Genetic information flows DNA to (transcription) mRNA to (translation) protein: mRNA is transcribed from DNA in the nucleus following complementary base pairing, then goes to the ribosome where every three bases (a codon) correspond to one amino acid as it is translated into a polypeptide. Genes control characteristics by controlling protein synthesis. Exam point: a mutation that changes a codon but not the amino acid is a silent mutation."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/突变：基因突变与染色体突变、诱变剂 mutagens；突变是新等位基因的最终来源": {"name": "Mutation: gene mutations and chromosomal mutations, mutagens; mutation is the ultimate source of new alleles", "note": "Gene mutations affect only one gene and may be point mutations (base substitution) or frameshift mutations (insertion or deletion that throws the reading frame out completely); chromosome mutations affect many genes or a whole length of chromosome, such as deletion, duplication, inversion, translocation and aneuploidy (caused by non-disjunction). Mutagens such as radiation and certain chemicals raise the mutation rate. Mutations are random and undirected, yet they are the ultimate source of new alleles."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/变异来源：突变、独立分配、交叉互换、随机受精、不分离 non-disjunction": {"name": "Sources of variation: mutation, independent assortment, crossing over, random fertilisation, non-disjunction", "note": "Random orientation of homologous chromosomes into gametes during meiosis (independent assortment) and crossing over between homologous chromosomes, together with the new alleles provided by mutation and random fertilisation, all create the variety of gene combinations in the offspring. Non-disjunction is the failure of a pair of chromosomes or sister chromatids to separate during meiosis, giving gametes with an abnormal chromosome number (e.g. trisomy 21). Exam point: only mutation produces new alleles; the rest merely recombine them."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/基因库 gene pool 与等位基因频率的动态变化": {"name": "Gene pool and dynamic changes in allele frequencies", "note": "The gene pool is the sum of all the alleles in a population, can be described by allele frequencies, and is used to compare populations of the same species at different times or places. Allele frequencies are dynamic and are affected by mutation, selection pressure, random genetic drift (including the founder effect) and gene flow. Exam point: evolution is defined as the change in allele frequencies in a population's gene pool from generation to generation - individuals do not evolve, populations do."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/进化机制：基因流/迁移、随机遗传漂变（含奠基者效应）、自然选择、选择压力": {"name": "Mechanisms of evolution: gene flow/migration, random genetic drift (including the founder effect), natural selection, selection pressure", "note": "Gene flow is the movement of alleles between populations as individuals migrate, and it reduces differences between populations; random genetic drift is chance fluctuation in allele frequencies in small populations, unrelated to whether they are adapted, and the founder effect is a special case (a few individuals found a new population whose gene pool is not representative); natural selection is directional, with selection pressure leaving more offspring from individuals with favourable phenotypes. Exam point: the effect of drift gets stronger as the population gets smaller."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch9 进化产生代际变化/物种形成 speciation；案例：镰状细胞贫血": {"name": "Speciation; case study: sickle cell anaemia", "note": "Speciation requires reproductive isolation first: a geographical barrier interrupts gene flow and the separated gene pools change independently under natural selection and drift until they can no longer interbreed. Sickle cell anaemia is the classic case: in malarial regions heterozygotes (sickle cell trait) resist malaria and have a survival advantage over both normal homozygotes and affected homozygotes, so the disease allele is kept at a high frequency, which is called heterozygote advantage."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据": {"name": "U4 · Ch10 Biotechnology provides evidence for evolution", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/聚合酶链反应 PCR": {"name": "Polymerase chain reaction PCR", "note": "A specific DNA fragment is amplified in large amounts in vitro, each round having three steps: high temperature denaturation separates the double strands, cooling anneals the primers to the complementary sequences, and heating extends them as Taq polymerase synthesises a new strand from the primer. Taq comes from a thermophilic bacterium and can withstand high temperatures without denaturing, so the cycle can be repeated and the amount of product about doubles each round, growing exponentially. Exam point: the order must be denaturation, annealing, extension."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/凝胶电泳 gel electrophoresis、DNA 指纹、Sanger 测序": {"name": "Gel electrophoresis, DNA fingerprinting, Sanger sequencing", "note": "DNA is negatively charged and moves towards the positive electrode in an electric field; the gel acts as a molecular sieve so shorter fragments travel further, separating DNA by length, and the banding pattern is a DNA fingerprint that can be used for paternity testing, forensics and species comparison. Sanger sequencing adds chain-terminating dideoxynucleotides to the reaction so strand synthesis stops at random, and the sequence is then read off by length. Exam point: PCR amplifies, electrophoresis separates."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/比较基因组学 comparative genomics、比较蛋白质（氨基酸序列差异）、生物信息学": {"name": "Comparative genomics, comparative proteins (amino acid sequence differences), bioinformatics", "note": "Comparative genomics studies and compares the genome sequences of different species to find shared and differing genes; comparative proteins compare the amino acid sequence differences of the same protein between species. The smaller the differences, the closer the relationship and the shorter the time since divergence. Bioinformatics uses computers and statistical tools to handle these huge sequence data sets and to build and correct phylogenetic trees. Exam point: both kinds of evidence rely on the amount of difference being proportional to the time since divergence."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/内源性逆转录病毒、线粒体夏娃、DNA 杂交": {"name": "Endogenous retroviruses, mitochondrial Eve, DNA hybridisation", "note": "All three are molecular-level evidence: endogenous retroviruses are fragments of ancient viruses inserted into the human genome that no longer move out again, and the same insertion position shows a common ancestor; mitochondrial Eve is the most recent common maternal ancestor of modern humans traced from mitochondrial DNA, which is inherited only through the mother; DNA hybridisation measures similarity by how well DNA from different species re-pairs after being separated into single strands. All three give consistent conclusions."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch10 生物技术提供进化证据/系统发生树的使用（不要求绘制）": {"name": "Using phylogenetic trees (drawing not required)", "note": "A phylogenetic tree uses branching to show common ancestors and the order of divergence between species: if two species branch at the same most recent common ancestor they are the closest relatives; the closer a branching point is to the present, the later the divergence; branch length can also show the amount of change. Exam point: you only need to read the diagram, judging which species are most closely related, which diverged first, and whether a trait is a shared derived character or convergent evolution; you are not required to draw one."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据": {"name": "U4 · Ch11 Other evidence for evolution", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/化石形成 fossilisation 与化石记录的不完整性": {"name": "Fossilisation and the incompleteness of the fossil record", "note": "A fossil forms when the remains, traces or impressions of an organism are replaced by minerals or preserved in sedimentary rock. The conditions are demanding: rapid burial, hard parts (bone, shell, teeth) and no decomposition or disturbance. The fossil record is therefore incomplete and represents only a small part of the biodiversity of the time; soft-bodied organisms, terrestrial organisms and those in forest environments are especially unlikely to leave fossils."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/相对测年：地层学 stratigraphy、标准化石 index fossils": {"name": "Relative dating: stratigraphy, index fossils", "note": "Relative dating only establishes order, not an absolute age. Stratigraphy uses the principle that in sedimentary rock the lower layers are older and the upper younger, together with the relationships of superposition and cross-cutting; index fossils are fossils with a short time range, wide geographical distribution, high numbers and easy identification, and they allow rock layers at different places to be correlated so the relative age of fossil-bearing layers can be worked out. Exam point: the key features of an index fossil are a short time range plus a wide distribution."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/绝对测年：碳十四、钾氩法及其各自局限": {"name": "Absolute dating: carbon-14, potassium-argon dating and their respective limitations", "note": "Radiometric dating relies on the constant rate of isotope decay and uses half-lives to calculate absolute ages. Carbon-14 has a half-life of about 5730 years; the carbon-14 in an organism is fixed at death and the ratio to carbon-12 then falls with decay, making it suitable for organic remains up to tens of thousands of years old; potassium-argon dating measures the decay of potassium-40 to argon in volcanic rock, with a half-life of about 1.25 billion years, and works for rocks millions to billions of years old but not for sedimentary rock itself."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/地质时间线；系统发生树 phylogenetic trees 的解读": {"name": "Geological timeline; interpreting phylogenetic trees", "note": "The geological timeline places fossils into eras, periods and epochs using the results of relative and absolute dating. You must be able to use the timeline to decide which period a fossil belongs to, and to read off the order of divergence and degree of relatedness from a phylogenetic tree. Exam point: the two are often combined in a question - first decide from the tree who is more closely related, then use the dates to state when they diverged; note that appearing earlier does not mean more primitive, nor does it mean being the ancestor."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch11 其他进化证据/退化器官 vestigial organs；比较解剖学与比较生物化学证据": {"name": "Vestigial organs; comparative anatomy and comparative biochemistry evidence", "note": "Vestigial organs are structures that are still present but clearly reduced and no longer serve their original function, such as the human appendix, coccyx, wisdom teeth and ear muscles; they suggest that ancestors once needed these structures and therefore support evolution. Comparative anatomy compares homologous structures (same structure, function may differ, such as the human arm and the whale flipper); comparative biochemistry compares DNA and protein sequences, and the smaller the differences the closer the relationship."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势": {"name": "U4 · Ch12 Hominin evolutionary trends", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/人类作为灵长类 / 大猿；种间差异源于 DNA 核苷酸序列差异": {"name": "Humans as primates / great apes; differences between species arise from differences in DNA nucleotide sequences", "note": "Humans belong to the order Primates, family Hominidae, along with the great apes (orangutan, gorilla, chimpanzee); humans did not evolve from modern apes but share a common ancestor with them. Differences between species within Hominidae ultimately come from differences in DNA nucleotide sequences, and the smaller the sequence difference the closer the relationship and the later the divergence. Exam point: the closest living relative of humans is the chimpanzee; the DNA sequence difference is very small, yet they are still different species."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/四大区分特征：大脑皮层相对大小、指趾活动度、姿势与运动、颌凸与齿列": {"name": "Four distinguishing features: relative size of the cerebral cortex, mobility of digits, posture and locomotion, jaw protrusion and dentition", "note": "Four distinguishing dimensions within Hominidae: relative size of the cerebral cortex (largest in humans, linked to intelligence and language), mobility of fingers and toes (the human thumb is opposable, specialised for a precision grip, while ape thumbs are shorter), posture and locomotion (humans are bipedal while apes mainly brachiate), and jaw projection and dentition (the human jaw does not project, canines are small and the dental arch is parabolic, while apes have a markedly protruding mid-face and large canines)."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/运动方式：双足行走 bipedalism、臂行 brachiation、四足行走 quadrupedalism": {"name": "Locomotion: bipedalism, brachiation, quadrupedalism", "note": "The three forms of locomotion match different anatomical adaptations: bipeds have the foramen magnum centred at the base of the skull, an S-shaped spine, a broad short bowl-shaped pelvis, inward-angled femurs forming a carrying angle, and a foot with an arch and a non-opposable big toe; brachiators have extremely mobile shoulder joints, long powerful arms and knuckle-walking hooks; quadrupeds have limbs of nearly equal length, a foramen magnum towards the back and a narrow long pelvis. Exam point: the position of the foramen magnum is the key to identifying bipedalism."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/人科化石比较：Australopithecus afarensis / africanus、Paranthropus robustus": {"name": "Hominid fossil comparison: Australopithecus afarensis / africanus, Paranthropus robustus", "note": "Australopithecus afarensis and africanus were gracile, with a small brain capacity but already bipedal, afarensis being earlier (about 3.2 million years ago) with a more projecting face. Paranthropus robustus was heavily built, with a sagittal crest on the skull roof for powerful chewing muscles and large flat molars, adapted to chewing tough plants; it was a specialised vegetarian side branch, not a direct ancestor of modern humans."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch12 人亚科进化趋势/Homo habilis / erectus / neanderthalensis / sapiens 的脑容量与体型趋势": {"name": "Brain size and body size trends in Homo habilis / erectus / neanderthalensis / sapiens", "note": "The overall trend is a gradual increase in brain capacity and a more flattened, straight jaw: Australopithecus about 500 mL; Homo habilis between that and Homo erectus, the earliest member of our genus to make stone tools; Homo erectus about 1000 cm³, using fire and making Acheulian hand axes; Neanderthals up to 1350–1400 mL, with heavy brow ridges and a projecting occiput, large-brained but not a direct ancestor of modern humans; Homo sapiens with a flat face and high forehead."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化": {"name": "U4 · Ch13 Evolution of the genus Homo", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/人亚科进化时间线；非洲化石点与 3D 化石模型": {"name": "Hominin evolutionary timeline; African fossil sites and 3D fossil models", "note": "Timeline: about 5–6 million years ago the hominins diverged from the apes; Australopithecus (afarensis about 3.2 million years ago) was already bipedal; Homo habilis made the earliest stone tools; Homo erectus appeared about 1.8 million years ago, left Africa and used fire; Neanderthals were distributed across Eurasia about 100 000 years ago; Homo sapiens then spread worldwide. Key African fossil sites include Hadar, Olduvai Gorge and the South African cave sites."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/工具文化趋势：从 Homo habilis 到 sapiens 的制造技术与材料演变": {"name": "Tool culture trends: evolution of manufacturing techniques and materials from Homo habilis to sapiens", "note": "Tool culture went from simple to complex: Homo habilis had Oldowan stone tools, simply knocking a few flakes off a pebble to make a chopper; Homo erectus moved into the Acheulian culture, making hand axes worked on both faces and symmetrical in shape and using fire; Neanderthals had the Mousterian culture, using a prepared core technique to strike regular flakes. Exam point: match species to tool culture."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/其他文化趋势：火的使用、埋葬、艺术、语言、农业": {"name": "Other cultural trends: use of fire, burial, art, language, agriculture", "note": "Besides stone tools there is a series of other cultural evidence: Homo erectus began to use fire (controlling it and cooking food); Neanderthals left signs of burying the dead and caring for the injured and sick; Homo sapiens produced cave paintings, carvings and other art and ornaments; language and symbolic ability appeared with the development of brain capacity and the prefrontal cortex; agriculture was a much later invention that moved humans from hunting and gathering to a settled life and changed their own diet and range of diseases."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/U4 · Ch13 人属进化/人类对环境的控制如何改变选择压力": {"name": "How human control of the environment changes selection pressures", "note": "Humans used fire, clothing, shelter, medicine and agriculture to change their own environment and so weakened the original selection pressures: clothing and shelter against the cold reduced the advantage of body hair and cold-tolerant body shape; medicine and vaccines meant the alleles for many fatal diseases were no longer strongly eliminated; agriculture brought a new diet and new diseases, and also brought new adaptations such as lactose tolerance. The result is that selection pressures have become human-made, changing both their direction and their speed."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源": {"name": "Assessment and supporting resources", "note": ""}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/校本任务：TT1（Ch1–3，10%）、ER1（7%）、Lab Assessment（10%）、EE（Ch1–8，20%）、ER2（Ch8–10，8%）、TT2（15%）、FE（30%）": {"name": "School-based tasks: TT1 (Ch1–3, 10%), ER1 (7%), Lab Assessment (10%), EE (Ch1–8, 20%), ER2 (Ch8–10, 8%), TT2 (15%), FE (30%)", "note": "School assessment structure: TT1 and TT2 are topic tests, ER1/ER2 are extended responses, the Lab Assessment tests experimental design, the EE covers Ch1–8 and carries the most weight, and the FE is the final exam worth 30%. How to use it: make the EE and FE your main revision thread, and practise the format of ER and Lab tasks against the marking criteria early rather than leaving them until just before the test."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/WACE 统考：3 小时 + 10 分钟阅读；Section 1 选择 30% + Section 2 简答 50% + Section 3 拓展作答 20%": {"name": "WACE external exam: 3 hours + 10 minutes reading time; Section 1 multiple choice 30% + Section 2 short answer 50% + Section 3 extended response 20%", "note": "Structure and marks of the external exam: 3 hours of working time plus 10 minutes reading; Section 1 multiple choice is worth 30%, Section 2 short answer 50% and Section 3 extended response 20%. Short answer carries most of the marks, so practise answers built from key words plus a chain of mechanism; Section 3 requires essay-style writing, so practise the structure specifically and do not just memorise terms."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/NOTES（436 页）：Ch1–7 全套讲义 + 每章 Chapter Checklist 自查清单": {"name": "NOTES (436 pages): full Ch1–7 lecture notes + Chapter Checklist self-check list for each chapter", "note": "The main lecture-note collection for the whole course, covering the full content of Ch1–7 with a Chapter Checklist at the end of each chapter. How to revise with it: first use the Checklist to ask yourself whether you can explain each item, then locate the items you cannot explain back to the matching section of the notes and read it closely, rather than rereading from the start. Note that it mainly covers Unit 3, so for Unit 4 evolution content you need the textbook answers and past papers."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/TUTORIALS（118 页）：Ch1–6 教程与答案（科学探究、内分泌、神经元、神经系统、血糖、肾单位与气体调节）": {"name": "TUTORIALS (118 pages): Ch1–6 tutorials with answers (scientific inquiry, endocrine system, neurons, nervous system, blood glucose, nephron and gas regulation)", "note": "A chapter-by-chapter workbook with questions and marking answers. How to use it: write your own answer first without looking at the answers, then go through the marking answer sentence by sentence and add the marking points you missed - one sentence in the answer is often one marking point, and this is the most effective way to practise short answers; every Unit 3 chapter has a matching set, and it can be used together with the Chapter Checklist."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/LAB PROCEDURES（72 页）：15+ 实验手册与答案——反应时间、神经末梢、渗透、尿检、酶活性、显微镜、革兰染色、细菌培养": {"name": "LAB PROCEDURES (72 pages): 15+ practical manuals with answers — reaction time, nerve endings, osmosis, urinalysis, enzyme activity, microscopy, Gram staining, bacterial culture", "note": "A laboratory manual with matching answers, containing more than fifteen experiments including reaction time, nerve endings, osmosis, urinalysis, enzyme activity, microscope use, Gram staining and bacterial culture. How to use it: the Lab Assessment tests experimental design rather than memorised conclusions, so focus on how the independent variable is set, how the control is done, why repeats are needed, and the safety and ethics points for each experiment."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/TEXTBOOK ANSWER（394 页）：Human Perspectives 8th Ed. Ch1–13 + 7th Ed. Ch1–20 教材答案": {"name": "TEXTBOOK ANSWER (394 pages): Human Perspectives 8th Ed. Ch1–13 + 7th Ed. Ch1–20 textbook answers", "note": "A collection of answers to the exercises in Human Perspectives 8th Ed. Ch1–13 and 7th Ed. Ch1–20. It is the only material that systematically covers Unit 4 (the evolution, hominin and tool culture content of Ch9–13), while the teacher's notes only go to Ch7.4, so use this book as the main source for the evolution section; do the questions yourself first, then use the answers to check your wording and key words."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/REVISION SET（128 页）：Revision 1–7 + Mock Test 全套 + 拓展题三档水平范文": {"name": "REVISION SET (128 pages): Revision 1–7 + complete Mock Tests + model answers for extended-response questions at three achievement levels", "note": "A comprehensive revision collection containing Revision 1–7, a full set of mock tests, and model answers at three levels for extended-response questions. How to use it: use the Revision sets to find gaps chapter by chapter; the mock tests must be done under time limits to practise time allocation and the long answers in Section 3; the three-level model answers are the most valuable - compare the low-scoring and high-scoring answers to see clearly whether the mark difference lies in how complete the chain of mechanism is and whether the context given in the question has been used."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/WACE EXAM PAPERS：2015–2025 历年真题 + 官方评分标准": {"name": "WACE EXAM PAPERS: 2015–2025 past exam papers + official marking criteria", "note": "Official past exam papers and marking criteria from 2015–2025. How to use them: save them for the final stage and work through them under time limits, then go through every question against the marking criteria and learn them as a list of marking points - the standard wording for the same point recurs year after year; also tally the high-frequency topics (action potential, nephron, immunity, dating and human evolution) to decide how to allocate revision time."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/DIGITAL LIBRARY：Ch1–13 录播课目录 + 按章整理的视频资源（动作电位、免疫、PCR、测年、双足行走等）": {"name": "DIGITAL LIBRARY: Ch1–13 recorded lesson catalogue + video resources organised by chapter (action potential, immunity, PCR, dating, bipedalism, etc.)", "note": "A chapter-by-chapter index of recorded lessons and videos covering Ch1–13, including focused topics on difficult points such as the action potential, immunity, PCR, dating and bipedalism. How to use it: good for targeted catch-up when a mechanism does not make sense from text alone, and especially suited to process content such as the four stages of the action potential, synaptic transmission and the PCR cycle; go straight back to the notes afterwards and recite it using the Checklist, otherwise you only have an impression and no marking points."}, "AUSMAT May 2026 学习资料/HBY 人体生物学/考核与配套资源/教师版课件：Ch1–Ch7.4 教材扫描 + 教师批注（364 页）": {"name": "Teacher's edition courseware: Ch1–Ch7.4 textbook scans + teacher annotations (364 pages)", "note": "A scan of the teacher's edition of the textbook with annotations for Ch1–Ch7.4, showing which points the teacher emphasises and which examples were added. How to use it: the annotations are often exactly where tests and short-answer questions land, so they can be used to calibrate your revision priorities; note that it only goes to Ch7.4 and there are no teacher annotations for Unit 4, so the evolution section still depends on the textbook answers and past papers."}, "AUSMAT May 2026 学习资料/PHY 物理": {"name": "PHY Physics", "note": "Physics ATAR Year 12 (ATPHY).\nUnit 3 = Motion and gravity + Electromagnetism; Unit 4 = Relativity + Quantum theory + Cosmology.\nAssessment: Tests 40% (TT1 14% + TT2 14% + EA 12%), Examination 50% (EE 20% + FE 30%), Science Inquiry 10% (practical assessment)."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）": {"name": "Prior knowledge (Year 11 review)", "note": "[1.01] PREKNOWLEDGE — foundations that must be mastered before starting the course"}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/向量 Vectors：标量与矢量、平行四边形/三角形法则、分量法、比例作图法": {"name": "Vectors: scalars and vectors, parallelogram/triangle laws, component method, scale diagram method", "note": "A vector has both magnitude and direction; a scalar has magnitude only. Add vectors with the tip-to-tail triangle method or the parallelogram method from a common origin, or resolve them into perpendicular components and add by direction. Common errors are adding vector magnitudes as if they were scalars and forgetting to state the final direction angle."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/向量应用：相对速度、速度变化量、力桌实验（合力与平衡力）": {"name": "Vector applications: relative velocity, change in velocity, force table experiment (resultant and equilibrant forces)", "note": "Relative velocity uses vector addition, v(A relative to ground)=v(A relative to B)+v(B relative to ground). Change in velocity Δv is the vector difference of final minus initial velocity, and its direction is not necessarily the same as the initial velocity. The force table experiment pulls a ring to equilibrium with three forces to verify vector addition; keep one consistent scale when drawing."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/力与斜面：牛顿三大定律、惯性、受力图 FBD、法向力": {"name": "Forces and inclined planes: Newton's three laws of motion, inertia, free body diagrams FBD, normal force", "note": "Newton’s three laws are the law of inertia, F=ma, and the action–reaction law. Inertia depends only on mass, not on speed. In a free body diagram draw only the forces acting on that object, and the normal force N is perpendicular to the contact surface; its magnitude follows from equilibrium and is not necessarily equal to mg."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/斜面分量：W∥ = mg sinθ、W⊥ = mg cosθ、N = mg cosθ；摩擦力（粗糙/光滑）": {"name": "Inclined plane components: W∥ = mg sinθ, W⊥ = mg cosθ, N = mg cosθ; friction (rough/smooth)", "note": "Resolve weight into components along and perpendicular to the incline: the component down the slope is mg sinθ and the perpendicular component is mg cosθ, so on a smooth incline N=mg cosθ. On a rough surface friction is f=μN, opposing motion when sliding, while static friction varies with the applied force until it reaches its maximum."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/运动方程：s = ut + ½at²、v = u + at、v² = u² + 2as；静力学与动力学、视重": {"name": "Equations of motion: s = ut + ½at², v = u + at, v² = u² + 2as; statics and dynamics, apparent weight", "note": "For uniformly accelerated straight-line motion the three equations relate velocity to time, displacement to time, and velocity to displacement: s=ut+½at², v=u+at, v²=u²+2as. Statics deals with zero net force and dynamics with non-zero net force; apparent weight in a lift is the normal force, not the weight."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/功与能：W = Fs = mgΔh、重力势能 PE = mgΔh、动能 KE = ½mv²": {"name": "Work and energy: W = Fs = mgΔh, gravitational potential energy PE = mgΔh, kinetic energy KE = ½mv²", "note": "Work is defined as force times displacement along the direction of the force, W=Fs, so the work done by gravity equals mgΔh. Gravitational potential energy PE=mgΔh and kinetic energy KE=½mv² are both measured in joules. Only the component of force along the displacement does work; a force perpendicular to the displacement does zero work, the most common place to lose marks."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/能量守恒与转化（PE↔KE→热）；非保守力做功；简谐运动弹簧能量互换": {"name": "Conservation and transformation of energy (PE↔KE→heat); work done by non-conservative forces; energy interchange in a simple harmonic motion spring", "note": "Mechanical energy converts between forms and the total is conserved as long as no non-conservative force does work; always define the zero potential energy level before writing the equation. Non-conservative forces such as friction convert mechanical energy into internal energy, so energy is still conserved but mechanical energy decreases. In a spring oscillator elastic potential energy and kinetic energy swap back and forth, each reaching a maximum twice per period."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/动量：p = mv、冲量 I = FΔt = Δp、动量守恒": {"name": "Momentum: p = mv, impulse I = FΔt = Δp, conservation of momentum", "note": "Momentum p=mv is a vector in the same direction as velocity; impulse equals the change in momentum, I=FΔt=Δp, which explains why cushioning reduces the impact force. Total momentum is conserved when the net external force on the system is zero. A common error is dropping the sign of a velocity in the conservation equation, so momenta in opposite directions get added instead of subtracted."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/碰撞类型：弹性（KE 守恒）、非弹性、完全非弹性；爆炸过程": {"name": "Collision types: elastic (KE conserved), inelastic, perfectly inelastic; explosion processes", "note": "An elastic collision conserves both momentum and kinetic energy; an inelastic collision conserves only momentum, with some kinetic energy becoming heat and deformation; in a perfectly inelastic collision the two objects stick together and move as one. An explosion is a zero-momentum system splitting in opposite directions. To classify a collision, first check whether kinetic energy is conserved, then set up the equations."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/直线运动：平均速度/加速度、匀加速三方程、自由落体": {"name": "Linear motion: average velocity/acceleration, three equations of uniformly accelerated motion, free fall", "note": "Average velocity equals total displacement divided by total time, not the arithmetic mean of the speeds of each stage. Acceleration is the rate of change of velocity, and an object slows down when acceleration is opposite to velocity. Free fall is uniformly accelerated motion starting from rest with a=g=9.80 m·s⁻² directed downwards."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/位移-时间图（斜率=速度）与速度-时间图（斜率=加速度、面积=位移）": {"name": "Displacement–time graphs (slope = velocity) and velocity–time graphs (slope = acceleration, area = displacement)", "note": "Keep the two graph types distinct: on a displacement–time graph the gradient is velocity, while on a velocity–time graph the gradient is acceleration and the area between the line and the time axis is displacement. The direction of curvature shows the sign of the acceleration; to find the gradient at a point you must draw a tangent, not a chord, and this is where marks are most often lost in graph questions."}, "AUSMAT May 2026 学习资料/PHY 物理/前置知识（Year 11 复习）/竖直抛体、反应时间与刹车距离": {"name": "Vertical projectile motion, reaction time and braking distance", "note": "Vertical projection is acted on by gravity alone, and the upward and downward stages are symmetric; at the highest point the velocity is zero but the acceleration is still g. The whole motion is handled with v=u+at and s=ut+½at², taking upwards as positive so a=−g. Total stopping distance is the distance travelled at constant speed during the reaction time plus the braking distance, so reaction time cannot be ignored."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能": {"name": "U3 · Lab Theory and Skills", "note": "[1.02] LAB THEORY — a complete methodology of scientific inquiry skills"}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/实验报告结构：Title / Aim / Theory-Hypothesis / Apparatus & Diagram / Procedure（被动语态）/ Results / Discussion / Conclusion": {"name": "Experiment report structure: Title / Aim / Theory-Hypothesis / Apparatus & Diagram / Procedure (passive voice) / Results / Discussion / Conclusion", "note": "A proper report must contain title, aim, theory and hypothesis, apparatus and diagram, method, results, discussion and conclusion. The method is the only basis on which someone else can reproduce the experiment, so write it in the past tense and passive voice with equipment specifications and the quantities measured. The conclusion may only answer the question posed in the aim and must not introduce new data."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/变量：自变量/因变量/控制变量；定性（名义、序数）与定量（离散、连续）": {"name": "Variables: independent / dependent / controlled; qualitative (nominal, ordinal) and quantitative (discrete, continuous)", "note": "The independent variable is what the experimenter deliberately changes, the dependent variable is the response being measured, and everything else that must be held constant is a controlled variable. Quantitative data is either discrete (countable) or continuous (measurable), while qualitative data is nominal or ordinal. Common errors are listing a controlled variable as the dependent variable, or failing to say exactly how it was kept constant."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/有效数字规则；加减法按小数位、乘除法按最少有效位；统一 3SF 或 3DP": {"name": "Significant figure rules; addition/subtraction by decimal places, multiplication/division by least significant figures; standardise to 3SF or 3DP", "note": "Significant figures record measurement precision: for addition and subtraction keep the least number of decimal places, and for multiplication and division keep the least number of significant figures. Final answers in this subject are written to 3 significant figures, while intermediate steps should carry one extra digit to avoid accumulating rounding error. Scientific notation avoids ambiguity such as 0.00."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/绝对不确定度（±1 最小分度、与均值的最大偏差）与百分比不确定度": {"name": "Absolute uncertainty (smallest scale division ±1, maximum deviation from the mean) and percentage uncertainty", "note": "The absolute uncertainty of a single reading on an analogue instrument is often taken as half the smallest division or one division, while for repeated measurements it is the maximum deviation or the mean absolute deviation. Relative (percentage) uncertainty equals the absolute uncertainty divided by the measured value, times 100%. Percentage uncertainty is usually found first because it is the form that can be compared and combined."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/不确定度合成：加减法直接相加、乘除法先转百分比再加；误差棒 error bars": {"name": "Combining uncertainties: add directly for addition/subtraction, convert to percentages and add for multiplication/division; error bars", "note": "The rule for combining uncertainties depends on the operation: for addition and subtraction add the absolute uncertainties directly, while for multiplication, division or powers convert each to a percentage first and then add. A constant coefficient carries no uncertainty, and for a power multiply the percentage by the exponent. On a graph an error bar is drawn as a vertical line segment through the point showing the uncertainty range."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/作图规范：轴标签含单位、分度用 2/4/5、占 ¾ 页面、最佳拟合线（不强行过原点）": {"name": "Graphing conventions: axis labels with units, scale divisions of 2/4/5, fill ¾ of the page, line of best fit (not forced through the origin)", "note": "Plot the independent variable on the horizontal axis and the dependent variable on the vertical axis, and label each axis as quantity / unit. Choose a scale in multiples of 2, 4 or 5 so values are easy to read, and let the line fill about three-quarters of the page. The line of best fit should pass evenly through the points; do not force it through the origin unless theory requires it."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/由最佳拟合线求梯度（画 gradient triangle），结果保留 2SF": {"name": "Finding the gradient from the line of best fit (drawing a gradient triangle), result to 2SF", "note": "Find the gradient by taking two points on the line of best fit and drawing a gradient triangle, choosing points as far apart as possible to reduce reading error rather than using the original data points. Give the gradient to 2 significant figures with its unit. If the graph is curved, linearise it first before finding the gradient, or take the gradient of the tangent at a point."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/线性化 linearisation：y = mx + c 映射，梯度/截距与物理量对应": {"name": "Linearisation: mapping to y = mx + c, matching gradient/intercept to physical quantities", "note": "Linearisation means rearranging a non-linear relationship into the form y=mx+c so the graph is a straight line, for example plotting T² against l or 1/v against 1/u. The gradient and intercept each correspond to some combination of physical quantities, so dimensional analysis is needed first to confirm their units. This is the standard method for experimental questions that ask you to determine a constant."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/误差类型：系统误差（未校准、方法缺陷）vs 随机误差（读数、低电量）": {"name": "Types of error: systematic error (lack of calibration, flawed method) vs random error (reading, low battery)", "note": "A systematic error has a fixed cause that shifts every reading in the same direction, such as an uncalibrated instrument, an incorrect zero or a flawed method; repeated measurement cannot remove it, so it must be fixed by calibration or an improved method. A random error has unpredictable causes and scatters readings about the true value, and it is reduced by taking many measurements and averaging."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/效度 validity / 信度 reliability / 准确度 accuracy / 精密度 precision 的区分": {"name": "Distinguishing validity / reliability / accuracy / precision", "note": "Validity asks whether the experiment really measured the intended physical quantity; reliability asks whether repeated measurements give consistent results; accuracy is how close a measured value is to the true value; and precision is how close repeated measurements are to one another. The four are independent: a set of measurements can be very precise yet very inaccurate because of systematic error."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 实验理论与技能/误差削减方法与讨论：对比理论值、% error / % difference、异常值识别": {"name": "Error reduction methods and discussion: comparison with theoretical values, % error / % difference, identifying outliers", "note": "The discussion should compare results with theoretical or literature values, calculate a percentage error or percentage difference and analyse where it came from. An outlier may be discarded only when there is a clear reason, such as a handling mistake or unstable equipment; otherwise keep it and include it in the discussion. Deleting data simply because a value deviates greatly is a classic mistake."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动": {"name": "U3 · Projectile Motion", "note": "Projectile Motion"}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/抛体定义与抛物线轨迹；水平与竖直分量相互独立": {"name": "Definition of a projectile and parabolic trajectory; horizontal and vertical components are independent", "note": "Projectile motion is two-dimensional motion under gravity alone, with a parabolic path. It can be treated in components because the horizontal and vertical directions do not affect each other, so they can be analysed separately on the same time axis. The deflection of a charged particle in a uniform electric field has the same mathematics and is called projectile-like motion."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/水平方向：a = 0，ux = vx = 常数，射程 R = ux·T": {"name": "Horizontal direction: a = 0, ux = vx = constant, range R = ux·T", "note": "There is no force horizontally, so the acceleration is zero and the horizontal component of velocity is constant throughout; the range equals the horizontal velocity times the time of flight, R=uxT. The key point is that the time of flight T is determined entirely by the vertical motion and is independent of the horizontal velocity, so it cannot be treated as a known quantity and substituted directly."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/竖直方向：a = −g，最高点时竖直速度 v_y = 0": {"name": "Vertical direction: a = −g, vertical velocity at the highest point v_y = 0", "note": "Vertically only gravity acts, so the acceleration is constantly −g (taking upwards as positive). At the highest point the vertical component of velocity is zero but the horizontal component is not, so the velocity at the top is not zero. At the same height the upward and downward speeds are equal, a symmetry that gives a quick check on whether an answer is reasonable."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/速度矢量分解：ux = u cosθ、uy = u sinθ": {"name": "Resolving velocity vectors: ux = u cosθ, uy = u sinθ", "note": "Resolve the initial velocity into a horizontal component u cosθ and a vertical component u sinθ, with θ measured from the horizontal. This resolution is the first step; afterwards the two directions are calculated independently. Common errors are taking the angle from the vertical, or substituting the resultant velocity straight into the vertical equation of motion."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/解题步骤：画图→分解→x/y 独立分析→三运动方程→勾股定理求合速度": {"name": "Problem-solving steps: draw a diagram → resolve components → analyse x/y independently → the three equations of motion → Pythagoras to find resultant velocity", "note": "The standard procedure is to draw a diagram and mark the known quantities, resolve the initial velocity, then apply the equations of motion separately in the horizontal and vertical directions, and finally combine the velocity components with Pythagoras and find the direction angle with tanθ. When asked for a velocity you must give both magnitude and direction; a bare number loses marks."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/互余角射出同射程（15°/75°）；45° 射程最大": {"name": "Complementary angles give the same range (15°/75°); 45° gives maximum range", "note": "For the same initial speed from the same level, two complementary launch angles (such as 15° and 75°) give the same range, and 45° gives the maximum range, because sin2θ takes the same value for a pair of complementary angles. Of a complementary pair the larger angle reaches a greater height and stays in the air longer, but the horizontal range is the same."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/空气阻力的影响：减小射程与最大高度、增大下落角度；与截面积和质量有关": {"name": "Effect of air resistance: reduces range and maximum height, increases the descent angle; depends on cross-sectional area and mass", "note": "Air resistance makes both the actual range and the maximum height smaller than the ideal parabola, makes the path asymmetric with a steeper descent, and slightly reduces the optimum launch angle below 45°. How much it matters depends on the frontal cross-sectional area, the mass and the speed. If a question asks about the difference between real and theoretical values, explain it in terms of energy loss and the direction of the drag force."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 抛体运动/抛体运动中的能量守恒；应用题型（投弹、射箭、踢球、投石机）": {"name": "Conservation of energy in projectile motion; applied question types (dropping a bomb, archery, kicking a ball, catapult)", "note": "With air resistance ignored, the mechanical energy of a projectile is conserved, so ½mu²=mgh+½mv² gives the speed directly from the height without needing the time. Vertically it obeys v²=u_y²−2gΔh. Finding an impact speed by energy is usually quicker and less error-prone than calculating the time first and then combining components."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动": {"name": "U3 · Circular Motion", "note": "Circular Motion (required by the syllabus)"}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/匀速圆周运动（水平面）": {"name": "Uniform circular motion (horizontal plane)", "note": "Uniform circular motion means the speed is constant but the direction of velocity changes at every instant, so the object is always accelerating and the motion is non-uniform velocity. The period T and frequency f are reciprocals, and angular velocity is written ω=2π/T=2πf. A common error is to think that because the speed is constant the acceleration and net force must be zero."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/向心力与向心加速度：F_c = mv²/r = mω²r": {"name": "Centripetal force and centripetal acceleration: F_c = mv²/r = mω²r", "note": "Centripetal acceleration points towards the centre with magnitude a_c=v²/r=ω²r; by Newton’s second law the net force producing it is the centripetal force F_c=mv²/r=mω²r. Centripetal force is a net effect, not a separate force, so it must never be drawn as an extra arrow on a free body diagram, the most typical mistake in this topic."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/倾斜弯道 banked track 与飞机转弯": {"name": "Banked tracks and aircraft turning", "note": "On a banked track the horizontal component of the normal force together with gravity supplies the centripetal force, and the ideal (frictionless) speed satisfies tanθ=v²/(rg), that is v=√(rg tanθ). When an aircraft turns, the horizontal component of the lift force acts as the centripetal force; the aircraft is banked to obtain that horizontal component rather than to maintain lift."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/竖直圆周运动（匀速与非匀速）；摩天轮顶点/底点的视重": {"name": "Vertical circular motion (uniform and non-uniform); apparent weight at the top/bottom of a Ferris wheel", "note": "In vertical circular motion the speed usually changes, and the tension together with the radial component of gravity supplies the centripetal force: at the lowest point T=mv²/r+mg and at the highest point T=mv²/r−mg, so the tension is greatest at the lowest point. On a Ferris wheel the apparent weight at the top is N=mg−mv²/r, less than mg, and greater than mg at the bottom."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/圆周运动中的能量守恒": {"name": "Conservation of energy in circular motion", "note": "When an object rises or falls along a curved track gravity does work and the speed changes, so you must first use conservation of energy to find the speed at that point and then apply Newton’s second law radially at that point. Both steps are needed: the centripetal force equation alone has no solution while the speed is unknown. The critical condition at the top is that N or T is just zero, which gives v=√(gr)."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 圆周运动/实验：锥形摆测向心力（图像法）": {"name": "Experiment: measuring centripetal force with a conical pendulum (graphical method)", "note": "In a conical pendulum the resultant of the tension and the weight supplies the centripetal force, giving F=mω²r, so a graph of F against ω² should be a straight line with gradient mr and zero intercept. The graphical method is used instead of a single-point calculation in order to average out random error and test whether the proportional relationship really holds, and the gradient can be used to recover the mass."}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动": {"name": "U3 · Gravity and Satellite Motion", "note": ""}, "AUSMAT May 2026 学习资料/PHY 物理/U3 · 重力与卫星运动/万有引力定律 F = GmM/r²；力的相互性与矢量性（沿两球心连线）": {"name": "Newton's law of universal gravitation F = GmM/r²; the force is mutual and vectorial (along the line joining the centres)", "note": "Any two point masses attract each other with force F=GmM/r² directed along the line joining them, and the pair forms an action–reaction pair, so the forces on the two bodies must be equal in magnitude. In calculations r is measured from t
