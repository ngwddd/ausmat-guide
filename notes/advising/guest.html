<div class="note-head"><a class="back" href="../../index.html">← 返回首页</a>
<h1>升学自检（非注册学生）</h1>
<div class="meta">自己备考、旁听或已经毕业的申请人：这一版去掉了所有需要学籍才能填的项（往期班次、校内考核日程、学校名称）。留下的是方向、专业要求、先修科目、语言与费用这些不看学籍的建议。</div></div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="student">1 · 学生情况</button>
  <button role="tab" aria-selected="false" data-tab="report">2 · 建议报告</button>
  <button role="tab" aria-selected="false" data-tab="coverage">4 · 规则总览</button>
</nav>

<div id="tab-student">
  <div id="validationBox"></div>
  <div class="grid">
    <section class="card">
      <h2>身份与学业状况</h2>
      <div class="field"><label for="fullName">姓名</label>
        <input type="text" id="fullName"></div>
      <div class="field"><label for="englishFirstLanguage">英语为母语</label>
        <select id="englishFirstLanguage"><option value="">— 未填写 —</option>
          <option value="true">是</option><option value="false">否</option></select></div>
      <div class="row2">
        <div class="field"><label for="targetAtar">目标 ATAR</label>
          <input type="number" id="targetAtar" min="0" max="99.95" step="0.05"></div>
        <div class="field"><label for="estimatedAtar">当前预估 ATAR</label>
          <input type="number" id="estimatedAtar" min="0" max="99.95" step="0.05"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="stillDeciding">仍在犹豫选什么专业</label>
          <select id="stillDeciding"><option value="false">否</option>
            <option value="true">是</option></select></div>
        <div class="field"><label for="fundingSecured">学费来源已落实</label>
          <select id="fundingSecured"><option value="">— 未填写 —</option>
            <option value="true">是</option><option value="false">否</option></select></div>
      </div>
    </section>

    <section class="card">
      <h2>升学意向</h2>
      <table><thead><tr><th style="width:34%">国家/地区</th>
        <th style="width:34%">专业方向</th><th>目标大学</th><th style="width:38px"></th></tr></thead>
        <tbody id="interestRows"></tbody></table>
      <button class="ghost mini" id="addInterest">+ 增加一行</button>
    </section>
  </div>

  <section class="card">
    <h2>选课与成绩</h2>
    <table><thead><tr><th style="width:16%">班次</th><th>科目</th>
      <th style="width:13%">成绩 (%)</th><th style="width:16%">已考权重 (%)</th>
      <th style="width:38px"></th></tr></thead>
      <tbody id="subjectRows"></tbody></table>
    <button class="ghost mini" id="addSubject">+ 增加一门</button>
  </section>

  <div class="toolbar">
    <button class="action" id="btnGenerate">生成报告 →</button>
    <button class="ghost" id="btnSave">保存到本浏览器</button>
    <button class="ghost" id="btnLoad">读取已保存</button>
    <button class="ghost" id="btnClear">全部清空</button>
    <button class="ghost" id="btnSample">载入示例学生</button>
  </div>
</div>

<div id="tab-report" class="hidden">
  <div id="reportWarnings"></div>
  <div class="toolbar">
    <button class="ghost" id="btnPrint">打印 / 存为 PDF</button>
    <button class="ghost" id="btnCopy">复制为文本</button>
    <button class="ghost" id="btnDownload">下载 .md</button>
  </div>
  <section class="card">
    <h2>建议报告 <span class="muted" id="reportStamp"></span></h2>
    <div class="report" id="reportBody"></div>
  </section>
</div>



<div id="tab-coverage" class="hidden">
  <div id="coverageSummary"></div>
  <section class="card">
    <h2>规则总览</h2>
    <table><thead><tr><th style="width:15%">类别</th><th>规则</th>
      <th style="width:9%">命中</th><th style="width:14%">核实状态</th></tr></thead>
      <tbody id="coverageRows"></tbody></table>
  </section>
</div>

</div>
