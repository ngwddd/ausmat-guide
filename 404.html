<script>
/* 404 会在任意深度返回，所以链接要按当前路径重算根前缀。
   先找到站点根：本仓库部署在 /ausmat-guide/ 下；本地 file:// 打开时算不出，
   就退回 './'（此时页面本身就在站点根，相对链接是对的）。 */
(function () {
  var m = location.pathname.match(/^(.*?\/ausmat-guide)\//);
  var root = m ? m[1] + '/' : './';
  document.querySelectorAll('[data-p]').forEach(function (el) {
    el.setAttribute('href', root + el.getAttribute('data-p'));
  });
  var css = document.querySelector('[data-css]');
  if (css) css.setAttribute('href', root + 'assets/style.css');
})();
</script>
